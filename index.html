    ["Admit Mark was right and remove the feature.",0,[-5,-10,-10],"The customers who used it complain, and the team wonders what decisions will survive."]],
   "Совместный разбор данных показывает, кому функция нужна, и сохраняет доверие. Ничего не менять или сразу убрать функцию значит не учиться на данных.",
   [["below target","ниже цели","Меньше запланированного значения.","Adoption is below target."],["jointly","совместно","Вместе с другими, а не по отдельности.","We decided jointly what to change."]])]),

/* 3. The engineer who wants to quit */
SC('sc03','Leadership','Carlos','Engineering Manager','Slack',["Team morale","Delivery speed","Trust in you"],
 {good:"Ira stays, and the team learns that raising problems leads to change. Your sprints become calmer and more predictable.",
  mid:"The situation improves for now, but some old habits remain and the team stays cautious.",
  bad:"Ira leaves, and others begin to look around. You are left with a tired team and a slower roadmap."},
 [SS("Your lead engineer, Ira, says she's burned out after three crunch releases and is thinking of leaving. What do you do?",null,
   [["Thank her for telling me, ask what's draining her, and agree to review the workload together this week.",15,[5,0,10],"Ira relaxes. She explains that unclear priorities, not hard work, are what exhausts her."],
    ["Offer her a bonus to stay through the next release.",5,[0,5,-5],"She takes the bonus, but her stress doesn't change."],
    ["Say everyone is tired, and the next release is too important.",0,[-10,0,-10],"Ira nods silently. The next day she starts updating her resume."]],
   "Сначала выслушать и разобраться в причинах вместе. Бонус не лечит причину, а фраза «все устали» обесценивает человека.",
   [["workload","рабочая нагрузка","Объём задач, который лежит на человеке или команде.","Let's review the workload together."],["crunch","авральный режим","Период интенсивной работы перед сроком.","We had three months of crunch."]]),
  SS("Ira says the real problem is that priorities change every week. Can you fix that?",
   "Ira says she already has an offer elsewhere. She also says that priorities change every week. Can you fix that?",
   [["Yes. I'll lock priorities for each sprint, route urgent requests through me, and tell stakeholders about the new rule.",15,[8,8,8],"Ira sees the change in action and the sprint becomes calmer."],
    ["I'll try to reduce the changes, but I can't promise anything.",7,[2,0,-3],"A few changes slip through, and Ira doubts that anything will improve."],
    ["That's how startups work. You'll need to adapt.",0,[-10,0,-10],"Ira stops arguing. She just says she'll think about it."]],
   "Конкретное правило и защита команды от хаотичных запросов решают проблему. Расплывчатые обещания не вызывают доверия, а фраза «адаптируйся» перекладывает вину.",
   [["shield","оградить, защитить","Закрыть команду от лишних запросов и давления.","A PM should shield the team from random requests."],["ground rule","базовое правило","Простое правило, о котором все договорились.","We set a ground rule for urgent requests."]]),
  SS("A VP asks you to add an urgent feature mid-sprint, which breaks your new rule.",null,
   [["Explain the rule, show the cost of swapping work, and offer to start it next sprint unless it replaces something.",10,[5,5,5],"The VP appreciates the clear trade-off and agrees to wait one week."],
    ["Add it and tell the team it's a one-time exception.",4,[-5,-3,-3],"The team sighs. Everyone expects the next exception."],
    ["Add it and don't mention the rule.",0,[-10,-5,-10],"Ira notices immediately. Trust in the new rule is gone."]],
   "Правило работает, только если его соблюдают: показываем цену замены и предлагаем срок. Исключения и молчаливое нарушение разрушают доверие к правилу.",
   [["exception","исключение","Случай, когда правило не применяют.","We made an exception once, and it became a habit."],["swap","поменять, заменить одно другим","Убрать одну задачу и поставить вместо неё другую.","We can swap this task for that one."]]),
  SS("Two weeks later, Ira asks if the rule will survive the next big client request.",null,
   [["Yes. I'll show the results: fewer interruptions and a faster sprint. For a real emergency, we'll decide together with you.",10,[8,5,8],"Ira tells the team the rule is real. Two engineers volunteer to help improve the process."],
    ["I hope so. We'll see.",4,[0,0,-3],"Ira nods, but she stays cautious."],
    ["Rules can change if the business needs it.",0,[-8,0,-8],"Ira reads this as a warning. She asks recruiters to call her back."]],
   "Уверенный ответ с цифрами и общим решением в чрезвычайной ситуации укрепляет доверие. Уклончивые ответы возвращают сомнения.",
   [["interruption","прерывание, отвлечение","Незапланированная просьба, которая сбивает работу.","Fewer interruptions made the sprint faster."],["survive","устоять, пережить","Сохраниться, несмотря на давление.","Will this rule survive the next request?"]])]),

/* 4. The price increase */
SC('sc04','Pricing','Priya','Data Analyst','Slack',["Revenue","Customer trust","Retention"],
 {good:"Prices go up in a controlled way, customers understand why, and revenue and retention both grow.",
  mid:"Revenue rises, but some customers are unhappy and trust is not fully rebuilt.",
  bad:"The price increase causes churn and angry customers. Revenue gains disappear within a quarter."},
 [SS("Leadership wants to raise prices by 20% next month. You have interview data but no experiment. What do you propose?",null,
   [["Propose a test with new customers only, a customer communication plan, and a decision date.",20,[5,5,0],"Leadership agrees. The test starts quickly and the risk stays small."],
    ["Raise prices for everyone, but grandfather customers who joined last year.",10,[8,-5,-3],"Revenue grows, but newer customers feel treated unfairly."],
    ["Raise prices for everyone as planned and see who leaves.",0,[10,-15,-15],"Within a week, churn doubles among small customers."]],
   "Тест на новых клиентах с планом коммуникации и датой решения ограничивает риск. Повышение для всех без эксперимента бьёт по удержанию.",
   [["grandfather","сохранить старые условия для действующих клиентов","Глагол: оставить прежнюю цену тем, кто пришёл раньше.","We will grandfather existing customers."],["price increase","повышение цен","Рост стоимости продукта для клиентов.","A price increase needs careful testing."]]),
  SS("The test shows conversion down 3% but revenue per user up 12%. Sales is worried.",
   "The test shows conversion down 3% but revenue per user up 12%. Angry emails from existing customers have already started to arrive.",
   [["Look at net revenue and early churn over a longer window, and share a clear summary with sales.",10,[3,3,3],"Net revenue is positive and early churn is flat. Sales calms down."],
    ["Declare it a success because revenue per user rose.",5,[3,-3,-3],"Sales feels ignored, and the churn problem isn't checked."],
    ["Cancel the test because conversion fell.",0,[-5,0,0],"You lose a chance to learn, and the old price stays."]],
   "Смотрим чистую выручку и ранний отток на более длинном окне, а не на одну метрику. Объявить успех или отменить тест из-за одной цифры неверно.",
   [["net revenue","чистая выручка","Доход после учёта потерь и скидок.","Net revenue matters more than conversion alone."],["early churn","ранний отток","Уход клиентов в первые недели после изменения.","Early churn stayed flat."]]),
  SS("A large customer writes: 'A 20% increase without notice is unacceptable. We're evaluating alternatives.'",null,
   [["Call them personally, listen, explain the value they get, and offer a transition period at the old price.",15,[10,10,8],"The customer appreciates the call. They stay and sign a longer contract."],
    ["Reply with a standard email explaining the new prices.",7,[0,-3,-3],"The customer is not impressed and keeps looking at competitors."],
    ["Offer them a 30% discount to calm things down.",0,[-8,5,0],"The customer stays, but word spreads and others ask for the same."]],
   "Личный разговор, объяснение ценности и переходный период сохраняют клиента без прецедента. Шаблонный ответ слишком холоден, а огромная скидка создаёт ожидания.",
   [["transition period","переходный период","Время, когда действуют старые условия до перехода на новые.","We offered a transition period."],["evaluate","оценивать, рассматривать","Сравнивать варианты перед решением.","We evaluate alternatives before we decide."]]),
  SS("Support says many customers don't understand the new plans. Tickets are up 40%.",null,
   [["Create a simple comparison page and a short FAQ, and brief support on how to answer.",10,[5,5,3],"Ticket volume drops within a week."],
    ["Tell support to answer each ticket individually.",5,[0,-3,0],"Support works late and customers wait longer."],
    ["Wait. The confusion will go away once people get used to it.",0,[-5,-5,-5],"Confusion becomes frustration, and some customers cancel."]],
   "Простая страница сравнения и FAQ снимают причину обращений, а поддержку нужно проинструктировать. Отвечать по одному или ждать значит не устранять причину.",
   [["FAQ","часто задаваемые вопросы","Список ответов на типичные вопросы клиентов.","We published a short FAQ."],["brief","проинструктировать","Коротко ввести в курс дела.","Brief support before the change goes live."]]),
  SS("Three months later, retention is stable and revenue is up 9%. The CEO wants to raise prices again.",null,
   [["Pause. Review churn, satisfaction and competitor prices first. A second increase would need its own test.",15,[3,8,8],"The CEO accepts the plan. The next change is based on data again."],
    ["Agree, but only for new customers again.",7,[5,0,0],"A safe choice, though the price gap between old and new customers grows."],
    ["Agree. It worked once, so it will work again.",0,[8,-10,-15],"The second increase triggers a wave of cancellations."]],
   "Одно удачное повышение не гарантирует второе: нужны данные по оттоку и конкурентам и отдельный тест. «Сработало раз, сработает снова» игнорирует эластичность спроса.",
   [["stable","стабильный","Не меняющийся сильно со временем.","Retention has been stable for three months."],["price elasticity","эластичность спроса по цене","Насколько сильно спрос реагирует на изменение цены.","We don't know the price elasticity yet."]])]),

/* 5. The pushy VP */
SC('sc05','Experiments','Nora','Chief of Staff','Slack',["Credibility","Data quality","VP relationship"],
 {good:"You become the person leaders trust with data. The VP asks you to review the next test before it starts.",
  mid:"The experiment ends without harm, but the VP still sees you as a brake.",
  bad:"Decisions follow pressure instead of evidence. The team stops believing in test results."},
 [SS("The VP ran an A/B test for three days. B is up 6%. She wants it rolled out to everyone tomorrow.",null,
   [["Thank her for moving fast, explain the sample size and weekly patterns, and propose a rollout plan once we reach significance.",15,[8,8,5],"The VP agrees to a short extension, impressed by the clear plan."],
    ["Roll out to 50% tomorrow and keep the test running on the rest.",7,[-2,-5,3],"Half of the users get B early, so your clean comparison is damaged."],
    ["Roll it out to everyone. The VP is senior.",0,[-10,-15,3],"Everyone is on B, so there is no control group left."]],
   "Объясняем риск малой выборки и недельных колебаний и предлагаем план. Раскатка на всех или на половину портит чистоту сравнения.",
   [["rollout plan","план раскатки","Шаги и условия постепенного запуска для пользователей.","We prepared a rollout plan."],["premature","преждевременный","Сделанный слишком рано.","A premature rollout is risky."]]),
  SS("After a week, B is still up 2%, but the result is not significant. The VP says: 'It's positive, isn't it? Let's ship.'",
   "Since B went to everyone, there is no control group anymore. The VP says: 'The numbers look positive. Let's keep it.'",
   [["It's positive but inconclusive. I'd extend the test by two weeks, or accept the risk consciously with a rollback plan.",15,[8,8,5],"The VP appreciates the honest options and chooses the extension."],
    ["Agree. Small gains are still gains.",7,[0,-5,5],"Shipping is easy, but nobody knows if the gain is real."],
    ["Say the test is meaningless and the whole approach is wrong.",0,[-8,0,-12],"The VP feels attacked and stops sharing plans with you."]],
   "Честно называем результат неубедительным и предлагаем варианты с осознанным риском. Соглашаться на шум или обесценивать тест разрушает доверие.",
   [["inconclusive","неубедительный, без чёткого вывода","О результате, по которому нельзя принять уверенное решение.","The result is positive but inconclusive."],["noise","шум, случайные колебания","Случайные отклонения, не связанные с изменением.","A 2% gain could be just noise."]]),
  SS("The extended test shows no difference. The VP is disappointed and asks what to do with the idea.",null,
   [["Document the learning, share it with the team, and explore why the idea didn't work. It may point to a better one.",10,[8,8,5],"The team uses the learning in the next test, and the VP sees the value."],
    ["Drop it quietly.",5,[0,0,-3],"Nobody learns anything, and a similar idea returns next quarter."],
    ["Run the test again until it shows a win.",0,[-10,-15,-5],"After several reruns, a 'win' appears and the team no longer trusts the numbers."]],
   "Неудачный тест это тоже результат: фиксируем вывод и изучаем причины. Перезапускать до «победы» значит выбирать удобные данные.",
   [["learning","вывод, урок","Знание, полученное из эксперимента.","The learning from the test is valuable."],["cherry-pick","выбирать удобные данные","Брать только те результаты, которые подтверждают желаемое.","Don't cherry-pick results."]])]),

/* 6. Two big clients */
SC('sc06','Roadmap','Ben','Account Executive','Slack',["Client A trust","Client B trust","Eng. focus"],
 {good:"Both clients feel respected. Client B passes the audit, Client A gets a firm date, and engineering stays focused.",
  mid:"One client is happy and the other is tolerating the delay. The relationship needs repair.",
  bad:"You disappoint both clients and distract engineering. Sales stops trusting the roadmap."},
 [SS("Client A wants API access. Client B wants advanced permissions. Both are worth about the same, and you can build only one this quarter.",null,
   [["Ask both what outcome they need and by when, then compare effort, strategic value and how many other customers need each.",15,[5,5,5],"Both clients appreciate being asked, and you get facts instead of opinions."],
    ["Pick the bigger company. They probably matter more.",7,[5,-8,0],"Client B hears about it indirectly and is upset."],
    ["Promise both and decide later who goes first.",0,[-5,-5,-10],"Engineering hears about two promised features and loses focus."]],
   "Сначала выясняем реальный результат и сроки и сравниваем по общим критериям. Выбор по размеру клиента или двойное обещание создаёт проблемы.",
   [["API access","доступ к API","Возможность подключать сторонние системы к продукту.","Client A wants API access."],["strategic value","стратегическая ценность","Насколько задача важна для долгосрочных целей компании.","Compare effort and strategic value."]]),
  SS("Interviews show Client A can use an existing export as a workaround for six months. Client B has an audit in two months.",
   "Client B learned that you promised both and is upset. Interviews show Client A can use an existing export as a workaround for six months, while Client B has an audit in two months.",
   [["Build permissions for Client B first, and offer Client A a documented workaround and a firm date for API access.",10,[5,8,5],"Client A accepts the workaround because the date is clear."],
    ["Build API access. It helps more customers in the long term.",5,[5,-10,0],"Client B misses its audit deadline and threatens to leave."],
    ["Ask the clients to negotiate between themselves.",0,[-8,-8,-5],"Both clients are annoyed that you passed the decision to them."]],
   "Дедлайн аудита у клиента B жёсткий, а у клиента A есть обходной путь, поэтому делаем сначала права доступа и даём A документированный обходной путь и дату. Перекладывать решение на клиентов нельзя.",
   [["audit","аудит","Официальная проверка соответствия требованиям.","Client B has an audit in two months."],["documented","задокументированный","Описанный письменно и доступный другим.","We offer a documented workaround."]]),
  SS("Engineering says permissions will take eight weeks, and Client B's audit is in six.",null,
   [["Reduce the scope to the bare minimum Client B needs for the audit, and ship the rest later.",15,[3,10,8],"Engineering finds a six-week plan, and the audit passes."],
    ["Ask engineering to work weekends to hit six weeks.",7,[0,5,-12],"The work is done on time, but morale drops."],
    ["Tell Client B the audit date is their problem.",0,[-3,-15,-3],"Client B starts talking to a competitor."]],
   "Сокращаем объём до минимума, нужного для аудита, остальное делаем позже. Работа по выходным вредит команде, а отказ клиенту теряет его.",
   [["bare minimum","минимально необходимое","Самое малое, что нужно для цели.","Ship the bare minimum for the audit."],["firm date","твёрдая дата","Срок, на который можно рассчитывать.","We gave Client A a firm date."]]),
  SS("Client A asks what is happening with API access, since they have been waiting.",null,
   [["Share the committed date and the workaround progress, and invite them to a beta when it's ready.",10,[10,3,3],"Client A feels respected and agrees to join the beta."],
    ["Say it's still planned, without a date.",4,[-3,0,0],"Client A starts to doubt your promises."],
    ["Say it's cancelled because of Client B.",0,[-10,-5,0],"Client A is angry, and Client B hears about the comment."]],
   "Честный апдейт с датой и приглашением в бету сохраняет доверие. Размытое обещание или перекладывание вины на другого клиента разрушают его.",
   [["committed","твёрдо обещанный","О сроке или обязательстве, которое точно выполнят.","This is a committed date."],["keep you posted","держать вас в курсе","Регулярно сообщать новости.","I'll keep you posted."]])]),

/* 7. Onboarding on a budget */
SC('sc07','Onboarding','Leo','Customer Success Manager','Slack',["Activation","Budget","Team capacity"],
 {good:"Activation rises steadily without breaking the budget. The team learns a repeatable way to improve onboarding.",
  mid:"Activation improves a little, but money and time are spent on things that did not matter much.",
  bad:"The budget is gone and activation barely moves. Leadership asks whether onboarding is a priority at all."},
 [SS("Only 30% of new users finish onboarding. You have a small budget and one designer for a month. Where do you start?",null,
   [["Look at the funnel to find the biggest drop-off point, watch session recordings, and talk to five users who dropped.",15,[5,5,3],"The data points to one step that loses almost half of the users."],
    ["Redesign the whole onboarding with the designer.",7,[0,-10,-10],"A month passes, and you can't tell which change helped."],
    ["Add a video tutorial at the start.",0,[-3,-3,-3],"Only a few people watch it, and the drop-off stays the same."]],
   "Начинаем с анализа воронки, записей сессий и разговоров с теми, кто ушёл. Полный редизайн и видео не решают конкретную проблему.",
   [["drop-off point","место отвала пользователей","Шаг воронки, на котором уходит больше всего людей.","Find the drop-off point first."],["walkthrough","пошаговое руководство","Показ, как пользоваться продуктом, шаг за шагом.","An interactive walkthrough helps new users."]]),
  SS("The data shows 45% of users leave at the 'connect your calendar' step. Interviews say users don't trust the app yet.",
   "The video was watched by only 8% of users. The data shows 45% leave at the 'connect your calendar' step, and interviews say users don't trust the app yet.",
   [["Move the calendar step later and let users see value first with sample data.",15,[10,0,3],"Users reach the first success before being asked for access."],
    ["Add a reassuring message about privacy to the step.",7,[3,0,0],"A small improvement, but the step is still early and scary."],
    ["Make the step mandatory and remove the skip button.",0,[-8,0,0],"More users hit the wall and leave the app."]],
   "Люди не доверяют приложению, поэтому сначала показываем ценность на демонстрационных данных, а доступ просим позже. Принудительный шаг только увеличивает отток.",
   [["sample data","демонстрационные данные","Примеры данных, которые показывают, как работает продукт.","Sample data shows the value quickly."],["mandatory","обязательный","Такой, который нельзя пропустить.","A mandatory step makes users leave."]]),
  SS("The engineer says moving the step takes two weeks. Your budget allows only one other change.",null,
   [["Ship the minimum version: reorder the steps behind a feature flag and test it on 20% of new users.",10,[5,5,5],"The test starts in a week, and the risk is small."],
    ["Wait until you can build the perfect version.",4,[0,0,-5],"Two months pass and nothing changes."],
    ["Skip testing. The change is obviously better.",0,[-5,0,0],"You can't prove the effect, and a bug in the new flow goes unnoticed."]],
   "Минимальная версия за фича-флагом на части пользователей даёт данные быстро и безопасно. Ждать идеала или не тестировать значит терять время или контроль.",
   [["feature flag","фича-флаг","Переключатель, который включает функцию для части пользователей.","We hide the change behind a feature flag."],["reorder","переставить","Поменять порядок шагов или элементов.","Let's reorder the steps."]]),
  SS("After two weeks, activation rose from 30% to 38% in the test group, but support tickets about 'missing steps' increased.",null,
   [["Keep expanding the test, add a short guide for the new flow, and watch tickets as a guardrail.",10,[8,3,3],"Activation holds at 38% and the tickets disappear after the guide."],
    ["Roll out to everyone now. Activation is what matters.",5,[5,0,-5],"Activation rises, but support gets a wave of questions."],
    ["Stop the test. Any increase in tickets is a failure.",0,[-5,0,0],"You lose a real improvement."]],
   "Рост активации важен, но растущие обращения нужно учитывать как защитную метрику: расширяем тест и добавляем подсказку. Останавливать или раскатывать вслепую неверно.",
   [["expand","расширять","Увеличивать долю пользователей или объём изменения.","Let's expand the test to 50% of new users."],["new flow","новый сценарий","Обновлённая последовательность шагов пользователя.","The new flow needs a short guide."]])]),

/* 8. The vendor negotiation */
SC('sc08','Negotiation','Anna','Vendor Account Manager','Email',["Price","Relationship","Flexibility"],
 {good:"You secure a fair price with a cap, keep the relationship healthy, and protect your options for the future.",
  mid:"The deal is acceptable, but it costs you flexibility or goodwill.",
  bad:"You end up with a higher price, a damaged relationship, or both."},
 [SS("Your product depends on Anna's company for payments. They announce a 25% price increase from January and offer a three-year contract at the old price.",null,
   [["Ask for data on how pricing was calculated, request a shorter term, and prepare alternatives in parallel.",15,[5,3,8],"Anna shares the data and sees you are serious."],
    ["Sign the three-year contract. It's safer.",7,[8,0,-12],"The price is safe, but you are locked in for three years."],
    ["Reject it and announce you'll switch providers next month.",0,[-5,-12,-5],"Anna stops being flexible and engineers realize switching takes months."]],
   "Просим обоснование цены, более короткий срок и параллельно готовим альтернативу. Подписать на три года без анализа или резко отказаться одинаково рискованно.",
   [["lock in","зафиксировать условия","Закрепить цену или условия на определённый срок.","We want to lock in the old price."],["switching cost","стоимость перехода","Затраты времени и денег на смену поставщика.","The switching cost is four months of work."]]),
  SS("Anna offers a two-year contract with a 12% increase. Engineers say switching providers would take four months.",
   "Anna writes: 'Since you rejected our offer, the best I can do now is a 20% increase.' Engineers say switching providers would take four months.",
   [["Counter with a two-year deal, a 5% increase and a price cap for year two, and mention you are testing a backup provider.",15,[8,0,8],"Anna returns with a better offer."],

/* ================= REWRITTEN CASES (new format: 4 balanced options with points and comments) ================= */
function R(id,steps){
  var c=null;for(var i=0;i<CASES.length;i++){if(CASES[i].id===id){c=CASES[i];break;}}
  if(!c)throw new Error('no case '+id);
  steps.forEach(function(s,i){
    var st=c.steps[i];
    var opts=s[1],max=0;opts.forEach(function(o){if(o[1]>max)max=o[1];});
    if(s[0]!==null)st.msg=s[0];
    if(s.length>2)st.alt=s[2];
    var prev=st.options||[];
    st.options=opts.map(function(o,j){var pv=prev[j]||{};return {t:o[0],p:o[1],ok:o[1]===max,c:o[2],e:o[3]||pv.e,r:o[4]||pv.r};});
    st.explain='';
  });
}

 ["Track activation and onboarding NPS as measurable results, and set the target after two weeks of baseline data.",6,"Уточнение базы разумно, но цель откладывается, а команде нужна ясность сразу."],
 ["Use a checklist of five onboarding improvements to ship, and report how many are completed each month.",3,"Измеряет выпущенные задачи, а не результат для пользователей."],
 ["Keep the objective as it is and judge progress by feel at the quarter's end, with a short review.",0,"Нет измеримого результата, оценка превращается в мнение."]]]]);

R('b15',[["A competitor launched the feature we planned for Q4. Alex wants to rush ours in four weeks instead of ten. Early interviews suggest customers care more about speed than extra options.",[
 ["Keep our scope, sharpen the value proposition around speed, and differentiate on the faster experience customers value.",10,"Опирается на данные клиентов и делает ставку на то, где вы можете выиграть."],
 ["Match their feature list in six weeks by cutting two other roadmap items and moving the launch earlier.",6,"Сокращает отставание, но жертвует другими задачами ради копирования."],
 ["Ask five customers what they think of the competitor's feature before changing anything, then decide with Alex.",3,"Полезная проверка, но интервью уже есть, и решение можно принять быстрее."],
 ["Rush the original scope in four weeks with overtime so we launch right after them, whatever the cost.",0,"Спешка ради даты, а не ценности: риск качества и выгорания."]]]]);

R('b16',[["Ten customers asked for dark mode through support this week. Zoe thinks it's a must-have, and engineering says it's two weeks of work.",[
 ["Compare ten requests with our active user base, and rank dark mode against other opportunities by impact.",10,"Соотносит сигнал с размером аудитории и другими идеями, как и должна работать приоритизация."],
 ["Log it in the backlog as a nice-to-have and watch how requests grow over the next month.",6,"Осторожно, но пассивно: рост запросов не заменяет сравнение с другими идеями."],
 ["Ask the ten customers why they want dark mode and how they work today, then decide what to do.",3,"Полезные детали, но выборка из десяти слишком мала для приоритета."],
 ["Build it now, since ten requests in a single week is a strong signal and the work is small.",0,"Десять запросов это сигнал, но без сравнения с аудиторией и другими задачами это догадка."]]]]);

R('b17',[["Two finalists for the senior designer role: Mia has stronger craft, and Jonas collaborates better with the team. The panel is split 3 to 3.",[
 ["Agree what the team needs most this year, then score both finalists against those criteria.",10,"Решение опирается на потребности роли и общую оценку, а не на личные предпочтения."],
 ["Ask both finalists to do a paid one-day working session with the team, then compare the panel notes.",6,"Даёт больше данных, но стоит времени и кандидатам, и команде."],
 ["Choose Mia, because craft is hard to teach while collaboration can be coached over the first year.",3,"Аргумент логичен, но не учитывает, что нужно именно этой команде."],
 ["Choose Jonas, because team harmony matters more than individual talent and the panel is already split evenly.",0,"Тоже логично, но без критериев решение остаётся личным мнением."]]]]);

R('b18',[["Engineering says the feature will take six weeks. Sales promised the client three. The client is flexible about scope but not about the date.",[
 ["Ask engineering what drives the six weeks, then cut scope to what the client needs by their date.",10,"Использует гибкость клиента по объёму и опирается на пересчёт, а не на давление."],
 ["Ask engineering for an estimate of a minimum version, and discuss the risk openly with sales this week.",6,"Хороший шаг, но не фиксирует, какой объём нужен клиенту к его дате."],
 ["Tell the client six weeks, since the date is not negotiable for engineering, and offer them a discount.",3,"Честно по срокам, но клиент гибок по объёму, а не по цене."],
 ["Agree to three weeks and have engineering work extra hours to make the date the client was promised.",0,"Срок удерживается, но риск, выгорание и качество растут."]]]]);

R('b19',[["The board asks why we aren't building AI features like competitors. Our customers' top complaint is slow reporting, and two AI ideas are on the table.",[
 ["Explain that AI is a tool: start from the customers' biggest pain point, slow reporting, and weigh the alternatives.",10,"Начинает с проблемы клиента и оценивает технологию как один из вариантов решения."],
 ["Propose a small AI pilot on one use case while keeping the main focus on reporting speed this year.",6,"Компромисс: проверка идеи без смены стратегии, но делит внимание команды."],
 ["Promise AI features across the product next year to match the market, and name an owner for each.",3,"Отвечает на давление совета, но не решает главную проблему клиентов."],
 ["Say AI is a fad and there are no plans to explore it, so the team can stay focused.",0,"Закрывает тему и игнорирует возможность, которая может помочь клиентам."]]]]);

R('b20',[["The free plan costs about 30% of infrastructure spend, but marketing says it drives most signups. Priya has data on how free users convert.",[
 ["Analyze free-to-paid conversion and cost per free user, then test tighter limits instead of removing the free plan.",10,"Решает на данных и проверяет изменение с ограниченным риском."],
 ["Cap the free plan at one project and watch upgrades for a month before looking at the costs again.",6,"Экономит ресурсы и проверяет реакцию, но выбор лимита без анализа произволен."],
 ["Keep the free plan and ask finance to count its cost as a marketing expense in the budget.",3,"Сохраняет рост, но не решает вопрос окупаемости."],
 ["Remove the free plan outright, since only paying customers matter and infrastructure costs are already too high.",0,"Резкий шаг без данных: теряется воронка привлечения."]]]]);

R('b21',[["Sam asks which single metric the product team should focus on. Candidates are monthly revenue, total registered users, time spent in the app, and weekly active teams that complete a project.",[
 ["Choose weekly active teams completing a project: a north star metric tied to customer value.",10,"Связана с ценностью для клиента и опережает выручку."],
 ["Choose monthly revenue, even though it's a lagging indicator, and add weekly active teams as a supporting metric.",6,"Выручка важна, но запаздывает; поддерживающая метрика частично это компенсирует."],
 ["Choose time spent, since engagement is the best sign of a product people love and keep using.",3,"Время можно раздуть, ничего не дав клиенту."],
 ["Choose total registered users, since it grows every month and gives the team a clear, motivating number.",0,"Такая метрика только растёт и не показывает реального использования."]]]]);

R('b22',[["Dana says product changed priorities mid-sprint three times this month, and the team is frustrated. Two of the changes came from the VP of Sales.",[
 ["Agree on a weekly priority review, and let urgent work replace something rather than add to the sprint.",10,"Вводит понятное правило и договаривается с главным источником изменений."],
 ["Keep a 20% buffer in each sprint for urgent requests, with no other change to the process.",6,"Помогает, но без правила замены буфер постепенно съедается."],
 ["Ask Dana's team to adapt, since the market moves quickly and sales will keep sending new requests.",3,"Реалистично, но перекладывает проблему на команду и не меняет процесс."],
 ["Let the team choose what to work on without input from sales, so priorities stay stable all sprint.",0,"Убирает вмешательства, но отрывает продукт от приоритетов бизнеса."]]]]);

R('b23',[["The test shows conversion up 3%, but support tickets are up 15% in the test group. The sponsor wants to ship.",[
 ["Investigate why tickets rose before shipping; a conversion gain isn't a win if it comes from confused users.",10,"Ищет причину побочного эффекта до решения."],
 ["Ship to 25% of users and track tickets as a guardrail metric for the next two weeks.",6,"Ограничивает риск, но не объясняет причину и усложняет эксперимент."],
 ["Ship now and have support write a short FAQ to handle the extra tickets while the cause is found.",3,"Смягчает последствия, но причина роста обращений остаётся неизвестной."],
 ["Stop the test and drop the change, since any side effect on support tickets is unacceptable for us.",0,"Теряет реальный рост конверсии, не разобравшись в причине."]]]]);

R('b24',[["In five interviews, users keep asking for an export button. Two of them mentioned that they copy tables into spreadsheets.",[
 ["Ask why they need export and what they do with the spreadsheet, since the real problem may differ.",10,"Выясняет настоящую задачу за запросом."],
 ["Build the export button as requested, since the workaround already shows real need among these users.",6,"Потребность подтверждена обходным путём, но решение берётся таким, как просили."],
 ["Add export to a list and decide at the end of the quarter together with the other requests.",3,"Системно, но без выяснения причины список просто копит запросы."],
 ["Ignore the request for now, because users often don't know what they need and ask for solutions.",0,"Такой запрос и есть сигнал, игнорирование теряет информацию."]]]]);

R('b25',[["The launch email goes out tomorrow, but legal hasn't approved the pricing wording. Marketing has already announced the date.",[
 ["Call legal now for a same-day answer, and prepare a version without pricing details in case it's late.",10,"Быстро добивается решения и имеет безопасный запасной вариант."],
 ["Send the email with the wording legal reviewed last time, and tell legal about it afterwards.",6,"Быстро, но опирается на прошлое согласование и нарушает процесс."],
 ["Postpone the email by a week to avoid any legal risk, and tell marketing to move the date.",3,"Снимает риск, но переносит объявленную дату без необходимости."],
 ["Send the email as planned, since legal always approves in the end and the date is announced.",0,"Надежда вместо согласования создаёт юридический риск."]]]]);

R('b26',[["Design says the new flow needs another week. Mark asks you to tell them to ship what they have, because a client is waiting.",[
 ["Ask design if the extra week is worth it, ship what works, and agree a follow-up date.",10,"Выясняет цену недели и находит вариант, который помогает клиенту раньше."],
 ["Tell Mark design decides when it's ready, and explain the delay to the waiting client yourself this week.",6,"Уважает дизайн, но не ищет вариант, который помог бы клиенту раньше."],
 ["Ship the flow with a known issue and ask design to fix it in the next sprint.",3,"Быстро, но выпускает известный дефект без оценки его влияния."],
 ["Tell design to ship today, since sales has a say in timing and the client is waiting.",0,"Перекладывает решение на продажи и разрушает доверие к дизайну."]]]]);

R('b27',[["A client asks why their request isn't on the roadmap. They've been a customer for three years, and their renewal is in four months.",[
 ["Thank them, explain this quarter's reliability focus, confirm the request is logged in the backlog, and promise an update.",10,"Честно называет фокус, фиксирует запрос и даёт срок обратной связи."],
 ["Invite them to a call where product can hear their use case in detail and ask about priorities.",6,"Показывает уважение и собирает данные, но не отвечает на вопрос сразу."],
 ["Tell them it's planned for next year so they feel valued, and ask sales to keep the renewal warm.",3,"Приятно слышать, но обещание без оценки может не сбыться."],
 ["Say the roadmap is confidential and can't be discussed, and offer to share public release notes instead.",0,"Формально допустимо, но воспринимается как нежелание слушать."]]]]);

R('b28',[["NPS dropped from 42 to 31 over two months while retention is stable. Sam wants to know whether to worry.",[
 ["Read the detractors' comments to see whether it's a new problem or a vocal minority, then check retention by segment.",10,"Объясняет расхождение между отношением и поведением."],
 ["Run a new NPS survey next week to check whether the drop is real, and compare it with the old sample.",6,"Проверяет надёжность замера, но повторный опрос не объяснит причины."],
 ["Rely on retention, since behavior matters more than sentiment, and tell Sam there is no need to worry yet.",3,"Поведение важно, но настроение часто опережает уход клиентов."],
 ["Launch a loyalty program to bring the NPS score back up, and measure it again next quarter.",0,"Лечит цифру, а не причину."]]]]);

R('b29',[["Engineering proposes a three-month rewrite of the search module with no new features. Product wants two quick wins this quarter instead.",[
 ["Estimate the rewrite's impact on speed and bugs, deliver one quick win now, and propose a smaller first phase.",10,"Сравнивает по эффекту и ищет вариант, который снижает риск обеих сторон."],
 ["Run the rewrite with half the team and two quick wins with the other half, then reassess in a month.",6,"Пытается успеть всё, но делит ресурсы и затягивает оба направления."],
 ["Approve the rewrite, since engineers know best what the codebase needs, and hold the quick wins until next quarter.",3,"Доверяет экспертам, но без оценки эффекта цена трёх месяцев неясна."],
 ["Reject the rewrite, since a quarter without new features isn't acceptable, and plan the cleanup for next year.",0,"Защищает видимые результаты, но игнорирует накопленный технический риск."]]]]);

R('b30',[["Mark promised a client a custom report without asking you. The client expects it in two weeks, and the data team is already busy.",[
 ["Acknowledge the pressure, ask Mark to check with you next time, and see what's possible in two weeks.",10,"Признаёт давление, фиксирует правило и ищет реалистичное решение."],
 ["Tell Mark you'll try to make it work, and ask the data team for a first version this week.",6,"Помогает, но молча поощряет такое поведение."],
 ["Tell Mark it was his mistake and he must explain the delay to the client himself next week.",3,"Справедливо, но превращает проблему клиента во внутренний конфликт."],
 ["Escalate to the CEO and ask her to settle the issue with Mark, since he skipped the process.",0,"Поднимает вопрос слишком высоко и портит отношения."]]]]);

R('b31',[["QA found a bug the day before release. It affects 2% of users in a rarely used export path, and a workaround exists. The release is tied to a client announcement.",[
 ["Rate the severity, document the workaround as a known issue, ship on time, and schedule a patch for next week.",10,"Оценивает серьёзность, даёт обходной путь, соблюдает срок и планирует исправление."],
 ["Ship on time but switch the export path off with a feature flag, and fix the bug in a patch afterwards.",6,"Безопасно, но отключение функции лишает 2% пользователей рабочей возможности и усложняет релиз."],
 ["Delay the release by two days to fix the bug properly, and ask marketing to move the announcement.",3,"Качественно, но срыв привязанного к релизу анонса стоит дороже редкого дефекта с обходным путём."],
 ["Ship quietly without documenting the bug, since only 2% of users will ever notice it anyway.",0,"Недокументированная проблема оставит поддержку и клиентов без ответа."]]]]);

R('b32',[["Conversion went from 4% to 5% after the redesign, and Sam wants to tell the company it's a 25% improvement. The test ran for one week on about 1,500 visitors per group.",[
 ["Say it's a 25% relative gain, one percentage point absolute, and share the confidence interval later.",10,"Называет обе величины и признаёт, что надёжность ещё нужно проверить."],
 ["Tell Sam to report only the absolute number, one percentage point, and skip the relative figure entirely.",6,"Корректно и осторожно, но отказ от относительного показателя скрывает масштаб эффекта."],
 ["Share the 25% figure now and add that the test will run another week to confirm the result.",3,"Цифра объявляется до проверки; оговорка смягчает, но формулировка уже зафиксирована."],
 ["Announce a 25% improvement company-wide today, since the redesign clearly worked and the team deserves credit.",0,"Громкое заявление по недельному тесту без оценки доверительного интервала."]]]]);

R('b33',[["A prospect says they will sign this month if you confirm an integration by June. Engineering says June is possible but unlikely, and nothing has been scoped.",[
 ["Say you can't confirm yet, check with engineering, and come back to them by Friday with what's realistic.",10,"Честно и с конкретным сроком ответа: обещание появится только после оценки."],
 ["Offer a smaller integration for June, scoped with engineering, and describe the rest as planned for later.",6,"Конкретно и полезно, но предлагает объём до того, как инженеры его оценили."],
 ["Confirm June in writing and ask engineering to find a way, since the deal is large and urgent.",3,"Сохраняет сделку, но превращает догадку в письменное обязательство."],
 ["Tell the prospect you will try your best, and keep the answer vague so nothing is promised.",0,"Расплывчатый ответ выглядит как уклонение и не помогает клиенту решить."]]]]);

R('b34',[["The CEO saw a feature at a competitor and wants it added this sprint. The team is committed to a retention project, which the CEO called the top priority last month.",[
 ["Thank him, ask what problem he wants to solve, and show how it could fit into priorities.",10,"Уважает идею, выясняет проблему и показывает связь с приоритетами."],
 ["Offer a small prototype next sprint on the side, and keep the retention project on its original plan.",6,"Креативно, но работа «на стороне» почти всегда отнимает силы у главного проекта."],
 ["Add it this sprint and move one retention task out, since the CEO has the final say.",3,"Уважает власть руководителя, но подменяет приоритет, который он сам назвал главным."],
 ["Say it doesn't fit the strategy and ask him to bring it back in the next planning cycle.",0,"Формально последовательно, но закрывает диалог и не выясняет, что за проблема стоит за идеей."]]]]);

R('b35',[["A critical bug was found two hours before launch: sign-up fails for users with long email addresses, about 3% of traffic. Marketing has already sent the invitations.",[
 ["Ask engineering how fast a fix is, and if slow, launch with a workaround and monitor.",10,"Сначала оценивает влияние и срок, а затем выбирает запуск с запасным решением и наблюдением."],
 ["Delay the launch by a day, tell invited users honestly, and fix the bug with full testing tomorrow.",6,"Честно и аккуратно, но срывает дату из-за ошибки, которая задевает небольшую долю."],
 ["Launch as planned and tell support to handle sign-up complaints manually for the first day.",3,"Сохраняет дату, но нагружает поддержку и оставляет 3% пользователей без регистрации."],
 ["Launch and say nothing about the bug until it is fixed, so nobody starts to worry.",0,"Скрытая проблема в основном сценарии разрушит доверие, когда её найдут."]]]]);

R('b36',[["The survey says 80% of users love the app, but usage has dropped for three months. Only 5% of users answered the survey, mostly active ones.",[
 ["Check who the respondents were, since active users answer more, and dig into the usage drop.",10,"Замечает смещение выборки и идёт к поведению, которое надёжнее заявлений."],
 ["Run a second survey aimed at users who stopped using the app, and compare the answers.",6,"Правильное направление, но опрос ушедших даёт низкий отклик и занимает время."],
 ["Trust the survey for now and add a note about the usage drop to the quarterly report.",3,"Принимает результат с оговоркой, но не проверяет смещение выборки."],
 ["Trust the usage data only and stop sending surveys, since they never reflect real behavior.",0,"Опросы полезны, если помнить об их ограничениях; отказ от них теряет часть картины."]]]]);

R('b37',[["Support wants a fix for a rare crash, sales wants a new report, and design wants a visual refresh. Each calls it urgent, and the team has room for one of them.",[
 ["Compare the three by customer impact and cost of delay, then explain the choice to everyone.",10,"Сравнивает по ущербу и цене задержки и объясняет решение всем."],
 ["Pick the crash fix, since stability always comes first, and tell the others to wait a quarter.",6,"Часто верно, но без оценки частоты и ущерба это правило, а не решение."],
 ["Do the visual refresh first, since it is the cheapest and makes everyone happy with the product.",3,"Дёшево, но косметика редко важнее ущерба клиентам и продажам."],
 ["Take the request from the most senior person, since they have the most context and authority.",0,"Должность просителя не показывает ценность для клиентов."]]]]);

R('b38',[["Anna writes: 'Our price is final. Take it or leave it.' You need the product, but the contract is large and the payment terms are weak.",[
 ["Ask what is included and whether scope or payment terms have flexibility that works for both.",10,"Выясняет, где есть пространство для обмена, не разрушая отношения."],
 ["Accept the price but ask for a three-month pilot period before the full contract starts.",6,"Снижает риск, но не использует возможность поторговаться об условиях оплаты."],
 ["Say you have a cheaper quote from a competitor and will walk away unless the price drops.",3,"Рычаг, если альтернатива есть, но давление без деталей закрывает разговор."],
 ["Accept right away, since time is short and comparing vendors would delay the whole project.",0,"Согласие без вопросов отдаёт всё, ничего не получая взамен."]]]]);

R('b39',[["A new PM asks you to make all the decisions for them because they're afraid of making mistakes. Three of their decisions last month needed no changes.",[
 ["Support them, but they make the call, and you'll have their back if it goes wrong.",10,"Поддерживает, но оставляет решение за человеком и берёт на себя часть риска."],
 ["Review every decision with them before it is announced, and let them present it to the team.",6,"Безопасно, но создаёт зависимость от вашего одобрения."],
 ["Make the next few decisions yourself and explain your reasoning so they learn by watching.",3,"Поучительно, но снимает ответственность, которую человек должен научиться брать."],
 ["Tell them mistakes are not acceptable here, so they should double-check everything before acting.",0,"Усиливает страх и тормозит решения."]]]]);

R('b40',[["Paid ads bring many signups, but few become customers. The ad budget is 40% of marketing spend, and acquisition cost has risen for three months.",[
 ["Check acquisition cost and payback period first, and scale spend only if the unit economics work.",10,"Решение о масштабировании опирается на экономику одного клиента."],
 ["Cut the budget by half and watch how many customers still convert in the next month.",6,"Быстро снижает потери, но не объясняет, почему конверсия мала."],
 ["Keep the budget and improve the landing page, since conversion is probably the actual weak point.",3,"Возможная причина, но без данных это одна из гипотез."],
 ["Spend more and fix conversion later, since more signups always lead to more customers.",0,"Больше регистраций без роста оплат увеличивает потери."]]]]);

R('b41',[["Usability tests show 4 of 5 users can't find the Save button. The designer says it is obvious and wants to keep the layout.",[
 ["Watch where users look, try a more visible placement, and retest with a few new people.",10,"Результаты теста это факты: меняем размещение и проверяем снова."],
 ["Keep the layout and add a short tooltip pointing at the Save button for first-time users.",6,"Помогает новичкам, но не устраняет проблему размещения."],
 ["Ask five more users to test the current layout before changing anything, to be sure.",3,"Лишняя проверка: четыре из пяти уже дают достаточный сигнал."],
 ["Trust the designer, since they are the expert, and treat the test as an unlucky sample.",0,"Мнение эксперта не отменяет наблюдение за реальными пользователями."]]]]);

R('b42',[["Halfway through the sprint, the main story is blocked by another team's API change. The other team says they can look at it next week.",[
 ["Talk to the other team's lead today to unblock it, and prepare a fallback plan.",10,"Идёт к причине блокировки и имеет запасной вариант для результата спринта."],

/* ================= BANK STORY: rewritten big cases (numbers kept from the balanced originals) ================= */
function BS(id,sender,meters,endings,steps){
  var c=null;for(var i=0;i<CASES.length;i++){if(CASES[i].id===id){c=CASES[i];break;}}
  if(!c)throw new Error('no case '+id);
  if(c.steps.length!==steps.length)throw new Error('step count '+id);
  c.sender={name:sender[0],role:sender[1],channel:sender[2]};
  c.meters=meters;c.endings=endings;
  steps.forEach(function(s,i){
    var st=c.steps[i],prev=st.options;
    if(prev.length!==4||s[2].length!==4)throw new Error('options '+id+' '+i);
    st.msg=s[0];st.alt=s[1]||null;
    st.options=prev.map(function(o,j){return {t:s[2][j][0],p:o.p,ok:o.ok,c:s[2][j][1],e:o.e,r:s[2][j][2]};});
    st.explain='';
    st.words=s[3].map(function(a){return {w:a[0],ru:a[1],how:a[2],ex:a[3]};});
  });
}

 [["demo account","демо-счёт","Пробный счёт с примерами, чтобы увидеть ценность продукта.","A demo account shows the value quickly."],["trust","доверие","Уверенность, что компания не подведёт.","Customers need trust before sharing documents."]]],
["The new order is live. Activation rose from 30% to 41% in two weeks. The CEO asks if you can reach 60% by the end of the quarter, but the budget is almost gone.",null,[
 ["Pick the next biggest drop-off from the funnel, fix it with a small change, and test it on half of new customers first.","Следующий шаг делается дёшево и проверяется на части клиентов.","The next fix is cheap, the test confirms it works, and activation keeps climbing."],
 ["Ask the team to work evenings for three weeks and fix every remaining issue at once.","Перегружает команду и не показывает, что сработало.","The team burns out fast, and nobody can tell which change helped."],
 ["Tell the CEO that 41% is enough, since the main problem is solved, and stop working on onboarding.","Останавливается раньше цели и теряет поддержку.","Leadership sees the target slip away, and the momentum disappears."],
 ["Ask the CEO for extra budget to buy ads that bring more new customers into the same flow.","Больше людей на входе, но воронка прежняя.","Traffic grows and a few more customers finish, but the extra spend is not matched by results."]],
 [["small change","небольшое изменение","Правка, которую можно сделать быстро и дёшево.","A small change can move the metric."],["half of","половина (клиентов)","Часть аудитории для проверки.","We tested it on half of new customers."]]],
["Two weeks later, activation is at 52%. Support reports that customers keep asking the same three questions about the ID photo. What do you do next?",null,[
 ["Add short answers to those three questions inside the app next to the step, and track whether support tickets drop.","Закрывает реальные вопросы клиентов и измеряет результат.","Tickets about the ID photo drop by half, and activation reaches 58%."],
 ["Build a full chatbot for account opening, and plan the launch for next quarter.","Решение большое и дорогое, а вопросов всего три.","The chatbot takes months and loads the team while the simple questions stay unanswered."],
 ["Ignore the questions, since activation is already above 50% and the target is close.","Лёгкая победа упущена, клиенты продолжают уходить.","The same questions keep coming, and some customers quit at the step."],
 ["Ask support to answer these questions in chat faster, and review the numbers again next month.","Помогает, но причину вопросов не убирает.","Chats get faster replies, but the questions keep arriving and the step stays unclear."]],
 [["support ticket","обращение в поддержку","Запрос клиента, записанный в системе поддержки.","Support tickets show what confuses customers."],["activation rate","уровень активации","Доля новых клиентов, дошедших до ценности продукта.","The activation rate went up to 52%."]]]

/* ---- Chapter 2 boss: skeptical business banking (Associate PM) ---- */

{good:"Mark becomes your strongest supporter. Clients get the export they asked for, insights keeps growing, and the business banking team starts sharing client feedback with product every week.",
 mid:"The conflict cools down, but business banking still feels only half heard. Some work is wasted, and you will need to rebuild trust.",
 bad:"Business banking stops trusting product, and clients feel it. The quarterly meeting turns into an argument about who is to blame."},
[

 ["Ask Mark to name three clients who asked for statements, and compare what they need with the insights usage data.","Начинает с фактов и вовлекает бизнес-сторону в проверку.","Mark sees the data himself, and he agrees to look at it with you instead of arguing."],
 ["Send Mark the roadmap and explain why insights was prioritized last quarter.","Объясняет прошлые решения, но не отвечает на его запрос.","Mark reads it politely, but he still feels his clients were not heard."],
 ["Tell Mark that the decision is final and product does not take requests from sales.","Закрывает диалог и портит отношения.","Mark stops sharing client feedback, and the sales team starts working around you."],
 ["Offer to add custom statements to the backlog and promise to review the priority next quarter.","Показывает готовность, но обещает без оценки.","Mark is happier for now, but he expects a date you cannot promise yet."]],
 [["buy-in","поддержка, согласие коллег","Готовность людей принять и поддержать решение.","We need buy-in from sales."],["backlog","бэклог","Список задач, ожидающих выполнения.","Custom statements are now in the backlog."]]],
["The data shows 12% of business clients use insights weekly, and 9 of the 14 clients Mark named want statements that export to accounting software. How do you present this?","Mark is still angry after the first talk. The data shows 12% of business clients use insights weekly, and 9 of the 14 clients he named want statements that export to accounting software. How do you present this?",[

 ["Agree with Mark, drop insights, and move the whole team to statements right away.","Резкий разворот по одной группе клиентов без проверки.","Sales is happy, but engineering loses weeks of work, and the quality of the new feature suffers."],
 ["Share only the insights numbers and say that 12% is a success for a new feature.","Игнорирует запрос клиентов и усиливает конфликт.","Mark thinks you are hiding the problem, and he takes the question to the CEO."],
 ["Share the numbers with Mark and the CEO together, and ask them to confirm the priority at the quarterly meeting.","Разумно, но перекладывает решение, не предложив своего.","Both agree to decide at the meeting, but you did not bring your own recommendation."]],
 [["traction","первые результаты, интерес рынка","Признаки того, что продуктом начинают пользоваться.","The feature shows early traction."],["pilot","пилот","Небольшой пробный запуск на ограниченной группе.","Let's run a pilot with five clients."]]],
["The pilot goes well: four of five clients use the export every week. Mark asks you to build the full version in six weeks and skip testing to meet the sales target.",null,[

 ["Refuse to build it, since five clients are too few to decide anything.","Слишком осторожно: сигнал ясный и ценный.","Mark is frustrated, and clients wait for a feature that could have helped them."],
 ["Build everything in six weeks and skip testing, since sales needs it on time.","Без тестов риск ошибок в выписках слишком высок.","The export has errors in client statements, and several clients lose trust in the bank's reports."],
 ["Agree to build it, but ask Mark for ten weeks without explaining the reasons.","Срок реалистичный, но без объяснений падает доверие.","Mark accepts the new date, but he does not understand it, and trust cools down."]],
 [["core","основной, базовый","Самая важная часть функции.","Ship the core first."],["sales target","план продаж","Цель по продажам, которую нужно выполнить.","Mark needs to meet the sales target."]]]

/* ---- Chapter 3 boss: VP's A/B test (PM) ---- */
BS('sc05',['Nora','Chief of Staff','Slack'],['Credibility','Data quality','VP relationship'],
{good:"Your careful work saves the bank from a weak rollout. The VP trusts your numbers, and the team gets a simple testing standard that other teams adopt.",
 mid:"The bank avoids the worst mistake, but the process is slower or less clear than it could be. Your credibility is fine, and the relationship with the VP needs care.",
 bad:"A weak result goes live, and the bank notices it only after complaints arrive. People start to question the data, and the VP relationship is damaged."},
[
["The VP of Retail ran an A/B test for three days on a loan offer banner. Version B has 6% more clicks, and she wants to roll it out to all customers today. Nora asks you to prepare a view for the 4 pm meeting.",null,[
 ["Check the sample size, the test length and the metric. Then tell the VP the result is promising but too early, and suggest running the test for two full weeks.","Проверяет выборку и метрику и предлагает довести тест до конца.","The VP appreciates the clear reasoning, and the team keeps the test running."],
 ["Tell the VP the result looks good, and promise to check the details after the rollout starts.","Проверка после запуска приходит слишком поздно.","The VP is pleased, but you start the rollout before knowing whether the result is real."],
 ["Roll out version B to everyone today, since the VP asked and 6% is a clear win.","Выкатка без проверки подрывает данные и доверие.","The VP is happy for a day. A week later the numbers fall back, and your analysis is questioned."],
 ["Ask Nora to move the meeting, and extend the test by a week while you check results for different customer groups.","Хорошо, но руководителю нужно объяснить причину.","The extra week gives better data, and the VP accepts it after a short explanation."]],
 [["sample size","размер выборки","Сколько людей участвует в тесте.","A small sample size can mislead us."],["rollout","постепенный запуск для клиентов","Выпуск изменения для всех пользователей.","We planned a rollout for next week."]]],
["The extended test ends. B is up 2% in clicks, but loan applications from B are 5% lower and complaints about unclear terms rose. The VP asks, 'So did it work?'","The VP started the rollout early. B is up 2% in clicks, but loan applications are 5% lower and complaints about unclear terms rose. The VP asks, 'So did it work?'",[
 ["Explain that clicks are not the goal: applications are lower, so B attracts attention but hurts results. Suggest a clearer version C.","Смотрит на целевую метрику, а не на клики.","The VP sees the full picture, and she approves a new test with a clearer banner."],
 ["Say the result is mixed, and show only the click numbers in the report.","Выбирает удобные цифры вместо полной картины.","The report looks positive, but the missing numbers will cause trouble later."],
 ["Blame the design team for the unclear terms in version B.","Перекладывание вины портит отношения и не решает проблему.","The VP sees you avoid the question, and design stops supporting your tests."],
 ["Show the full numbers and recommend keeping version A, without suggesting what to test next.","Честно, но без следующего шага.","The VP accepts it, but she wants to know what comes next, and you have no plan."]],
 [["target metric","целевая метрика","Главный показатель, по которому оценивают успех.","Applications are our target metric."],["unclear terms","непонятные условия","Условия продукта, которые клиент плохо понимает.","Unclear terms cause complaints."]]],
["Nora asks how you will make sure the bank's future tests are reliable. The VP wants faster results, and the data team wants strict rules.",null,[
 ["Create a short checklist for every test: goal, main metric, sample size, minimum duration and a guardrail metric, reviewed by data before launch.","Лёгкий общий стандарт, который защищает от ошибок.","Tests become reliable and quick to approve, and the VP likes having a clear process."],
 ["Ask data to approve every test personally, and allow no test without a formal review.","Надёжно, но создаёт очередь и тормозит всех.","Quality improves, but every test waits in a queue and the VP is unhappy."],
 ["Let each team run tests its own way, and ask data to check only the final results.","Проверка в конце не исправит ошибки в дизайне теста.","Tests multiply with different rules, and nobody trusts the numbers."],
 ["Ask data to write a long testing guide and share it with all teams next quarter.","Полезно, но долго, и мало кто прочитает.","The guide is thorough, but most teams do not read it, and the mistakes continue."]],
 [["guardrail metric","защитная метрика","Показатель, который не должен ухудшиться из-за теста.","Complaints are our guardrail metric."],["checklist","чек-лист","Список пунктов, которые нужно проверить.","Use the checklist before every test."]]]
]);

/* ---- Chapter 4 boss: two business clients (Senior PM) ---- */
BS('sc06',['Ben','Relationship Manager','Slack'],['Client A trust','Client B trust','Eng. focus'],
{good:"Both clients stay and become advocates. Engineering keeps its focus, and Ben learns to bring you client problems early instead of promises.",
 mid:"Both clients stay for now, but one of them is less happy than it should be, and some engineering time is lost.",
 bad:"One or both clients start moving business elsewhere, and engineering is busy fixing promises made in a hurry."},
[
["Ben: 'Client A is a large payments company and wants API access to account data. Client B is a retail chain and wants multi-user approvals for payments. Both threaten to leave. Engineering has capacity for only one this quarter.'",null,[
 ["Ask Ben to set up calls with both clients to learn the exact problem, the deadline and what they would accept as a first step.","Сначала выясняет реальную потребность каждого клиента.","Both clients feel heard, and you learn that they need less than they first asked for."],
 ["Choose Client A because the API deal is bigger, and tell Client B they will wait.","Выбор по размеру сделки, без проверки потребностей.","Client A is happy, but Client B feels ignored and starts looking at other banks."],
 ["Promise both clients delivery this quarter, and ask engineering to find a way.","Невыполнимое обещание подорвёт доверие обоих.","Engineering is overloaded, and both clients will soon face missed promises."],
 ["Ask Ben which client renews first, and focus on that client.","Разумный критерий, но без разговора с клиентами его мало.","You get a rough order, but you still do not know what each client really needs."]],
 [["renewal","продление договора","Момент, когда клиент решает, остаться ли с банком.","Client B's renewal is in March."],["capacity","ресурс команды","Сколько работы команда может взять.","Engineering has capacity for one request."]]],
["After the calls: Client A needs read-only access to transaction data for one partner. Client B needs two approvers for payments above 10,000. Engineering says each can be built as a small version in four weeks.","The calls were tense and Ben is nervous. Client A needs read-only access to transaction data for one partner, and Client B needs two approvers for payments above 10,000. Engineering says each can be built as a small version in four weeks.",[
 ["Build both small versions in sequence: Client B's approvals first because its renewal is sooner, then Client A's read-only API.","Делит работу на малые части и учитывает сроки продления.","Both clients get a date and a clear first version, and engineering stays focused."],
 ["Build Client A's API first with the full feature set, and leave Client B's approvals for next year.","Теряет клиента B и берёт лишнюю работу.","Client A is delighted, but Client B moves part of its business to another bank."],
 ["Build neither until a bigger customer survey shows demand across the market.","Откладывает решение, пока клиенты уходят.","Both clients lose patience, and engineering has nothing clear to work on."],
 ["Build only Client B's approvals now, and tell Client A that its request comes in the second half of the year.","Реалистично, но возможность сделать обе малые версии упущена.","Client B is happy and Client A waits, but the late request returns and interrupts engineering."]],
 [["read-only access","доступ только для чтения","Можно смотреть данные, но нельзя менять.","Client A needs read-only access."],["approver","согласующий","Человек, который подтверждает платёж или решение.","Two approvers must confirm large payments."]]],
["Four weeks in, Client B's approvals are almost ready, but compliance finds that the feature needs an audit log of who approved what. This adds two weeks.",null,[
 ["Add the audit log, tell Client B about the two extra weeks and the reason, and offer to start a pilot with one team meanwhile.","Объясняет причину, сохраняет качество и даёт клиенту пилот.","Client B values the honesty, starts a small pilot and becomes a strong supporter."],
 ["Skip the audit log for now and ship on time, adding it in a second release.","Нарушает требования комплаенса и ведёт к переделкам.","Client B is pleased with the speed, but compliance blocks the launch and engineering rushes to fix it."],
 ["Tell Client B nothing and keep the date, hoping the extra work fits in the schedule.","Молчание о задержке разрушает доверие.","The date slips, and Client B learns about it from its own team, not from you."],
 ["Add the audit log and share the new date in the weekly update, without offering any interim step.","Честно, но клиент остаётся без решения на две недели.","Client B accepts the delay, but it waits two weeks with nothing to use."]],
 [["audit log","журнал действий","Запись о том, кто и что сделал в системе.","The audit log shows who approved the payment."],["compliance","комплаенс, соблюдение правил","Отдел или процесс, который следит за выполнением правил и законов.","Compliance must review the feature."]]],
["Client B is live. Client A now asks if it can have the read-only API this quarter after all, because a competitor bank offered it.",null,[
 ["Share the plan: the read-only API is next, with a date and one clear first use case, and invite Client A to test it early.","Даёт понятный план и вовлекает клиента.","Client A stays, joins early testing, and its feedback shapes the API."],
 ["Say the API will come eventually, and avoid giving dates.","Без дат клиент не может планировать.","Client A feels unimportant and starts talks with the competitor."],
 ["Promise an API with all features immediately, even though the team has not designed it.","Громкое обещание без проекта опасно.","The team is rushed, and the first version has serious security gaps."],
 ["Offer a data export as a file for now, and promise the API later.","Помогает на время, но задачу API не решает.","Client A accepts the file export as a short-term bridge, but it still pushes for the API."]],
 [["use case","сценарий использования","Конкретная ситуация, в которой клиент использует продукт.","The first use case is partner reporting."],["interim solution","временное решение","Решение на переходный период.","A file export is an interim solution."]]]
]);

/* ---- Chapter 5 boss: burned-out lead engineer (Group PM) ---- */
BS('sc03',['Carlos','Engineering Manager','Slack'],['Team morale','Delivery speed','Trust in you'],
{good:"Ira stays, the team trusts you, and releases become calmer. Carlos says it is the first time product has protected the team instead of pushing it.",
 mid:"The immediate crisis passes, but the causes are still there. The team is cautious and waits to see whether things really change.",
 bad:"Ira leaves, and others consider following. Delivery slows down, and the team stops believing that product cares."},
[
["Carlos: 'Ira, the lead engineer on the cards team, says she is burned out after three crunch releases in a row. She is thinking of leaving. The next release is in three weeks.'",null,[
 ["Talk to Ira privately, listen, and ask what would help most. Then plan with Carlos to lighten her load before the next release.","Слушает человека и действует вместе с менеджером.","Ira feels heard, and she agrees to stay if the load really changes."],
 ["Ask Ira to finish the next release, then promise that she will get a long break afterwards.","Отложенный отдых не снимает нагрузку сейчас.","The release ships, but Ira's exhaustion grows, and she stops speaking up in meetings."],
 ["Tell Carlos it is his job to handle his team's workload, and keep the release plan unchanged.","Снимает ответственность и ухудшает ситуацию.","Carlos feels alone, Ira loses hope, and the team notices that nobody listens."],
 ["Ask Carlos to give Ira a week of vacation now, and keep the release plan as it is.","Забота о человеке, но перегрузка остаётся.","Ira rests, but she returns to the same backlog and the same deadline."]],
 [["burnout","выгорание","Сильное истощение из-за долгой перегрузки.","Burnout can make a strong engineer leave."],["crunch","аврал","Период срочной работы с переработками.","We had three crunch releases in a row."]]],
["The next release has three big features, and the team can safely finish only two. Sales has already told clients about all three.","Ira is still exhausted. The next release has three big features, and the team can safely finish only two. Sales has already told clients about all three.",[
 ["Move the lowest-value feature to the next release, tell sales and clients the new date, and protect the team's evenings.","Сокращает объём вместо перегрузки и честно сообщает.","The two features ship with good quality, clients accept the new date, and the team feels respected."],
 ["Keep all three features and hire a contractor for the third one.","Подрядчику нужно время, чтобы вникнуть.","The contractor needs weeks to learn the system, so the team spends time teaching instead of building."],
 ["Keep all three features and ask everyone to work on weekends for two weeks.","Ещё один аврал приведёт к потерям людей.","The release ships late with bugs, and two more engineers start looking for new jobs."],
 ["Cut the scope of all three features a little, and ship them in a thinner version.","Разумно, но три сырые функции хуже двух хороших.","The release is on time, but all three features feel incomplete, and clients are unsure about them."]],
 [["scope","объём работ","Что именно входит в задачу или релиз.","We need to reduce the scope."],["protect the team","защитить команду","Не позволять перегрузке разрушать людей.","A good leader protects the team."]]],
["Carlos says the team's pace is unstable because releases always get rushed at the end. He asks what you will change in the way product plans work.",null,[
 ["Introduce a planning rule: fix the release scope two weeks before the date, keep a small reserve for surprises, and accept no new requests after that.","Системно убирает причину спешки.","Releases become calmer, and the team knows what to expect."],
 ["Add a daily progress meeting for everyone, so you can catch delays earlier.","Больше встреч, но причина спешки та же.","The team spends more time in meetings, and the pressure stays."],
 ["Keep the current process, and remind everyone to plan better.","Призыв без изменений ничего не меняет.","Nothing changes, and the next release is rushed again."],
 ["Ask each PM to plan with a buffer, but leave the rules to them.","Помогает, но без общего правила каждый делает по-своему.","Some teams plan well, others do not, and the rushing continues in several places."]],
 [["buffer","запас времени","Резерв на непредвиденные задачи.","Add a buffer to every plan."],["scope freeze","заморозка объёма","Момент, после которого новые требования не принимают.","Scope freeze is two weeks before release."]]],
["Three months later, Ira is doing well. A newer engineer, Dev, now shows the same signs of exhaustion. Carlos asks how you want to handle it this time.",null,[
 ["Do not wait for a crisis: check in with Dev, review the team's workload every month, and ask Carlos to share early warning signs with you.","Переходит от реакции к профилактике.","Dev gets support early, and the team starts to treat workload as something to discuss openly."],
 ["Remind Carlos that you solved this once, and ask him to handle it the same way.","Опирается на опыт, но систему не меняет.","It works for Dev, but the next person will face the same problem."],
 ["Leave it to Dev to ask for help if he needs it.","Выгорающие люди редко просят о помощи сами.","Dev stays silent for weeks, and the quality of his work drops."],
 ["Suggest a team survey about workload once a quarter, and discuss the results.","Полезно, но реагирует слишком редко.","The survey brings useful information, but it comes too late for Dev."]],
 [["workload","рабочая нагрузка","Объём задач, который человек выполняет.","His workload is too high."],["early warning","ранний сигнал","Признак проблемы до того, как она стала кризисом.","Silence can be an early warning."]]]
]);

/* ---- Chapter 6 boss: fee increase (Head of Product) ---- */

{good:"Revenue grows without a customer revolt. The bank keeps its reputation, and your phased plan becomes the template for future pricing decisions.",

[
