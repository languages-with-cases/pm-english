A('a10','Choosing a north star metric','Metrics',[
"Teams can drown in numbers. A [[north star metric|north star metric]] is one number that shows whether customers get real value from the product. It helps many teams point in the same direction, even when they work on different features.",
"A good north star reflects value for customers and leads to money for the bank. 'Number of registered users' is weak, because people can register and never come back. 'Customers who make three card payments a month' is stronger, because it shows real use.",
"Check the metric with a few questions. Does it move when customers get more value? Can the team influence it? Is it easy to explain? Can it be [[gamed|game the metric]]? If a team can raise the number without helping customers, choose a better one.",
"Support the north star with an [[input metric|input metric]], a smaller number that teams can move directly, such as the time to open an account. Also add a [[guardrail|guardrail]], for example complaints, so that growth does not hurt quality."],
[["north star metric","ключевая метрика продукта","Главный показатель, который отражает ценность для клиента.","The north star metric guides all teams."],
 ["game the metric","накрутить показатель","Поднять число, не принося реальной пользы.","Do not game the metric."],
 ["input metric","входная метрика","Меньший показатель, на который команда влияет напрямую.","Time to open an account is an input metric."],
 ["guardrail","защитный показатель","Показатель качества, который не должен падать при росте главной метрики.","Complaints are a guardrail."]],
[["Why is 'registered users' a weak north star?","People can register and never use the product",["It is too difficult to measure in banks","It does not change from month to month","It only includes business customers"],"Регистрация не равна пользе."],
 ["Which question helps test a north star metric?","Can the team raise it without helping customers?",["Is it the same as last year's number?","Does the board already track it?","Is it measured in money only?"],"Хорошую метрику нельзя поднять без пользы клиентам."],
 ["A north star metric should be used without any other metrics.","False",["True"],"Ей нужны входные метрики и защитные показатели."],
 ["In the text, 'input metric' means:","a smaller number that teams can move directly",["the main number at the top of a report","a metric given by an outside regulator","a number that comes from customer surveys"],"Входная метрика это показатель, на который команда влияет напрямую.","input metric"],
 ["What is the role of a guardrail?","It protects quality while the main metric grows",["It replaces the north star when it falls","It tells engineers when to release","It measures the total revenue of the bank"],"Защитный показатель следит, чтобы качество не страдало."]]);

A('a11','Leading work across teams','Delivery',[
"At Senior PM level, the biggest problems cross team borders. Checkout, for example, may be owned by three teams: payments, identity and the app. When nobody owns the whole result, problems fall between teams and stay there.",
"Start by naming one [[owner|owner]] for the outcome, and agree who decides what. A simple tool is a table of roles: who decides, who is consulted, who is informed. Write it down. Clear [[ownership|ownership]] removes many arguments before they start.",
"Map each [[dependency|dependency]] early: what one team needs from another, and by when. A late dependency is the most common reason for a missed date. Meet other teams every week for a short check, and track the shared plan in a single place.",
"You do not have authority over other teams, so you need [[influence|influence]]. Build it with clear goals, honest data and small wins. When teams see that your plan helps them reach their own goals, they work with you, not for you."],
[["owner","ответственный","Человек, который отвечает за результат.","Each outcome needs one owner."],
 ["ownership","ответственность за результат","Чёткое понимание, кто за что отвечает.","Clear ownership prevents arguments."],
 ["dependency","зависимость","То, что одной команде нужно от другой для работы.","The release has a dependency on identity."],
 ["influence","влияние","Способность менять решения без формальной власти.","A PM needs influence, not orders."]],
[["What happens when nobody owns the whole outcome?","Problems fall between teams and stay there",["Teams work faster without rules","The budget grows automatically","Customers solve the problems themselves"],"Без единого владельца проблемы остаются нерешёнными."],
 ["What is the purpose of a table of roles?","To show who decides, who is consulted and who is informed",["To list who works in each office building of the bank","To rank all employees by their performance each year","To record the salary level of each team member"],"Таблица ролей убирает споры о том, кто решает."],
 ["A late dependency is rare and rarely causes missed dates.","False",["True"],"Поздняя зависимость самая частая причина сорванных сроков."],
 ["In the text, 'influence' means:","the ability to change decisions without formal authority",["a legal right to give orders to other teams","a small payment the bank makes for each decision","a report that the board approves every quarter"],"Влияние строится на целях, данных и маленьких победах.","influence"],
 ["How does the text suggest building influence?","Clear goals, honest data and small wins",["Strong opinions and long emails","Escalating every problem to the CEO","Asking teams to follow your plan"],"Влияние растёт, когда ваш план помогает другим достичь их целей."]]);

A('a12','Experiments at scale','Experiments',[
"Bigger products run many experiments at once, and mistakes become expensive. Two ideas protect you from false conclusions: [[statistical significance|statistical significance]] and a [[confidence interval|confidence interval]].",
"Statistical significance tells you how unlikely it is that a difference is just [[noise|noise]]. A common rule is 95%: if there were really no difference, you would see a result this strong only 5 times in 100. It does not tell you that the effect is big or useful.",
"A confidence interval shows the range where the true effect probably lies. 'Conversion up 3%, with an interval from minus 1% to plus 7%' means the real result could even be negative. Wide intervals mean you need more data.",
"Watch out for [[cherry-picking|cherry-pick]]: looking at many groups and reporting only the one that looks good. If you test 20 groups, one will look significant by chance. Decide your groups before the test, and be honest about everything you looked at."],
[["statistical significance","статистическая значимость","Показатель того, что различие вряд ли случайное.","The result reached statistical significance."],
 ["confidence interval","доверительный интервал","Диапазон, где, скорее всего, находится настоящий эффект.","The confidence interval is very wide."],
 ["noise","шум, случайные колебания","Случайные отклонения, не связанные с реальной причиной.","Small changes may be just noise."],
 ["cherry-pick","выбирать только удобное","Показывать только те результаты, которые выглядят хорошо.","Do not cherry-pick the best group."]],
[["What does statistical significance tell you?","How unlikely it is that the difference is just noise",["How large and useful the effect is for customers","How many customers joined the test in each group","How long the test should run before a decision"],"Значимость говорит о вероятности случайности, но не о размере эффекта."],
 ["What does a confidence interval show?","The range where the true effect probably lies",["The exact day when the test should end","The number of customers in each group","The cost of running the experiment"],"Доверительный интервал показывает диапазон реального эффекта."],
 ["If the interval includes negative values, the real effect could be negative.","True",["False"],"Если интервал переходит через ноль, эффект может быть и отрицательным."],
 ["In the text, 'cherry-pick' means:","to report only the results that look good",["to choose the best customers for a test","to remove errors from the data","to pick the cheapest tool for analysis"],"Cherry-pick это выбирать удобные результаты.","cherry-pick"],
 ["Why can testing 20 groups be a problem?","One of them will look significant by chance",["The test becomes too expensive to run","Customers will see too many versions","Regulators do not allow many groups"],"При множестве групп одна из них случайно покажет эффект."]]);

/* ---------- Chapter 5: Group PM ---------- */
A('a13','Coaching product managers','Leadership',[
"As a Group PM, your success is measured by the success of your team. You can no longer solve every problem yourself. You help each PM grow, and the first step is regular [[one-on-one|one-on-one]] meetings, at least every two weeks.",
"Use these meetings to listen, not to check status. Ask: what is the hardest decision you face now? What would you do if you were sure? Often the person already knows the answer and needs space to say it. Give your view after they speak.",
"Give [[feedback|feedback]] early and specifically. 'Your presentation was confusing' helps little. 'The first slide had five metrics, and I could not tell which one mattered' is something the person can use. Praise in public, and discuss problems in private.",
"[[Delegate|delegate]] decisions, not only tasks. Let the PM [[own the decision|own the decision]], and agree how you will support without taking over. When they make a mistake, ask what they learned. People who are afraid of mistakes stop making decisions."],
[["one-on-one","личная встреча тет-а-тет","Регулярный разговор руководителя и сотрудника без других людей.","We have a one-on-one every Friday."],
 ["feedback","обратная связь","Информация о том, что получилось и что можно улучшить.","I asked for feedback after the demo."],
 ["delegate","делегировать","Передать право решать или выполнять задачу другому.","Delegate the decision to the PM."],
 ["own the decision","отвечать за решение","Принимать решение и нести за него ответственность.","Let her own the decision."]],
[["What should one-on-one meetings be used for?","Listening and helping the person think through decisions",["Checking each task on the status list one by one","Announcing new company rules to the whole team","Measuring how fast the person completes the work"],"Встречи нужны, чтобы слушать и помогать думать, а не проверять статус."],
 ["Which feedback does the text prefer?","The first slide had five metrics, so I could not tell which one mattered",["Your presentation was confusing and I did not enjoy it","You need to be a lot clearer next time you present","The meeting did not go well, so please improve it"],"Конкретная обратная связь показывает, что именно улучшить."],
 ["The text says to discuss problems in public and praise in private.","False",["True"],"Наоборот: хвалить публично, а проблемы обсуждать наедине."],
 ["In the text, 'delegate' means:","to give someone the right to decide or do a task",["to cancel a project after a long review process","to ask a manager for an opinion about a task","to hire a new person from another product team"],"Делегировать это передать право решать или делать.","delegate"],
 ["What should you ask when a PM makes a mistake?","What did you learn from it?",["Who approved this decision?","How much did it cost the bank?","Why did you not ask me first?"],"Вопрос об уроке помогает расти и не бояться решений."]]);

A('a14','Aligning roadmaps across teams','Roadmap',[
"When several PMs build their own roadmaps, conflicts appear: two teams need the same engineers, or two features collide on the same screen. A Group PM makes sure the plans fit together and point to the same bank-level goals.",
"Start by sharing the goal. If every roadmap shows how it supports the company's priorities, it becomes easier to see what matters most. Then put all plans on one page, and look for [[conflicts|conflict]], shared dependencies and gaps.",
"In a planning meeting, ask each PM to explain their top three [[bets|bet]] and what they need from others. Use a simple rule for tough choices: work that supports the biggest company goal with the least risk goes first. Write decisions down so nobody has to guess.",
"Alignment is not a one-time event. Review the combined roadmap every month, and watch for [[drift|drift]], the slow move away from the agreed plan. A short written summary after each review keeps everyone [[on the same page|on the same page]]."],
[["conflict","конфликт, пересечение","Ситуация, когда два плана мешают друг другу.","The two roadmaps have a conflict."],
 ["bet","ставка, инициатива","Крупная идея с риском и потенциальной выгодой.","Each PM has three bets this quarter."],
 ["drift","дрейф, постепенный уход от плана","Медленное отклонение от согласованного плана.","Watch for drift in the plan."],
 ["on the same page","в одном понимании","Одинаково понимать ситуацию и планы.","The summary keeps everyone on the same page."]],
[["What is a common problem when PMs make separate roadmaps?","Two teams may need the same engineers",["Roadmaps become too short to read","Customers cannot see the plans","Engineers refuse to use roadmaps"],"Планы разных команд часто конкурируют за одних и тех же людей."],
 ["What does the text say to do after sharing the goal?","Put all plans on one page and look for conflicts",["Ask engineers to choose the best plan","Cancel the plans that look risky","Wait for customers to confirm priorities"],"Общая картина помогает увидеть конфликты и пробелы."],
 ["Alignment needs to be done only once a year.","False",["True"],"Согласование нужно повторять регулярно, например каждый месяц."],
 ["In the text, 'drift' means:","a slow move away from the agreed plan",["a sudden failure in the system","a change of the team leader","the delay of a payment"],"Drift это постепенное расхождение с планом.","drift"],
 ["Which work goes first, according to the rule in the text?","Work that supports the biggest goal with the least risk",["Work that the loudest PM in the meeting requests","Work that costs the smallest amount of money overall","Work that the oldest team in the bank owns"],"Приоритет у работы, которая лучше поддерживает главную цель при малом риске."]]);

A('a15','OKRs in plain English','Strategy',[
"OKR means Objectives and Key Results. An [[objective|objective]] is a goal that explains where you want to go, in words people remember: 'Make account opening easy.' It should feel a bit ambitious and give direction.",
"[[Key results|key result]] are numbers that show whether you reached the goal. For the objective above, they could be: 'Raise account opening completion from 30% to 55%' and 'Cut support questions about ID photos by half.' A good key result is [[measurable|measurable]] and has a clear target.",
"Keep it short: one objective, with two to four key results. Too many goals mean no goals. Also separate OKRs from regular work. They show the most important change you want this quarter, not everything the team does.",
"Review OKRs regularly. Score progress honestly, and discuss what you learned. If you reach every key result easily, the goals were too safe. If you miss them by a lot, ask whether the target, the plan or the situation was wrong. The point is [[alignment|alignment]] and learning, not punishment."],
[["objective","цель","Запоминающаяся формулировка того, куда команда идёт.","Our objective is to make onboarding easy."],
 ["key result","ключевой результат","Измеримый показатель достижения цели.","Each objective has three key results."],
 ["measurable","измеримый","Такой, который можно проверить числом.","A key result must be measurable."],
 ["alignment","согласованность","Ситуация, когда команды движутся к одной цели.","OKRs create alignment."]],
[["What is an objective in OKRs?","A memorable goal that gives direction",["A number that the team checks every single day","A task list for the whole team to complete","A report that must be sent to the regulator"],"Objective это цель, дающая направление."],
 ["Which is a good key result?","Raise account opening completion from 30% to 55%",["Improve the customer experience of account opening","Work harder on onboarding during the next months","Make the whole app feel friendly and modern"],"Хороший ключевой результат измерим и имеет цель."],
 ["A team should have ten objectives each quarter.","False",["True"],"Лучше одна цель и два-четыре ключевых результата."],
 ["In the text, 'measurable' means:","possible to check with a number",["very difficult to achieve","approved by the manager","visible to all customers"],"Measurable это измеримый, то есть проверяемый числом.","measurable"],
 ["What does the text say about missing every key result by a lot?","Ask whether the target, the plan or the situation was wrong",["Punish the team to improve motivation next quarter","Set the same targets again for the following quarter","Remove the objective from the list of company goals"],"Промах это повод разобраться, а не наказывать."]]);

/* ---------- Chapter 6: Head of Product ---------- */
A('a16','Pricing: from cost to value','Pricing',[
"Many banks set prices by adding a margin to costs: 'This account costs us 3 dollars a month, so we charge 5.' This is simple, but it ignores what customers value. A customer who gets great service may happily pay more, while another will refuse any fee.",
"[[Value-based pricing|value-based pricing]] starts with the customer. Ask: what problem does this solve, and what is it worth? A business that saves hours of accounting each month may accept a higher fee than a student with a basic account. Prices should match perceived value.",
"Use each [[segment|segment]] to avoid one price for everyone. Offer a basic plan, a standard plan and a premium plan, each with a clear difference in benefits. Test prices with small groups, and measure [[price elasticity|price elasticity]]: how much demand changes when the price changes.",
"Remember trust. [[Hidden fees|hidden fees]] and surprising charges damage a bank more than low prices. Explain what customers pay for, announce changes early, and when you raise a price, show what they get in return. A fair price is one that customers understand."],
[["value-based pricing","ценообразование по ценности","Цена, которая основана на пользе для клиента, а не на затратах.","Value-based pricing needs customer research."],
 ["segment","сегмент","Группа клиентов со схожими потребностями.","Each segment has a different plan."],
 ["price elasticity","эластичность цены","Насколько спрос зависит от изменения цены.","Price elasticity is high for small accounts."],
 ["hidden fees","скрытые комиссии","Платежи, о которых клиент не знал заранее.","Hidden fees destroy trust."]],
[["What is the weakness of cost-plus pricing?","It ignores what customers value",["It makes prices too difficult to calculate","It cannot be used for bank accounts","It always creates the highest price"],"Цена от затрат не учитывает ценность для клиента."],
 ["What is price elasticity?","How much demand changes when the price changes",["How much the bank earns from each customer","How fast competitors copy a price","How many fees a customer must pay"],"Эластичность показывает чувствительность спроса к цене."],
 ["Hidden fees damage trust more than low prices.","True",["False"],"Скрытые комиссии подрывают доверие сильнее, чем низкие цены."],
 ["In the text, 'segment' means:","a group of customers with similar needs",["a part of the bank's building","a single step in a payment","a type of report for the board"],"Segment это сегмент клиентов.","segment"],
 ["What should you do when you raise a price?","Show what customers get in return",["Announce it quietly after the change","Remove the cheaper plans at once","Wait until competitors do the same"],"Повышение цены должно сопровождаться понятной ценностью."]]);

A('a17','Hiring and growing product managers','Hiring',[
"A Head of Product builds the team that builds the product. Hiring is one of the most important decisions you make, and mistakes are costly. Start with the role: what must this person own in the first six months, and what skills does the job need?",
"Test [[product sense|product sense]], the ability to understand customers and find good solutions. Give a real problem, such as 'Customers abandon the card activation screen,' and listen to how the candidate thinks. Do they ask questions, form a [[hypothesis|hypothesis]], and explain trade-offs?",
"Look at how the person works with others. Ask for stories about conflicts with engineers or executives. Strong candidates describe what they did, what they learned, and admit mistakes. Be careful with those who only say 'we': it can be a [[red flag|red flag]].",
"Hiring is only the beginning. Give new people a clear [[onboarding|onboarding]] plan, a first project that is small but real, and regular feedback. A good PM who is left alone can fail, and a good manager can help an average PM become strong."],
[["product sense","продуктовое чутьё","Умение понимать клиентов и находить хорошие решения.","She shows strong product sense."],
 ["hypothesis","гипотеза","Идея о причине или решении, которую можно проверить.","Our hypothesis is that the step is too long."],
 ["red flag","тревожный сигнал","Признак возможной проблемы.","Blaming others is a red flag."],
 ["onboarding","адаптация нового сотрудника","План, который помогает новичку быстро включиться в работу.","A good onboarding plan saves months."]],
[["What is product sense?","The ability to understand customers and find good solutions",["Knowing how to write code for a banking product","Remembering every single feature that exists in the app","Being able to read the financial reports of the bank"],"Product sense это продуктовое чутьё."],
 ["What does the text suggest giving a candidate?","A real problem, like customers abandoning card activation",["A list of the bank's internal rules and policies","A test about the history of banking in the country","A task to write a long contract with a vendor"],"Реальная задача показывает, как человек думает."],
 ["A candidate who only says 'we' may be a red flag.","True",["False"],"Если кандидат не говорит, что сделал сам, это повод насторожиться."],
 ["In the text, 'hypothesis' means:","an idea about a cause or solution that you can test",["a final decision approved by leadership","a customer complaint sent by email","a plan for the next quarter's budget"],"Гипотеза это идея, которую можно проверить.","hypothesis"],
 ["What helps a new hire succeed?","A clear onboarding plan, a small real project and feedback",["A large project with no guidance from the manager","Waiting a full month before giving any feedback","A long list of company rules to read in a week"],"Новичку нужны понятный план, реальная задача и обратная связь."]]);

A('a18','Presenting to the executive team','Communication',[
"Executives have little time and many priorities. When you present, start with the [[bottom line|bottom line]]: what you recommend and what you need from them. Then give the reasons. A story that begins with background loses the room before the point arrives.",
"Structure your message in three parts: the situation, the options and your [[recommendation|recommendation]]. Show two or three options with costs, risks and expected results. Executives like to choose, but they also want to hear what you think is best, and why.",
"Use numbers carefully. One clear chart is stronger than ten tables. Say what the number means for the business: 'Closed accounts rose 2%, which costs us about 400,000 dollars a year.' Be honest about what you do not yet know, and say how you will find out.",
"Prepare for questions. Think about what the CFO, the CEO and the head of risk will ask, and prepare short answers. If you do not know something, say so, and promise to [[follow up|follow-up]] by a date. Calm, honest answers build more [[credibility|credibility]] than perfect slides."],
[["bottom line","главный вывод","Самое важное, с чего начинают сообщение.","Start with the bottom line."],
 ["recommendation","рекомендация","Ваш совет: что делать и почему.","Our recommendation is to run a pilot."],
 ["follow-up","вернуться с ответом позже","Дополнительное действие после встречи.","I will follow up by Friday."],
 ["credibility","доверие к вам как к эксперту","Репутация человека, которому верят.","Honest answers build credibility."]],
[["How should you start a presentation to executives?","With the bottom line: your recommendation and what you need",["With a long history of the project and its background","With a joke to relax the room before the point","With a list of all possible risks and problems"],"Руководителям сначала нужен вывод и просьба."],
 ["What are the three parts of the message?","The situation, the options and your recommendation",["The budget, the schedule and the team","The problem, the apology and the plan","The data, the charts and the summary"],"Ситуация, варианты, рекомендация."],
 ["It is better to hide what you do not know.","False",["True"],"Честность о неизвестном повышает доверие."],
 ["In the text, 'credibility' means:","the quality of being trusted and believed",["the amount of money you can approve","the speed at which you answer questions","the number of people who attend"],"Credibility это доверие к вам.","credibility"],
 ["What should you do if you cannot answer a question?","Say so, and promise to follow up by a date",["Give your best guess to keep the meeting moving","Ask another person to answer for you","Say that the question is not relevant"],"Честно скажите, что не знаете, и назовите срок ответа."]]);

/* ---------- Chapter 7: CPO ---------- */
A('a19','Product vision and strategy','Strategy',[
"A [[vision|vision]] describes the future you want to create for customers, for example: 'Every small business in the country manages its money in one app.' A [[strategy|strategy]] explains how you will get there with limited time and money. A vision without strategy is a wish, and a strategy without vision is a list of tasks.",
"A good strategy makes choices. It says where you will play, such as which customers, and where you will not. It also says how you will win: faster service, better prices, or a better experience. This is your [[competitive advantage|competitive advantage]]. If everything is a priority, nothing is.",
"Test your strategy with simple questions. Could a competitor say the same thing? Does it help a team decide what to stop doing? Can a new employee explain it in one minute? If not, simplify it until they can.",
"A strategy lives through decisions. Review it every year, and listen for [[signals|signal]] that the market has changed: new regulations, new competitors, new customer habits. Be ready to change the plan, but stay stable about the vision."],
[["vision","видение","Образ будущего, которое вы хотите создать для клиентов.","The vision is clear and short."],
 ["strategy","стратегия","План, как достичь цели при ограниченных ресурсах.","Our strategy focuses on small businesses."],
 ["competitive advantage","конкурентное преимущество","То, в чём вы сильнее других.","Speed is our competitive advantage."],
 ["signal","сигнал","Признак того, что что-то на рынке меняется.","New regulation is a strong signal."]],
[["What is the difference between vision and strategy?","Vision is the future you want, and strategy is how to get there",["Vision is for customers and strategy is for investors","Vision lasts one year and strategy lasts ten","Vision is written by engineers and strategy by sales"],"Видение это куда, стратегия это как."],
 ["What does a good strategy do?","It makes choices, including what you will not do",["It lists all the ideas that the team has collected","It copies what the strongest competitors are saying","It promises strong results in every area of the bank"],"Стратегия включает отказы, а не только планы."],
 ["A new employee should be able to explain the strategy in one minute.","True",["False"],"Если новичок не может объяснить стратегию за минуту, она слишком сложная."],
 ["In the text, 'signal' means:","a sign that something in the market is changing",["a message that the bank sends to its customers","a button inside the mobile banking application","a rule issued by the financial regulator"],"Signal это сигнал об изменении рынка.","signal"],
 ["What should stay stable when the market changes?","The vision",["The detailed plan","The list of competitors","The budget of each team"],"План можно менять, а видение остаётся устойчивым."]]);

A('a20','Trust and risk in banking products','Risk',[
"In banking, trust is the product. Customers give you their money and their data, and they expect both to be safe. One serious incident can undo years of work, so a CPO thinks about [[risk|risk]] as part of every product decision, not as a final check.",
"Build safety into the process. Involve compliance and security from the start, not the day before a release. Use a [[risk assessment|risk assessment]] for every feature that touches money or personal data, and agree who owns each risk.",
"Plan for failure. Systems break, and people make mistakes. Prepare an incident plan: who leads, how to inform customers and regulators, and how to learn afterwards. A [[blameless|blameless]] review focuses on fixing the process, so people report problems early instead of hiding them.",
"When something goes wrong, be fast and honest. Say what happened, what data was affected, and what you are doing. Customers forgive mistakes more easily than secrecy. After the incident, share what changed, because trust returns through [[transparency|transparency]]."],
[["risk","риск","Вероятность того, что что-то пойдёт не так, и цена ошибки.","Every release has a risk."],
 ["risk assessment","оценка рисков","Анализ того, что может пойти не так и как это предотвратить.","We completed the risk assessment."],
 ["blameless","без поиска виноватых","Разбор, где ищут причины, а не людей.","We held a blameless review."],
 ["transparency","прозрачность","Открытость в том, что произошло и что делается.","Transparency rebuilds trust."]],
[["Why does the text say trust is the product in banking?","Customers give you their money and data and expect safety",["Banks have few other features to offer","Customers read the terms of service carefully","Regulators measure trust every month"],"Клиенты доверяют банку деньги и данные."],
 ["When should compliance and security join?","From the start of the work",["The day before the release","After customers report a problem","Only when a regulator asks"],"Безопасность закладывают с самого начала."],
 ["Customers usually forgive secrecy more easily than mistakes.","False",["True"],"Наоборот: ошибки прощают легче, чем скрытность."],
 ["In the text, 'blameless' means:","focused on fixing the process, not on blaming people",["without any records of what happened during the event","not connected with the bank's rules and policies","done only by outside experts hired for the review"],"Blameless это без поиска виноватых.","blameless"],
 ["What should a message after an incident include?","What happened, what data was affected and what you are doing",["Only an apology that is signed by the chief executive","A promise that this will never happen again in the bank","The name of the person who is responsible for the bug"],"Нужны факты, затронутые данные и действия."]]);

A('a21','Build, buy or partner','Strategy',[
"Every product leader faces this choice: should we build a capability ourselves, buy it, or work with a partner? There is no universal answer. The right choice depends on how important the capability is, how fast you need it, and what you want to learn.",
"Build when the capability is your [[core|core]], something that makes your bank different, such as your risk model or your customer experience. Building takes time and talent, but you keep control and learn deeply.",
"Buy or [[license|license]] when the capability is common and speed matters, such as card processing or identity checks. Compare the total cost over several years, not only the first price. Check the vendor's reliability, security and what happens if you want to leave, which is called [[exit cost|exit cost]].",
"Partner when another company has strengths you lack and you can share the benefits. A good partnership has clear roles, shared goals and an agreement on data. Whatever you choose, review the decision every year, and think about [[time to market|time to market]] and risk."],
[["core","ядро, основа бизнеса","То, что делает ваш банк особенным.","Risk scoring is our core."],
 ["license","лицензировать, купить право использовать","Заплатить за право использовать чужую технологию.","We license the identity check."],
 ["exit cost","стоимость выхода","Сколько стоит уйти от поставщика или партнёра.","A high exit cost creates lock-in."],
 ["time to market","время выхода на рынок","Сколько нужно времени, чтобы запустить продукт.","Buying shortens time to market."]],
[["When does the text say to build?","When the capability is core and makes your bank different",["When the capability is very common across all banks","When you need the capability as fast as possible","When another company already offers the same thing"],"Строят то, что отличает банк от других."],
 ["What should you compare when buying?","The total cost over several years, not only the first price",["The size and the location of the vendor's offices","The number of the vendor's other clients, and nothing else","The price of the cheapest competitor on the market"],"Смотрите на полную стоимость за несколько лет."],
 ["A decision to build, buy or partner never needs to be reviewed.","False",["True"],"Рынок и потребности меняются, решение нужно пересматривать."],
 ["In the text, 'exit cost' means:","the cost of leaving a vendor or partner",["the fee paid at the end of a month","the price of closing a customer account","the cost of removing an old feature"],"Exit cost это стоимость ухода от поставщика.","exit cost"],
 ["What does a good partnership need?","Clear roles, shared goals and an agreement on data",["A very long contract with many clauses","One company that makes all decisions","Public announcements before the launch"],"Хорошему партнёрству нужны роли, общие цели и договорённости о данных."]]);

function evById(id){for(var i=0;i<EVENTS.length;i++){if(EVENTS[i].id===id)return EVENTS[i];}return null;}

function evDone(id){return S.stars.indexOf(id)>-1;}

  if(!EVENTS.length)return '';

    return '<button class="evcard done" onclick="go(\'event\')"><div class="evt"><small>Event completed</small><b>'+esc(ev.title)+'</b></div></button>';

}

  if(st.l>=ev.levels.length){
    if(S.stars.indexOf(ev.id)===-1)S.stars.push(ev.id);

function randPool(){

async function initStore(){

      var db=await window.claude.use('db');

          store.kind='claude';
        }
      }
    }
  }catch(e){store.kind='none';}

    }catch(e){store.kind='none';}
  }

    var raw=localStorage.getItem(KEY2);

    localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');

async function flush(){
  if(saving){dirty=true;return;}
  saving=true;
  do{
    dirty=false;
    try{await persist();if(store.kind!=='none')store.status='ok';}
    catch(e){store.status='error';}

    else if(S.last!==todayStr())S.streak=1;
    S.last=todayStr();
    if(S.goal.indexOf(S.last)===-1)S.goal.push(S.last);
    if(S.streak>S.best)S.best=S.streak;
    MILESTONES.forEach(function(m){if(S.streak===m[0]){S.xp+=m[1];bonus.push({t:m[0]+'-day streak',xp:m[1]});}});
  }
  return bonus;
}
function finishCase(cur){
  var c=cur.c;
  S.cc+=1;
  var pi=S.pend.indexOf(c.id);
  if(cur.retry){
    if(cur.allOk)S.retry=S.retry.filter(function(r){return r.id!==c.id;});
    else setRetry(c.id);
  }else if(pi>-1){
    S.pend.splice(pi,1);setRetry(c.id);
  }
  cur.bonus=dailyProgress();
}
function answer(k){
  var cur=ui.cur;if(!cur||cur.chosen!==null||cur.stage!=='opts')return;
  var c=cur.c,st=c.steps[cur.step];
  var oi=cur.order[k],opt=st.options[oi];
  cur.chosen=oi;cur.ok=opt.ok;
  var gBefore=frontier();
  markActive();
  var base=(opt.p!==undefined)?opt.p:(opt.ok?(c.type==='special'?20:10):0);
  var tier=opt.ok?'best':(base>0?'part':'bad');
  var gain=cur.retry?Math.round(base/2):base;
  var smx=0;st.options.forEach(function(x){if(x.p>smx)smx=x.p;});
  var weak=!opt.ok&&base<=0.3*smx;
  cur.weak=weak;
  cur.tier=tier;cur.gain=0;cur.lastR=opt.r||'';
  if(c.meters&&opt.e){
    cur.mPrev=cur.m.slice();
    cur.m=cur.m.map(function(v,i){return Math.max(0,Math.min(100,v+opt.e[i]));});
  }
  cur.pts+=base;
  if(cur.retry){
    recPts(c,cur,base);
    S.xp+=gain;cur.gain=gain;
    if(weak)cur.allOk=false;
  }else{
    var key=c.id+':'+cur.step;
    if(S.done.indexOf(key)===-1){
      recPts(c,cur,base);
      S.done.push(key);
      S.xp+=gain;cur.gain=gain;
      S.stats.a+=1;if(opt.ok)S.stats.c+=1;
      var t=S.stats.t[c.topic]||[0,0];S.stats.t[c.topic]=[t[0]+1,t[1]+(opt.ok?1:0)];
    }
    if(weak&&!c.ev&&S.pend.indexOf(c.id)===-1)S.pend.push(c.id);
  }
  cur.earned+=cur.gain;
  st.words.forEach(function(w){
    var k2=w.w.toLowerCase();
    if(S.seen.indexOf(k2)===-1)S.seen.push(k2);
    if(opt.ok&&S.learned.indexOf(k2)===-1)S.learned.push(k2);
  });
  if(cur.step+1>=c.steps.length)finishCase(cur);
  var gAfter=frontier();
  if(gAfter>gBefore){cur.pending=mkPromo(cur,gAfter);}
  save();render();
  autoScrollNext();
}
function autoScrollNext(){
  setTimeout(function(){
    var a=document.getElementById('app');if(!a)return;
    var max=a.scrollHeight-a.clientHeight;
    if(max-a.scrollTop>2)a.scrollTo({top:max,behavior:'smooth'});
  },180);
}
function proceed(){
  var cur=ui.cur;if(!cur)return;
  var c=cur.c;
  if(cur.step+1<c.steps.length){
    cur.thread.push({msg:cur.shown||c.steps[cur.step].msg,reply:c.steps[cur.step].options[cur.chosen].t,r:cur.lastR});
    cur.prevBad=!!cur.weak;
    cur.step+=1;cur.order=shuffle(c.steps[cur.step].options.length);cur.chosen=null;cur.ok=null;
    cur.stage='msg';cur.fresh='msg';
    render();cur.fresh=null;window.scrollTo(0,0);
    scheduleOpts(cur);
  }else if(cur.mode==='skip'){
    var ratio=cur.smax?cur.pts/cur.smax:0,ok=ratio>=0.75,tg=ui.skipTo;
    if(ok){
      skipAhead(tg);
      var rs={ek:'good',pct:Math.round(ratio*100),xp:cur.earned,text:cur.c.endings.good};
      ui.lvlUp={g:tg,end:false,res:rs,stages:['result','promo','chapter'],i:0,skipped:true};
      ui.lvlNext=function(){var n=curIdx();if(n<FLAT.length)openLevel(n);else go('levels');};
      ui.sr=null;ui.cur=null;ui.view='levels';render();window.scrollTo(0,0);
    }else{
      ui.sr={ok:false,pct:Math.round(ratio*100),g:tg};ui.view='skipres';ui.cur=null;render();window.scrollTo(0,0);
    }
  }else if(cur.mode==='event'){
    evFinishLevel(cur);
  }else if(cur.mode==='camp'){
    var n=curIdx();
    if(!cur.replay&&!cur.back&&n<FLAT.length)openLevel(n);else go('levels');
  }else{
    var next=randomNext();
    if(next){ui.lastRand=next.c.id;beginCase(next.c,next.retry,'rand',false);}
    else go('home');
  }
}
function lxOn(cur){return hasLx(cur.c)&&cur.mode!=='skip'&&cur.mode!=='event';}
function lxDue(cur){return lxOn(cur)&&cur.step+1>=cur.c.steps.length&&cur.chosen!==null&&!(cur.x&&cur.x.done);}
function nextLabel(cur,last){
  if(last&&!cur.x&&lxOn(cur))return 'Next task';
  if(!last)return 'Next message';
  if(cur.mode==='skip')return 'See result';
  if(cur.mode==='event')return 'Continue';
  if(cur.pending)return 'Continue';
  if(cur.mode==='camp'){
    if(cur.replay||cur.back)return 'Back to levels';
    return curIdx()<FLAT.length?'Next level':'Back to levels';
  }
  return 'Next case';
}
function nextTap(){
  var cur=ui.cur;if(!cur)return;
  if(lxDue(cur)){lxStart(cur);return;}
  if(cur.pending){ui.lvlUp=cur.pending;cur.pending=null;render();}
  else proceed();
}
function lvlContinue(){
  var u=ui.lvlUp;
  if(u&&u.stages&&u.i<u.stages.length-1){u.i+=1;render();window.scrollTo(0,0);return;}
  if(u&&u.g!==undefined&&S.gseen.indexOf(u.g)===-1){S.gseen.push(u.g);save();}
  ui.lvlUp=null;var f=ui.lvlNext;ui.lvlNext=null;if(f)f();else proceed();
}

/* ================= WORD REVIEW ================= */
function isDue(k){var e=S.wr[slug(k)];return !e||e.d<=S.rc;}
function dueCount(){return S.seen.filter(function(k){return WORDS[k]&&isDue(k);}).length;}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function blank(w){var re=new RegExp(reEsc(w.w),'i');return re.test(w.ex)?w.ex.replace(re,'______'):null;}
function makeQ(k){
  var w=WORDS[k];
  var seenOthers=S.seen.filter(function(x){return x!==k&&WORDS[x];});
  var ds=pick(seenOthers,3);
  if(ds.length<3){
    var rest=Object.keys(WORDS).filter(function(x){return x!==k&&ds.indexOf(x)===-1;});
    ds=ds.concat(pick(rest,3-ds.length));
  }
  var cl=blank(w),type=(cl&&Math.random()<0.5)?'cloze':'meaning';
  var opts=[{t:type==='cloze'?w.w:w.ru,ok:true}].concat(ds.map(function(x){return {t:type==='cloze'?WORDS[x].w:WORDS[x].ru,ok:false};}));
  var order=shuffle(opts.length);
  return {key:k,type:type,prompt:type==='cloze'?cl:w.w,opts:order.map(function(i){return opts[i];}),chosen:null};
}
function startReview(){
  var keys=S.seen.filter(function(k){return WORDS[k];});
  if(!keys.length)return;
  var due=keys.filter(isDue),extra=false;
  if(!due.length){due=keys.slice();extra=true;}
  due=pick(due,due.length).sort(function(a,b){
    var ea=S.wr[slug(a)],eb=S.wr[slug(b)];
    return (ea?ea.b:-1)-(eb?eb.b:-1);
  }).slice(0,10);
  ui.rev={qs:due.map(makeQ),i:0,score:0,extra:extra,done:false};
  ui.view='review';ui.cur=null;render();window.scrollTo(0,0);
}
function revAnswer(k){
  var r=ui.rev;if(!r||r.done)return;
  var q=r.qs[r.i];if(q.chosen!==null)return;
  q.chosen=k;
  markActive();
  var ok=q.opts[k].ok;
  var sk=slug(q.key),e=S.wr[sk]||{b:0,d:0};
  var nb=ok?Math.min(3,e.b+1):0;
  S.rc+=1;
  S.wr[sk]={b:nb,d:S.rc+INTERVALS[nb]};
  var li=S.learned.indexOf(q.key);
  if(ok){r.score+=1;if(li===-1)S.learned.push(q.key);}
  else if(li>-1)S.learned.splice(li,1);
  save();render();
  autoScrollNext();
}
function revNext(){
  var r=ui.rev;if(!r)return;
  if(r.i+1<r.qs.length){r.i+=1;}else{r.done=true;}
  render();window.scrollTo(0,0);
}

function startQuiz(){
  var a=ui.art;if(!a)return;
  var qs=a.quiz.map(function(q){
    var opts=[{t:q.ok,ok:true}].concat(q.wrong.map(function(t){return {t:t,ok:false};}));
    var tf=opts.length===2&&/^(True|False)$/.test(opts[0].t)&&/^(True|False)$/.test(opts[1].t);
    var o=tf?opts.slice().sort(function(x){return x.t==='True'?-1:1;}):shuffle(opts.length).map(function(i){return opts[i];});
    return {q:q.q,e:q.e,w:q.w,opts:o,chosen:null};
  });

function quizAnswer(k){

      z.bonus=dailyProgress();

function quizNext(){

function dayWord(n){return n+(n===1?' day':' days');}

function meterHtml(cur){

  }

}
function animateMeters(){

var TWRE=/[A-Za-z]+(?:['\u2019\-][A-Za-z]+)*/g;
function tw(t){
  t=String(t);var out='',last=0,m;TWRE.lastIndex=0;
  while((m=TWRE.exec(t))){out+=esc(t.slice(last,m.index))+'<span class="tw">'+esc(m[0])+'</span>';last=m.index+m[0].length;}
  return out+esc(t.slice(last));
}
function trFor(w){
  var k=w.toLowerCase().replace(/\u2019/g,"'");
  if(TR[k])return TR[k];
  var b=k.replace(/'s$/,'');
  return TR[b]||null;
}
var trEl=null,trOn=null,trHold=null,trSuppress=0;
function closeTrans(){
  if(trEl&&trEl.parentNode)trEl.parentNode.removeChild(trEl);
  trEl=null;
  if(trOn){trOn.classList.remove('on');trOn=null;}
}
function showTrans(el){
  closeTrans();
  var w=el.textContent,tr=trFor(w);
  var pop=document.createElement('div');pop.className='trpop';pop.setAttribute('role','dialog');
  var h='<div class="trw"><span>'+esc(w.toLowerCase())+'</span>'+spkBtn(w)+'</div>';
  if(tr)h+=tr.map(function(x){return '<div class="trt">'+esc(x)+'</div>';}).join('');
  else h+='<div class="trn">No translation yet</div>';
  pop.innerHTML=h;
  pop.style.visibility='hidden';
  document.body.appendChild(pop);
  var r=el.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  var left=Math.max(12,Math.min(vw-pw-12,r.left+r.width/2-pw/2));
  var top=r.top-ph-8;
  if(top<12)top=r.bottom+8;
  if(top+ph>vh-12)top=Math.max(12,vh-ph-12);
  pop.style.left=left+'px';pop.style.top=top+'px';pop.style.visibility='visible';
  el.classList.add('on');trOn=el;trEl=pop;
}
(function(){
  function wordEl(e){var t=e.target;return (t&&t.closest)?t.closest('.tw'):null;}
  document.addEventListener('pointerdown',function(e){
    if(trEl&&!e.target.closest('.trpop'))closeTrans();
    var el=wordEl(e);
    if(el&&el.closest('.opt')&&!el.closest('.opt').getAttribute('aria-disabled')){
      clearTimeout(trHold);
      trHold=setTimeout(function(){trSuppress=1;showTrans(el);},420);
    }
  },true);
  ['pointerup','pointercancel','pointermove','scroll'].forEach(function(n){
    document.addEventListener(n,function(){
      clearTimeout(trHold);
      if(trSuppress&&n!=='pointermove')setTimeout(function(){trSuppress=0;},350);
    },true);
  });
  document.addEventListener('click',function(e){
    if(trSuppress){trSuppress=0;e.stopPropagation();e.preventDefault();return;}
    var el=wordEl(e);
    if(!el)return;
    var opt=el.closest('.opt');
    if(opt&&!opt.getAttribute('aria-disabled'))return;
    e.stopPropagation();
    showTrans(el);
  },true);
  document.addEventListener('contextmenu',function(e){if(wordEl(e))e.preventDefault();},true);
  window.addEventListener('scroll',closeTrans,{passive:true});
  window.addEventListener('resize',closeTrans);
})();

function prepQs(){
  var pool=[];(S.hist||[]).forEach(function(a){a.forEach(function(k){if(WORDS[k]&&pool.indexOf(k)===-1)pool.push(k);});});
  if(pool.length<5){S.seen.forEach(function(k){if(WORDS[k]&&pool.indexOf(k)===-1&&pool.length<12)pool.push(k);});}
  var keys=pick(pool,5),all=Object.keys(WORDS);
  return keys.map(function(k,i){
    var w=WORDS[k],rev=(i%2===1);
    var ds=pick(all.filter(function(x){return x!==k&&WORDS[x].ru!==w.ru&&WORDS[x].w.toLowerCase()!==k;}),3);
    var opts=[{t:rev?w.w:w.ru,ok:true}].concat(ds.map(function(x){return {t:rev?WORDS[x].w:WORDS[x].ru,ok:false};}));

function rpDone(i){return S.rp&&S.rp[i]!==undefined;}

function rpOpen(i){
  var r=RP[i];

  ui.view='rp';render();window.scrollTo(0,0);
}
function rpListView(){
  var done=0;for(var i=0;i<RP.length;i++)if(rpDone(i))done++;
  var h='<div class="top"><button class="back" onclick="go(\'home\')" aria-label="Back">'+BACK_SVG+'</button><div class="who"><b>Reports</b><span>'+done+' of '+RP.length+' written</span></div></div>';
  h+='<h1>Write a report</h1><div class="sub">Short emails to your manager. Fill in three gaps with the best option.</div>';
  RP.forEach(function(r,i){
    var d=rpDone(i);
    h+='<button class="artcard" onclick="rpOpen('+i+')"><div class="ah"><b>'+esc(r.subj)+'</b><em class="'+(d?'done':'')+'">'+(d?S.rp[i]+' of 3':'New')+'</em></div><span>To '+esc(r.to)+'</span></button>';
  });
  return h;
}
function rpBody(p){
  var r=RP[p.i],paras=r.t.split('\n\n');
  return paras.map(function(para){
    var h=esc(para).replace(/\{(\d)\}/g,function(m,n){
      var g=+n-1,a=p.ans[g],cls='gap',txt;
      if(p.checked){var ok=r.g[g][0],right=(a===0);cls+=right?' ok':' bad';txt=ok;}
      else if(a!==null){cls+=' fill'+(p.act===g?' act':'');txt=r.g[g][a];}
      else{cls+=(p.act===g?' act':'')+' empty';txt='Gap '+n;}
      return '<button class="'+cls+'" onclick="rpGap('+g+')">'+esc(txt)+'</button>';
    });
    return '<p>'+h+'</p>';
  }).join('');
}
function rpView(){
  var p=ui.rp,r=RP[p.i];
  var h='<div class="top"><button class="back" onclick="openReports()" aria-label="Back">'+BACK_SVG+'</button><div class="who"><b>Write a report</b><span>Report '+(p.i+1)+' of '+RP.length+'</span></div></div>';
  h+='<div class="mail"><div class="mh"><span>To</span><b>'+esc(r.to)+'</b></div><div class="mh"><span>Subject</span><b>'+esc(r.subj)+'</b></div><div class="mb">'+rpBody(p)+'</div></div>';
  var all=p.ans.every(function(x){return x!==null;});
  if(!p.checked){
    var g=p.act;
    h+='<div class="rphint">Gap '+(g+1)+' of 3: choose the best option</div>';
    for(var k=0;k<3;k++){var o=p.ord[g][k];
      h+='<button class="ropt'+(p.ans[g]===o?' sel':'')+'" onclick="rpPick('+o+')">'+esc(r.g[g][o])+'</button>';}
    if(all)h+='<button class="cta" onclick="rpCheck()">Check report</button>';
  }else{
    var sc=p.ans.filter(function(a){return a===0;}).length;
    h+='<div class="fb"><h3 class="'+(sc===3?'ok':'bad')+'">'+sc+' of 3 correct</h3>';
    for(var j=0;j<3;j++){
      var okk=p.ans[j]===0;
      h+='<p><b>Gap '+(j+1)+'.</b> '+(okk?'':'You chose: <i>'+esc(r.g[j][p.ans[j]])+'</i>. ')+'Best: <b>'+esc(r.g[j][0])+'</b></p><p class="ex">'+esc(r.g[j][3])+'</p>';
    }
    h+='</div>';
    if(p.i+1<RP.length)h+='<button class="cta" onclick="rpOpen('+(p.i+1)+')">Next report</button>';
    h+='<button class="cta alt" onclick="openReports()">All reports</button>';
  }
  return h;
}
function rpKeep(f){var y=$app.scrollTop;f();render();$app.scrollTop=y;}
function rpGap(g){var p=ui.rp;if(!p||p.checked)return;p.act=g;rpKeep(function(){});}
function rpPick(o){
  var p=ui.rp;if(!p||p.checked)return;
  p.ans[p.act]=o;
  var nx=-1;for(var d=1;d<=3;d++){var g=(p.act+d)%3;if(p.ans[g]===null){nx=g;break;}}
  if(nx>=0)p.act=nx;
  rpKeep(function(){});
}
function rpCheck(){
  var p=ui.rp;if(!p||p.checked)return;
  var sc=p.ans.filter(function(a){return a===0;}).length;
  p.checked=true;
  S.rp=S.rp||{};
  if(S.rp[p.i]===undefined){S.xp+=sc*3;markActive();}
  S.rp[p.i]=Math.max(S.rp[p.i]||0,sc);
  save();render();window.scrollTo(0,0);
}

function caseView(){
  var cur=ui.cur,c=cur.c,st=c.steps[cur.step];
  if(cur.x&&!cur.x.done)return lxView();
  var init=c.sender.name.charAt(0).toUpperCase();
  var parts=[];
  if(cur.mode==='skip')parts.push('Skip challenge');else if(cur.replay)parts.push('Practice');else if(cur.retry)parts.push('Retry');
  if(cur.mode==='event')parts.push('Event');
  if(cur.boss&&cur.mode!=='skip')parts.push('Boss');
  if(lxOn(cur))parts.push('Task 1 of 3');
  if(c.steps.length>1)parts.push('Step '+(cur.step+1)+' of '+c.steps.length);
  var h='<div class="top">'+
   '<button class="back" onclick="go(\''+(cur.mode==='event'?'event':(cur.mode!=='rand'?'levels':'home'))+'\')" aria-label="Back">'+BACK_SVG+'</button>'+
   '<div class="avatar">'+esc(init)+'</div>'+
   '<div class="who"><b>'+esc(c.sender.name)+'</b><span>'+esc(c.sender.role)+', '+esc(c.sender.channel)+'</span></div>'+
   (parts.length?'<div class="tag">'+parts.join(', ')+'</div>':'')+
  '</div>';
  if(c.meters)h+=meterHtml(cur);
  cur.thread.forEach(function(t){h+=bub(t.msg,false)+bub(t.reply,true)+(t.r?'<div class="narr">'+tw(t.r)+'</div>':'');});
  if(cur.stage==='wait'){
    h+='<button class="bub notif pop" onclick="openMsg()">New message from '+esc(c.sender.name)+'<span>Tap to open'+(c.scn?', up to '+cur.smax+' XP':'')+'</span></button>';
    return h;
  }
  var shownMsg=(st.alt&&cur.prevBad)?st.alt:st.msg;
  cur.shown=shownMsg;
  h+='<div class="bub'+(cur.fresh==='msg'?' pop':'')+'">'+tw(shownMsg)+'</div>';
  if(cur.stage!=='opts')return h;
  var anim=cur.fresh==='opts';
  h+='<div class="opts"><div class="opts-h'+(anim?' pop':'')+'">Choose the best answer:</div>';
  for(var k=0;k<cur.order.length;k++){
    var oi=cur.order[k],o=st.options[oi];
    var cls='opt',done=cur.chosen!==null,inner=tw(o.t);
    if(done){
      cls+=o.ok?' ok':(o.p>0?' part':' bad');
      inner+='<span class="oc"><span class="oh"><b>'+o.p+' XP</b>'+(oi===cur.chosen?'<i>Your answer</i>':'')+'</span>'+(o.c?'<span class="ob">'+esc(o.c)+'</span>':'')+'</span>';
    }
    if(anim)cls+=' pop';
    h+='<button class="'+cls+'"'+(anim?' style="animation-delay:'+((k+1)*150)+'ms"':'')+' onclick="answer('+k+')"'+(done?' aria-disabled="true"':'')+'>'+inner+'</button>';
  }
  h+='</div>';
  if(cur.chosen!==null){
    var last=cur.step+1>=c.steps.length;
    var o2=st.options[cur.chosen];
    var head,hcls;
    head=cur.tier==='best'?'Best choice, +'+cur.gain+' XP':(cur.tier==='part'?'Reasonable choice, +'+cur.gain+' XP':'Not this one, +0 XP');
    hcls=cur.tier==='best'?'ok':(cur.tier==='part'?'part':'bad');
    var fx='';
    if(c.scn){
      fx='<h4>What happened</h4><p>'+tw(o2.r)+'</p><div class="effs">'+o2.e.map(function(d,i){return d===0?'':'<span class="eff '+(d>0?'up':'dn')+'">'+esc(c.meters[i])+' '+(d>0?'+':'')+d+'</span>';}).join('')+'</div>'+(st.explain?'<h4>Takeaway</h4>':'');
    }
    var endHtml='';
    if(c.scn&&last&&!(cur.pending&&cur.pending.res)){
      var ratio=cur.smax?cur.pts/cur.smax:0;
      var ek=ratio>=0.75?'good':(ratio>=0.4?'mid':'bad');
      var et=ek==='good'?'Great outcome':(ek==='mid'?'Mixed outcome':'Rough outcome');
      endHtml='<h4>'+et+'</h4><p>'+tw(c.endings[ek])+'</p><div class="bonus">Case total, +'+cur.earned+' XP</div>';
    }
    h+='<div class="fb" id="fb">'+
      '<h3 class="'+hcls+'">'+head+'</h3>'+
      fx+
      (st.explain?'<p>'+tw(st.explain)+'</p>':'')+
      '<h4>Added to your dictionary</h4>'+
      '<div class="chips">'+st.words.map(function(w){return '<span class="chip">'+esc(w.w)+'</span>';}).join('')+'</div>'+
      endHtml+
      (last&&S.retry.some(function(r){return r.id===c.id;})?'<div class="bonusnote">This case will come back later in Random case.</div>':'')+
      cur.bonus.map(function(b){return '<div class="bonus">'+esc(b.t)+', +'+b.xp+' XP</div>';}).join('')+
      '</div>'+
      '<button class="cta" onclick="nextTap()">'+nextLabel(cur,last)+'</button>';
  }
  return h;
}

function wordList(){
  var q=ui.q.trim().toLowerCase();
  var items=S.seen.map(function(k){return {k:k,w:WORDS[k],l:S.learned.indexOf(k)>-1};}).filter(function(x){return x.w;});
  if(ui.filter==='new')items=items.filter(function(x){return !x.l;});
  if(ui.filter==='learned')items=items.filter(function(x){return x.l;});
  if(q)items=items.filter(function(x){return x.w.w.toLowerCase().indexOf(q)>-1||x.w.ru.toLowerCase().indexOf(q)>-1;});
  if(!items.length){
    return '<div class="empty">'+(S.seen.length?'No words match.':'Words appear here after your first case.')+'</div>';
  }
  items.sort(function(a,b){return a.w.w.localeCompare(b.w.w);});
  return items.map(function(x){
    return '<div class="card"><div class="w"><b>'+esc(x.w.w)+spkBtn(x.w.w)+'</b><i class="'+(x.l?'':'new')+'">'+(x.l?'Learned':'New')+'</i></div>'+
      '<div class="ru">'+esc(x.w.ru)+'</div>'+
      '<p>'+esc(x.w.how)+'</p>'+
      '<p class="ex">'+esc(x.w.ex)+'</p></div>';
  }).join('');
}
function words(){
  var f=function(id,label){return '<button class="f'+(ui.filter===id?' on':'')+'" onclick="setFilter(\''+id+'\')">'+label+'</button>';};
  return '<h1>Dictionary</h1>'+
    (S.seen.length?'<button class="cta" style="margin:0 0 16px" onclick="startReview()">Review words</button>':'')+
    '<input class="search" type="search" placeholder="Search a word" value="'+esc(ui.q)+'" oninput="onSearch(this.value)">'+
    '<div class="filters">'+f('all','All')+f('new','New')+f('learned','Learned')+'</div>'+
    '<div id="wl">'+wordList()+'</div>';
}

function progress(){
  var h='<div class="top"><button class="back" onclick="go(\'home\')" aria-label="Back">'+BACK_SVG+'</button></div><h1>Progress</h1>';
  var acc=S.stats.a?Math.round(S.stats.c/S.stats.a*100):0;
  h+='<div class="tiles"><div class="tile"><b>'+acc+'%</b><span>accuracy</span></div><div class="tile"><b>'+S.learned.length+'</b><span>words learned</span></div></div>';

  var scn=CASES.filter(function(c){return c.scn;});
  h+='<div class="sec">Scenarios</div><div class="row"><div><b>Scenarios solved</b><span>Multi-step cases with consequences</span></div><em>'+scn.filter(caseDone).length+' of '+scn.length+'</em></div>';
  if(EVENTS.length)h+='<div class="row"><div><b>Event stars</b><span>Earned by finishing events, kept forever</span></div><em>'+S.stars.length+' of '+EVENTS.length+'</em></div>';
  var st=streakNow();
  h+='<div class="sec">Daily goal and streak</div>';
  h+='<div class="row"><div><b>Daily goal</b><span>'+GOAL+(GOAL===1?' case':' cases')+' a day, +'+GOAL_XP+' XP</span></div><em>'+Math.min(S.day.n,GOAL)+' of '+GOAL+'</em></div>';
  h+='<div class="row"><div><b>Current streak</b><span>Best: '+dayWord(S.best)+'</span></div><em>'+dayWord(st)+'</em></div>';
  MILESTONES.forEach(function(m){
    var got=st>=m[0];
    h+='<div class="row'+(got?'':' lock')+'"><div><b>'+m[0]+' days in a row</b><span>+'+m[1]+' XP</span></div><em>'+(got?'Reached':(m[0]-st)+' to go')+'</em></div>';
  });

  h+='<div class="sec">Review queue</div>';
  h+='<div class="row"><div><b>Words to review</b><span>Due now in Review</span></div><em>'+dueCount()+'</em></div>';
  h+='<div class="row"><div><b>Cases to retry</b><span>Come up in Random case</span></div><em>'+S.retry.length+'</em></div>';
  if(ARTICLES.length)h+='<div class="row"><div><b>Articles with quiz</b><span>Read, then answer 5 questions</span></div><em>'+artsDone()+' of '+ARTICLES.length+'</em></div>';

  h+='<div class="sec">Career path</div>';
  var cg=curGrade();
  for(var g=0;g<PLAN.length;g++){
    var gs=gStats(g),open=gs.done>0||g<=cg;
    var cur=(g===cg&&!gs.complete);
    h+='<div class="row'+(cur?' cur':'')+(open?'':' lock')+'"><div><b>'+esc(LEVELS[g].n)+'</b><span>'+gs.done+' of '+gs.total+' levels, boss case included'+(gs.done>0?', score '+Math.round(gradeScore(g).pct*100)+'%':'')+'</span></div><em>'+(gs.complete?'Complete':(cur?'Current':(open?'Started':'Locked')))+'</em></div>';
  }
  var topics=Object.keys(S.stats.t);
  if(topics.length){
    h+='<div class="sec">Topics</div>';
    topics.sort().forEach(function(t){
      var v=S.stats.t[t],p=v[0]?Math.round(v[1]/v[0]*100):0;
      h+='<div class="topic"><div><b>'+esc(t)+'</b><span>'+v[1]+' of '+v[0]+' correct</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
    });
  }
  h+='<div class="sec">Settings</div><button class="row tgl'+(S.rv!==false?' on':'')+'" onclick="toggleRv()"><div><b>Review before lessons</b><span>'+(S.rv!==false?'5 words from your last 5 lessons. Tap to turn off.':'Turned off. Tap to turn on.')+'</span></div><i class="sw"></i></button>';
  h+=accountHTML();
  h+='<button class="reset" onclick="resetTap()">'+(ui.resetArmed?'Tap again to erase progress in this track':'Reset this track')+'</button>';
  h+='<button class="special alt onbbtn" onclick="startOnb()"><div><b>Onboarding</b><span>Show the quick tour again</span></div><em>Start</em></button>';
  var msg=store.kind==='claude'?'Saved to your Claude account.':(cloud.user&&cloud.ready?'Saved to your account and on this device.':store.kind==='local'?'Saved on this device only.':'Saving is not available in this view, progress will reset when you leave.');
  if(store.status==='error')msg='Last save failed. It will retry on your next answer.';
  h+='<div class="save">'+msg+'</div>';
  return h;
}


function artHtml(a){
  return a.text.map(function(p){
    var h=esc(p).replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,function(m,disp,key){
      var i=-1;
      for(var j=0;j<a.words.length;j++){if(a.words[j].w.toLowerCase()===key.toLowerCase()){i=j;break;}}
      return i<0?disp:'<button class="kw" onclick="showKw('+i+')">'+disp+'</button>';
    });
    return '<p>'+h+'</p>';
  }).join('');
}

  h2+='<div class="rq cloze">'+esc(q.q)+'</div><div class="rhint">Choose one answer</div>';

    h2+='<button class="'+cls+'" onclick="quizAnswer('+k+')"'+(q.chosen!==null?' disabled':'')+'>'+esc(o.t)+'</button>';
  }

    h2+='<div class="fb" id="fb"><h3 class="'+(ok?'ok':'bad')+'">'+(ok?'Correct':'Not quite')+'</h3><p>'+esc(q.e)+'</p></div>'+
        '<button class="cta" onclick="quizNext()">'+(z.i+1<n?'Next question':'See result')+'</button>';

function bannerInner(g){
  var gs=gStats(g);
  return '<div><small>Chapter '+(g+1)+'</small><b>'+esc(LEVELS[g].n)+'</b></div><em>'+gs.done+' of '+gs.total+'</em>';
}
var CX=160,SH=72,ROW=118,TOP0=112,SNAKE=[0,1,0,-1];
function gradeSection(g,ci){
  var idxs=[],a=[];
  FLAT.forEach(function(f,i){if(f.g===g){a.push(f);idxs.push(i);}});
  var gs=gStats(g),n=a.length,H=TOP0+(n-1)*ROW+104;
  var pts=a.map(function(f,k){return {x:CX+SNAKE[k%4]*SH,y:TOP0+k*ROW};});
  var Rr=((ROW*ROW+SH*SH)/(2*SH)).toFixed(2);
  function segD(s){return 'M'+pts[s].x+' '+pts[s].y+' A'+Rr+' '+Rr+' 0 0 '+(Math.floor(s/2)%2===0?1:0)+' '+pts[s+1].x+' '+pts[s+1].y;}
  var offD='',onD='',skD='';
  for(var s=0;s<n-1;s++){offD+=segD(s)+' ';var ss=levelState(idxs[s],ci);if(ss==='done')onD+=segD(s)+' ';else if(ss==='skip')skD+=segD(s)+' ';}
  var svg='<svg class="pth" viewBox="0 0 320 '+H+'" preserveAspectRatio="none" aria-hidden="true"><path class="off" d="'+offD+'"/>'+(skD?'<path class="sk" d="'+skD+'"/>':'')+(onD?'<path class="on" d="'+onD+'"/>':'')+'</svg>';
  var nodes='';
  a.forEach(function(f,k){
    var i=idxs[k],st=levelState(i,ci),p=pts[k],inner;
    if(st==='done')inner=ICO.check;
    else if(st==='lock')inner=ICO.lock;
    else if(st==='skip')inner='';
    else inner=f.boss?ICO.star:String(f.i+1);
    var lab=(f.boss?'Boss case':'Level '+(f.i+1))+', '+(st==='done'?'completed':(st==='cur'?'next up':(st==='skip'?'skipped, open':'locked')));
    nodes+='<button class="nd '+st+(f.boss?' boss':'')+'"'+(st==='cur'?' id="curnode"':'')+' style="left:'+(p.x/320*100).toFixed(2)+'%;top:'+p.y+'px" onclick="openLevel('+i+')" aria-label="'+lab+'">'+
      inner+(st==='cur'?'<span class="pill">Start</span>':'')+(f.boss?'<span class="bl">Boss case</span>':'')+'</button>';
  });
  var cg=curGrade();
  var sub=gs.complete?(gradePassed(g)?'Completed':'Score '+Math.round(gradeScore(g).pct*100)+'%, need '+passTxt()+' to move on'):(gs.done===0&&g>cg?'Locked until you score '+passTxt()+' in '+esc(LEVELS[g-1].n):gs.done+' of '+gs.total+' levels'+(g<cg?', skipped ones are open':''));
  var skip=(g>cg&&!gs.complete)?'<button class="skipbtn" onclick="trySkip('+g+')">Try to skip ahead</button>':'';
  var arts=ARTICLES.length?'<button class="skipbtn alt" onclick="openArticles('+g+')">Articles</button>':'';
  return '<section class="gsec" data-g="'+g+'"><div class="gh"><small>Chapter '+(g+1)+'</small><h2>'+esc(ROLES[g].t)+'</h2><span>'+sub+'</span><div class="gbtns">'+arts+skip+'</div></div>'+
    '<div class="pathbox" style="height:'+H+'px">'+svg+nodes+'</div></section>';
}

  else if(ui.view==='evintro'&&ui.evi!==undefined)h=evIntroView();
