 [["SSO","единый вход (single sign-on)","Вход во многие сервисы через один корпоративный аккаунт.","SSO lets employees sign in with one account."],["churn risk","риск ухода клиента","Вероятность, что клиент прекратит пользоваться продуктом.","This account is a churn risk."],["size","оценить объём","Глагол: прикинуть масштаб работы.","Let's size the project first."]]),
 St("SSO would take eight weeks, and the customer needs it in four. Options?",
 "Let's offer a phased plan: a basic version for their team in four weeks and the full version later. I'll confirm it with the customer before we commit.",
 ["Tell the customer eight weeks is the best we can do.","Add contractors to finish in four weeks, regardless of cost.","Promise four weeks and cut testing to keep the date."],
 "Поэтапный план закрывает срочную потребность и сохраняет качество, а согласование с клиентом снижает риск. Жёсткий отказ, любые затраты ради срока или экономия на тестировании создают проблемы.",
 [["MVP","минимально жизнеспособный продукт","Самая простая версия, которая уже даёт ценность.","We shipped an MVP in four weeks."],["contractor","подрядчик","Внешний специалист, нанятый на проект.","We hired a contractor for the project."],["regardless of","независимо от","Не учитывая что-то.","Ship it regardless of the cost."]])]),

C('s05','special',2,'Experiments','Priya','Data Analyst','Slack',[
 St("Adoption of the new feature is only 5% after a month. What do we do first?",
 "Let's find out where users drop off between seeing the feature and using it, and talk to some who ignored it.",
 ["Send an email blast to all users announcing the feature again.","Remove the feature. Five percent adoption proves nobody wants it.","Wait another month. Adoption usually takes time."],
 "Сначала нужно найти место, где теряются пользователи, и поговорить с теми, кто не воспользовался фичей. Повторная рассылка, удаление или ожидание без анализа не отвечают на вопрос «почему».",
 [["adoption","принятие, использование новой функции","Доля пользователей, которые начали пользоваться фичей.","Adoption is only five percent."],["email blast","массовая рассылка","Одно письмо сразу всем пользователям.","We sent an email blast to all users."],["funnel","воронка","Цепочка шагов, по которой пользователи идут к цели.","Let's look at the funnel step by step."]]),
 St("Interviews show users didn't notice the feature. It's hidden in settings.",
 "Then discoverability is the problem, not value. Let's test a prominent entry point and measure adoption again.",
 ["Then the feature isn't valuable. Users would have found it.","Add a pop-up that appears every time users open the app.","Move the feature to the main menu permanently without testing."],
 "Проблема в том, что фичу не замечают, а не в её ценности. Нужно проверить заметное размещение тестом. Считать фичу бесполезной, надоедать всплывающим окном или менять меню без теста неверно.",
 [["discoverability","обнаруживаемость, заметность функции","Насколько легко пользователь находит функцию сам.","Discoverability is low for this feature."],["prominent","заметный, выделяющийся","О расположении или элементе, который сразу бросается в глаза.","Put the button in a prominent place."],["pop-up","всплывающее окно","Окно, которое появляется поверх страницы.","A pop-up can annoy users."]])]),

C('s06','special',2,'Stakeholders','Oleg','Product Designer','Slack',[
 St("Engineers rejected my design as too complex and never told me why. I'm frustrated.",
 "Thanks for telling me. Let's set up a short session with engineering so you can hear their concerns and find a simpler option together.",
 ["Engineers know what's feasible. Please just simplify the design.","I'll tell the engineers to implement your design as it is.","Let's wait. They'll come to you if there's a real problem."],
 "Нужно создать место для разговора, где обе стороны услышат аргументы. Заставлять дизайнера упрощать, давить на инженеров или ждать значит не решать конфликт.",
 [["feasible","осуществимый, реалистичный","Можно ли это сделать в имеющихся условиях.","Is this feasible in two weeks?"],["concern","опасение, беспокойство","Причина, по которой человек сомневается.","Engineering raised a concern."],["implement","реализовать, внедрить","Воплотить решение в продукте.","We will implement the design next sprint."]]),
 St("Dana from engineering: We rejected it because it requires a rewrite of the data layer. Nobody asked us earlier.",
 "That's fair. Let's involve engineering from the start of design, with a quick feasibility check before designers invest time.",
 ["That's not fair. Designers can't check every detail.","In future, designers should only send finished designs for approval.","Let's hire another designer who understands technical constraints."],
 "Справедливое замечание: инженеров нужно подключать раньше. Короткая проверка осуществимости экономит время. Защищаться, оставить прежний процесс или менять людей не устраняет причину.",
 [["involve","вовлекать","Привлекать к участию.","Involve engineers early."],["technical constraint","техническое ограничение","Технический фактор, который ограничивает решение.","Every design has a technical constraint."],["feasibility check","проверка осуществимости","Быстрая оценка, можно ли это сделать.","A feasibility check saves time."]])]),

/* Level 3: Senior PM */
C('s07','special',3,'Stakeholders','Nora','Chief of Staff','Slack',[
 St("Three teams own parts of checkout. Conversion is stuck and nobody owns the whole flow. What do you do?",
 "Let's propose a single owner for the end-to-end flow with a shared metric, and align the three teams on priorities in a working session.",
 ["Ask each team to improve its own part and report weekly.","Take over all three teams' backlogs yourself.","Escalate to the CEO and ask her to reorganize the teams."],
 "Нужен один владелец сквозного процесса, общая метрика и согласование приоритетов. Просить каждую команду улучшать свой участок, забирать работу себе или сразу эскалировать к CEO не создаёт общей ответственности.",
 [["end-to-end","сквозной, от начала до конца","О процессе целиком, а не его части.","We own the end-to-end flow."],["shared metric","общая метрика","Показатель, за который отвечают несколько команд.","Teams need a shared metric."],["working session","рабочая сессия","Встреча для совместной работы над решением.","Let's book a working session."]]),
 St("Tom, Engineering Manager: My team has no capacity for this. We have our own goals.",
 "Let's look at your goals and where they overlap with checkout. I'll bring a proposal so your team trades work rather than adds it.",
 ["This is the company's top priority. Your goals can wait.","Then we'll proceed without your team and tell them afterwards.","Let's postpone checkout until all teams have free capacity."],
 "Нужно найти пересечения целей и предложить обмен задач, а не дополнительную нагрузку. Приказывать, действовать без команды или откладывать всё до свободных ресурсов не работает.",
 [["overlap","пересекаться","Частично совпадать.","The two goals overlap."],["trade","обменять","Отдать одно, чтобы получить другое.","We trade scope for time."],["proceed","продолжать, двигаться дальше","Идти дальше по плану.","We can proceed without it."]])]),

C('s08','special',3,'Strategy','Sam','CEO','Email',[
 St("We can enter a new market or deepen our current one. Which do you recommend?",
 "I'd want data on both: our current market's headroom and retention, and the new market's size and competition. Then I'd recommend, with the risks clearly stated.",
 ["Enter the new market. Growth always comes from expansion.","Stay in the current market. Focus always beats diversification.","Do both at once so we don't miss either opportunity."],
 "Решение нужно основывать на данных по обоим вариантам и ясно называть риски. Универсальные правила («всегда расширяться» или «всегда фокусироваться») и попытка делать всё сразу не заменяют анализ.",
 [["headroom","запас для роста","Сколько ещё можно вырасти в текущем рынке.","There is still headroom in this segment."],["expansion","расширение","Выход на новые рынки или аудитории.","Expansion into new markets is risky."],["diversification","диверсификация","Распределение усилий по нескольким направлениям.","Diversification reduces risk."]]),
 St("Nora: The board wants a decision this week. Do you have enough data?",
 "We have enough for a reversible first step: a small pilot in the new market while we keep investing in the current one. Here's what we'd learn before scaling.",
 ["No. I can't recommend anything until we have complete data.","Yes. Pick the new market and I'll figure out the rest.","Let's tell the board it's the CEO's decision, not ours."],
 "Когда данных мало, а решение нужно, выбирают обратимый шаг: небольшой пилот и понятный план обучения. Отказ рекомендовать, слепой выбор или перекладывание ответственности не помогают бизнесу.",
 [["reversible","обратимый","Такой, что можно отменить без больших потерь.","Prefer reversible decisions."],["pilot","пилот, пробный запуск","Небольшой тест на ограниченной аудитории.","We ran a pilot in one city."],["scale","масштабировать","Расширить работающее решение на больший объём.","We will scale after the pilot."]])]),

/* Level 4: Group PM */
C('s09','special',4,'Leadership','Carlos','Engineering Manager','Slack',[
 St("One of your PMs keeps missing deadlines, and the team has noticed. What do you do?",
 "I'd talk to the PM privately first to understand the cause, agree on clear expectations and support, and check progress in a few weeks.",
 ["Raise it in the next team meeting so they feel accountable.","Take their projects away immediately to protect the team.","Wait until their annual review to give feedback."],
 "Сначала личный разговор, выяснение причин, ясные ожидания и поддержка. Публичное обсуждение, немедленное снятие проектов или ожидание ежегодной оценки подрывают доверие и не помогают человеку.",
 [["accountable","ответственный, подотчётный","Тот, кто отвечает за результат.","Everyone is accountable for results."],["expectations","ожидания","Что именно от человека ожидается.","Set clear expectations."],["feedback","обратная связь","Оценка работы и советы по улучшению.","Give feedback early."]]),
 St("The PM says: I'm struggling because priorities keep changing from leadership, not because of my work.",
 "That's useful. Let's document the changes and take the pattern to leadership, while we also agree how you'll flag risks earlier.",
 ["Everyone has changing priorities. You need to handle it.","I'll tell leadership to stop changing priorities.","Then there's no problem with your work, so we're done here."],
 "Нужно зафиксировать изменения, показать закономерность руководству и договориться, как PM будет заранее сигнализировать о рисках. Отмахнуться, обещать невозможное или закрыть тему не решает ни одну из проблем.",
 [["document","документировать, фиксировать","Записывать, чтобы можно было показать другим.","Let's document every change."],["pattern","закономерность","Повторяющаяся схема в данных или поведении.","We see a pattern in the delays."],["flag","сигнализировать, пометить","Заранее предупредить о риске.","Flag risks early."]])]),

C('s10','special',4,'Roadmap','Nora','Chief of Staff','Slack',[
 St("Three PMs on your team have roadmaps that conflict. How do you align them?",
 "I'd get them together, map dependencies, and agree on shared priorities tied to company goals, with clear owners for conflicts.",
 ["Let each PM defend their roadmap and vote on the winner.","Choose one roadmap myself and tell the others to follow it.","Merge the three roadmaps into one long list."],
 "Нужно вместе увидеть зависимости, связать приоритеты с целями компании и назначить ответственных за конфликты. Голосование, единоличный выбор или механическое объединение списков не создаёт согласованности.",
 [["dependency","зависимость","Ситуация, когда одна работа ждёт результата другой.","Every dependency adds risk."],["align","согласовать, привести к единому плану","Договориться о едином направлении.","We need to align on priorities."],["tied to","связанный с","Напрямую привязанный к чему-то.","Initiatives should be tied to company goals."]]),
 St("A PM says: My project depends on another team that keeps pushing the date.",
 "Let's agree on a date with that team's lead, add a checkpoint halfway, and prepare a fallback plan in case the date slips again.",
 ["Send them a daily reminder until they deliver.","Tell them our project is more important than theirs.","Assume the date will slip and add two months to your plan."],
 "Нужно договориться с руководителем той команды, добавить контрольную точку и подготовить запасной план. Ежедневные напоминания, давление статусом проекта или закладка лишнего времени не управляют риском.",
 [["checkpoint","контрольная точка","Момент, когда проверяют прогресс.","Add a checkpoint halfway."],["fallback plan","запасной план","План на случай, если основной не сработает.","We need a fallback plan."],["push back","отодвигать срок, возражать","Переносить дату или не соглашаться.","They push back on the date every time."]])]),

/* Level 5: Head of Product */
C('s11','special',5,'Strategy','Nora','Chief of Staff','Email',[
 St("The exec team asks for a three-year product vision by Friday. How do you approach it?",
 "I'd start with customer problems and company strategy, draft a short vision with leaders, and test it with a few teams before presenting.",
 ["Write it alone this week so it's consistent and delivered with confidence.","Ask each PM to write a section and combine them.","Ask for more time. A vision needs months of research."],
 "Видение строят от проблем клиентов и стратегии, набрасывают с лидерами и проверяют на командах. Писать в одиночку, склеивать части или просить месяцы не даёт ни качества, ни вовлечённости.",
 [["vision","видение","Образ того, каким продукт должен стать.","A vision should inspire the team."],["consistent","последовательный, согласованный","Без противоречий в сообщениях и решениях.","Keep the message consistent."],["draft","набросать, черновик","Глагол и существительное: первая версия документа.","I'll draft it tonight."]]),
 St("The CEO says: One exec thinks the vision is too ambitious. Others think it's too safe.",
 "Both views are useful. Let's define what 'ambitious' means in metrics, show two scenarios, and ask the executives to choose the level of risk.",
 ["Take the average. Make it somewhat ambitious.","Defend the vision as written. It's already been reviewed.","Tell them it's a product decision and they should trust you."],
 "Разногласие полезно превратить в выбор: определить амбицию в метриках и показать два сценария. Усреднять, защищать любой ценой или просить доверия не отвечает на вопрос «какой уровень риска нужен».",
 [["ambitious","амбициозный","Требующий больших усилий и дающий большой результат.","The goal is too ambitious."],["scenario","сценарий","Один из возможных вариантов развития событий.","We modeled two scenarios."],["trust","доверять, доверие","Верить в компетентность человека.","They trust the team."]])]),

C('s12','special',5,'Leadership','Carlos','Engineering Manager','Slack',[
 St("We're growing fast. Should product be organized by feature area or by customer segment?",
 "I'd compare how customers experience the product and where teams collide today, then pick the structure that reduces handoffs for our top goals.",
 ["By feature area. It's the standard model and easiest to hire for.","By customer segment. Customers should always come first.","Keep it as it is. Reorganizations always hurt productivity."],
 "Структуру выбирают под цели и реальные точки столкновения команд, чтобы сократить передачи работы. Стандартная модель, формула «клиент прежде всего» или отказ от изменений без анализа не подходят.",
 [["handoff","передача работы между командами","Момент, когда задача переходит от одной команды к другой.","Each handoff slows us down."],["collide","сталкиваться","Мешать друг другу, пересекаться интересами.","Two teams collide on checkout."],["structure","структура","То, как организована команда или продукт.","We changed the team structure."]]),
 St("Anna from HR: How many PMs should we hire next year?",
 "Let's start from goals and bottlenecks: where a lack of PM capacity blocks outcomes. I'd hire to remove those bottlenecks, not to hit a ratio.",
 ["One PM per five engineers, as most companies do.","As many as the budget allows.","None. Existing PMs should work harder."],
 "Найм привязывают к целям и узким местам, а не к формуле. Копировать пропорцию, тратить весь бюджет или требовать работать усерднее не решает проблему.",
 [["bottleneck","узкое место","Участок, который ограничивает скорость всей работы.","Planning is the bottleneck."],["ratio","соотношение","Отношение одного количества к другому.","The ratio is one PM to six engineers."],["headcount","штатная численность","Сколько людей в команде или компании.","We need to plan headcount for next year."]])]),

/* Level 6: CPO */
C('s13','special',6,'Leadership','Nora','Chief of Staff','Email',[
 St("Revenue missed the target by 12% this quarter. The board wants an explanation from product.",
 "I'd present the facts: what drove the miss, what we learned, and the plan with owners and dates. Product owns its part, and I'd name the dependencies on sales and pricing.",
 ["Explain that the miss came from sales execution, not product.","Promise to recover the full miss next quarter.","Show the positive metrics first so the board doesn't focus on the miss."],
 "Совету нужны факты, выводы, план с владельцами и сроками и честное признание своей доли. Перекладывать вину, обещать невозможное или уводить внимание подрывает доверие.",
 [["miss","недобор, невыполнение плана","Существительное: разница между целью и фактом.","We had a revenue miss this quarter."],["recover","наверстать, восстановить","Вернуть то, что потеряно.","We can recover half of it next quarter."],["execution","исполнение","Насколько хорошо выполняются планы.","Execution was the problem, not the idea."]]),
 St("A board member asks: Why should we trust your plan this time?",
 "Because it's built on specific levers with leading indicators we'll track monthly, and I'll flag any deviation to you immediately, not at the end of the quarter.",
 ["Because I have experience and I've never missed twice.","Because the plan is much better than before. Please trust me.","Because we have no other choice."],
 "Доверие строится на конкретных рычагах, опережающих показателях и прозрачной отчётности об отклонениях. Ссылаться на опыт, просить веры или давить безвыходностью ситуации не убеждает.",
 [["lever","рычаг влияния","Действие, которое сильно влияет на результат.","Pricing is a lever for revenue."],["deviation","отклонение","Расхождение с планом.","Report any deviation early."],["leading indicator","опережающий показатель","Метрика, которая меняется раньше итогового результата.","Activation is a leading indicator."]])]),

C('s14','special',6,'Strategy','Sam','CEO','Email',[
 St("A larger company offers to acquire us. What does product need to think about?",
 "Product should assess what integration would mean for customers, the roadmap and the team, and what we'd lose in independence. I'd prepare a view for the board.",
 ["Product shouldn't be involved. It's a financial decision.","Accept. Larger companies offer better resources for the product.","Reject. Acquired products always lose focus."],
 "Продукт должен оценить влияние на клиентов, роадмап и команду и подготовить позицию для совета. Устраняться, соглашаться по умолчанию или отвергать из принципа значит принимать решение без анализа.",
 [["acquire","приобрести компанию","Купить компанию целиком.","A bigger company wants to acquire us."],["integration","интеграция","Объединение продуктов или команд в одно целое.","Integration usually takes about a year."],["independence","независимость","Свобода принимать решения самостоятельно.","We would lose some independence."]]),
 St("Nora: If the deal goes through, which of our products would be cut?",
 "I'd prefer to decide using clear criteria: strategic fit, customer impact and revenue. I'd share them with the board before the negotiation, not after.",
 ["The least profitable ones, immediately after the deal.","None. We should make it a condition of the deal.","Let the acquirer decide. It's not our business anymore."],
 "Нужны ясные критерии (стратегическое соответствие, влияние на клиентов, выручка), согласованные до переговоров. Закрывать по прибыльности, ставить нереалистичное условие или отдавать решение покупателю неверно.",
 [["strategic fit","стратегическое соответствие","Насколько продукт согласуется со стратегией компании.","The product has a strong strategic fit."],["condition","условие (сделки)","Требование, которое должно быть выполнено.","That is a condition of the deal."],["acquirer","покупатель компании","Компания, которая приобретает другую.","The acquirer wants full control."]])])
);


/* ---------- BASE CASES 31 to 70 ---------- */
CASES.push(
C('b31','base',0,'Delivery','Dana','Engineering Lead','Slack',[St(
 "QA found a bug the day before release. It's minor, but it affects 2% of users. Ship or fix?",
 "Let's assess the severity and whether there's a workaround. If it's truly minor, we ship on time with a known issue and fix it in the next patch.",
 ["Never ship with known bugs. Delay the release until everything is fixed.","Ship it and don't mention it. Nobody will notice a 2% issue.","Let QA decide alone, since they found it."],
 "Нужно оценить серьёзность и наличие обходного пути, затем выпустить с известной проблемой и поправить в патче. Запрет на любые баги, молчание или передача решения одному QA не учитывают баланс срока и риска.",
 [["severity","серьёзность, тяжесть","Насколько сильно проблема влияет на пользователей.","We rate every bug by severity."],["known issue","известная проблема","Дефект, о котором уже знают и который описали или отложили.","We shipped with a known issue and documented it."],["patch","патч, небольшое исправление","Быстрый выпуск, который исправляет конкретную проблему.","We will release a patch on Monday."]])]),

C('b32','base',0,'Metrics','Sam','CEO','Slack',[St(
 "Our conversion rate went from 4% to 5%. The team wants to celebrate. Is that a 25% improvement?",
 "Relative to the old rate it is a 25% increase, but the absolute change is one percentage point. Let's check the sample size and confidence interval before celebrating.",
 ["No, it's a 1% improvement, so there's nothing to celebrate.","Yes, and it will definitely stay at 5% from now on.","Percentages don't matter, only the total number of customers."],
 "Рост с 4% до 5% это +25% относительно, но +1 процентный пункт в абсолюте. Перед радостью нужно проверить выборку и доверительный интервал. Назвать это «1%» путает величины, а «навсегда» и «проценты не важны» неверно.",
 [["relative change","относительное изменение","Изменение в процентах от исходного значения.","A relative change of 25% sounds bigger than it is."],["percentage point","процентный пункт","Разница между двумя процентами: с 4% до 5% это один пункт.","Conversion rose by one percentage point."],["confidence interval","доверительный интервал","Диапазон, в котором, скорее всего, лежит истинное значение.","The confidence interval is quite wide."]])]),

C('b33','base',0,'Roadmap','Ben','Account Executive','Email',[St(
 "A client says they will sign only if we deliver an integration by June. Can you confirm?",
 "I can't confirm that yet. Let me check with engineering and come back to you by Friday with what's realistic and what the client would get by June.",
 ["Yes, confirm it. We'll find the resources somehow.","No. We never build integrations for one client.","Tell the client we'll try our best, and leave it vague."],
 "Честный ответ: пока подтвердить нельзя, но есть срок ответа и план реалистичного объёма. Обещать без оценки, отказывать категорично или отвечать расплывчато вредит доверию.",
 [["realistic","реалистичный","Такой, который можно выполнить в реальных условиях.","Is this timeline realistic?"],["come back to","вернуться с ответом к","Пообещать дать ответ позже.","I'll come back to you with an answer by Friday."],["vague","расплывчатый, неопределённый","Неточный ответ без конкретики.","Don't give a vague answer to a client."]])]),

C('b34','base',0,'Stakeholders','Nora','Chief of Staff','Slack',[St(
 "The CEO saw a feature at a competitor and wants it added right now. How do you respond?",
 "I'd thank him for the idea, ask what problem he wants to solve, and show where it would fit into our current priorities and what it would replace.",
 ["I'd add it immediately. The CEO has the final say.","I'd explain that the CEO doesn't understand product work.","I'd agree in the meeting and then quietly ignore it."],
 "Нужно поблагодарить, выяснить проблему за идеей и показать, как она вписывается в приоритеты и что придётся заменить. Слепое исполнение, обесценивание руководителя или тихий саботаж ломают доверие.",
 [["final say","последнее слово","Право принимать окончательное решение.","The CEO has the final say."],["fit into","вписываться в","Соответствовать плану, стратегии или ресурсам.","Does this idea fit into our strategy?"],["provide context","дать контекст","Объяснить обстоятельства, чтобы решение было понятно.","Let me provide context for the decision."]])]),

C('b35','base',0,'Launches','Nina','Support Lead','Slack',[St(
 "We found a critical bug two hours before launch. Marketing already sent the invites. What now?",
 "Let's assess the impact with engineering. If it breaks the core flow, we delay and communicate honestly. If not, we launch with a clear workaround and monitor closely.",
 ["Launch anyway. The invites are out and we can't disappoint people.","Cancel the launch and say nothing until the bug is fixed.","Ask marketing to decide, since they sent the invites."],
 "Сначала оценить влияние: если ломается основной сценарий, откладывать и честно сообщить, иначе запускать с обходным путём и следить. Запуск «любой ценой», молчание или передача решения маркетингу неверны.",
 [["critical bug","критический баг","Ошибка, которая ломает важнейшую функцию.","A critical bug blocked the checkout."],["core flow","основной сценарий","Главный путь пользователя в продукте.","The bug breaks the core flow."],["monitor","следить, мониторить","Наблюдать за метриками и ошибками после изменения.","We monitor errors closely after launch."]])]),

C('b36','base',0,'Discovery','Lena','UX Researcher','Slack',[St(
 "Survey results say 80% of users love the app, but usage keeps dropping. What do we trust?",
 "Behavior beats opinion. Let's look at who answered the survey, since active users are more likely to respond, and dig into the drop in usage.",
 ["The survey. Eighty percent is a clear result.","Usage data only. Surveys are always worthless.","Average the two numbers into one score."],
 "Поведение надёжнее мнений. Нужно проверить, кто ответил на опрос (активные отвечают чаще), и разобраться в падении использования. Верить только опросу, отвергать опросы или усреднять несопоставимое неверно.",
 [["respondent","респондент","Человек, который ответил на опрос.","Most respondents were active users."],["selection bias","смещение выборки","Искажение, когда отвечают только некоторые группы пользователей.","Selection bias makes the survey look better."],["dig into","разобраться, копнуть глубже","Подробно изучить причину проблемы.","Let's dig into the data."]])]),

C('b37','base',0,'Prioritization','Tom','Engineering Manager','Slack',[St(
 "Support wants a fix for a rare crash, sales wants a new report, and design wants a visual refresh. Everyone says theirs is urgent.",
 "Urgent isn't the same as important. Let's compare each request by customer impact and cost of delay, then share the reasoning with all three teams.",
 ["Do them in the order they arrived.","Pick the one from the most senior person.","Do the easiest one first so people feel heard."],
 "Срочное не равно важному: сравниваем по влиянию на клиентов и цене задержки и объясняем решение всем. Очередь, должность просителя или лёгкость не отражают ценность.",
 [["urgent","срочный","Требует немедленных действий, но не обязательно важный.","Urgent is not the same as important."],["cost of delay","цена задержки","Сколько теряем за каждую неделю, на которую откладываем.","The cost of delay is high for this fix."],["refresh","обновление, освежить","Небольшое обновление внешнего вида без смены логики.","We planned a visual refresh."]])]),

C('b38','base',0,'Negotiation','Anna','Vendor Account Manager','Email',[St(
 "Our price is final. Take it or leave it.",
 "I understand. Before I decide, could you help me understand what's included, and whether there is any flexibility on scope or payment terms that could work for both sides?",
 ["Fine, we'll take it. We don't have time to compare vendors.","Then we leave. Please remove us from your list.","Your competitor offered half. Match it or we walk away."],
 "Спокойно выяснить, что входит в цену, и поискать гибкость по объёму и условиям оплаты. Согласиться сразу, уйти или давить ультиматумом значит отказаться от переговоров.",
 [["take it or leave it","«берите или уходите»","Идиома: условие, которое не обсуждается.","They said it was take it or leave it."],["payment terms","условия оплаты","Сроки и порядок платежей по договору.","We negotiated better payment terms."],["walk away","уйти из переговоров","Отказаться от сделки, если условия не подходят.","We may have to walk away from this deal."]])]),

C('b39','base',0,'Leadership','Carlos','Engineering Manager','Slack',[St(
 "A new PM on your team asks you to make all the decisions for them because they're afraid of making mistakes.",
 "I'll support you, but I want you to make the call. Let's agree on the options and risks together, and I'll have your back if a decision doesn't work out.",
 ["I'll make the decisions for now. You'll learn by watching.","Mistakes are unacceptable here, so double-check everything.","You're hired to decide, so don't ask me anything."],
 "Хороший руководитель поддерживает, но оставляет решение за человеком и берёт на себя часть риска. Решать за него, требовать безошибочности или отстраняться мешает его росту.",
 [["have your back","поддерживать, прикрывать","Идиома: быть на стороне человека, даже если что-то пойдёт не так.","I have your back if it goes wrong."],["own the decision","взять решение на себя","Принять ответственность за результат решения.","A PM must own the decision."],["double-check","перепроверить","Проверить ещё раз, чтобы не ошибиться.","Please double-check the numbers."]])]),

C('b40','base',0,'Growth','Maya','Marketing Manager','Slack',[St(
 "Our paid ads bring many signups, but few become customers. Should we spend more to scale what works?",
 "Let's check the acquisition cost and the payback period first. Scaling spend only makes sense if the unit economics work.",
 ["Yes, more signups always lead to more customers.","Stop paid ads completely. They never work.","Spend more and fix the conversion later."],
 "Масштабировать трафик имеет смысл, только если сходится юнит-экономика: стоимость привлечения и срок окупаемости. Больше регистраций не значит больше клиентов, а отказ от рекламы или «разберёмся потом» неверны.",
 [["acquisition cost","стоимость привлечения клиента","Сколько денег уходит на привлечение одного клиента.","Our acquisition cost is too high."],["payback period","срок окупаемости","Время, за которое клиент возвращает затраты на его привлечение.","The payback period is eight months."],["unit economics","юнит-экономика","Прибыль и затраты в расчёте на одного клиента или заказ.","Unit economics decide if we can scale."]])]),

C('b41','base',0,'Design','Oleg','Product Designer','Slack',[St(
 "Usability tests show users can't find the Save button. The designer says it's obvious. Who is right?",
 "The test results are the evidence. Let's watch where users look, try a more visible placement, and retest with a few people.",
 ["The designer is the expert, so keep the design.","Five users is too few to prove anything, so ignore the test.","Make the button red and much bigger and skip retesting."],
 "Результаты теста это факт: нужно понять, куда смотрят пользователи, попробовать более заметное место и перепроверить. Доверять только эксперту, отвергать маленький тест или менять без проверки неверно.",
 [["usability test","тест юзабилити","Наблюдение за тем, как люди пользуются интерфейсом.","A usability test showed a clear problem."],["placement","размещение","Где именно на экране стоит элемент.","The placement of the button is wrong."],["retest","протестировать повторно","Проверить ещё раз после изменений.","We will retest with five new users."]])]),

C('b42','base',0,'Delivery','Dana','Engineering Lead','Slack',[St(
 "We are halfway through the sprint and the main story is blocked by another team. What do you do?",
 "Let's talk to the other team's lead today to unblock it, and in parallel prepare a fallback so we can still deliver something valuable this sprint.",
 ["Wait until the sprint review and explain what happened.","Add more developers to the story so we finish faster.","Move the whole sprint goal to next sprint immediately."],
 "Нужно сразу договариваться с другой командой и параллельно готовить запасной вариант. Ждать ревью, добавлять разработчиков в заблокированную задачу или сдаваться раньше времени не помогает.",
 [["blocked","заблокирован","Не может продвигаться из-за зависимости.","The story is blocked by another team."],["unblock","разблокировать","Устранить причину, которая мешает работе.","I'll talk to them to unblock us."],["in parallel","параллельно","Одновременно с другой работой.","We'll prepare a fallback in parallel."]])]),

C('b43','base',0,'Metrics','Priya','Data Analyst','Slack',[St(
 "Weekly active users are up 10% but revenue is flat. Is the product healthy?",
 "Not necessarily. Let's check whether the new users are on the free plan and whether they use the features that drive revenue.",
 ["Yes, more users always means a healthier product.","No, revenue is the only thing that matters.","It's a temporary issue. Revenue will catch up."],
 "Рост пользователей без роста выручки может означать, что они не монетизируются. Нужно проверить тариф и использование функций. Универсальные суждения и надежда на «само догонит» не заменяют анализ.",
 [["monetize","монетизировать","Превратить пользователей в источник дохода.","We still need to monetize these users."],["feature usage","использование функций","Какие функции и как часто используют.","Feature usage shows what drives revenue."],["catch up","догнать","Сравняться с тем, что уже выросло.","Revenue won't catch up on its own."]])]),

C('b44','base',0,'Stakeholders','Mark','Head of Sales','Slack',[St(
 "Support complains that every new feature creates more tickets. Sales complains that we ship too slowly. How do you balance them?",
 "Both are signals about the same system. Let's agree on a quality bar for releases and track ticket volume per feature, so speed and quality are discussed with data.",
 ["Slow down and fix every ticket before building anything new.","Ignore support, since sales brings the money.","Hire more support agents and keep shipping at the same speed."],
 "Обе жалобы это сигналы об одной системе: нужна общая планка качества и данные по обращениям на каждую фичу. Замедляться, игнорировать поддержку или просто нанять людей не решает противоречие.",
 [["ticket volume","объём обращений","Сколько обращений приходит в поддержку.","Ticket volume doubled after the release."],["quality bar","планка качества","Минимальный уровень качества, при котором можно выпускать.","We raised the quality bar for releases."],["balance","балансировать","Находить разумное соотношение между противоположными целями.","We need to balance speed and quality."]])]),

C('b45','base',0,'Strategy','Nora','Chief of Staff','Email',[St(
 "A competitor cut their price by 30%. The CEO asks if we should match it.",
 "Not automatically. Let's see how many of our customers are price-sensitive, where they would go, and whether we can compete on value instead.",
 ["Yes, match it immediately. Otherwise we'll lose every customer.","No, our product is better, so price doesn't matter.","Cut our price by 40% to win the market."],
 "Нужно понять, какая часть клиентов чувствительна к цене и можно ли конкурировать ценностью. Мгновенное копирование, игнорирование цены или ещё большее снижение ведут к ценовой войне.",
 [["price-sensitive","чувствительный к цене","О клиенте, для которого цена решает при выборе.","Small businesses are price-sensitive."],["price war","ценовая война","Соревнование компаний в снижении цен.","A price war hurts everyone."],["match the price","приравнять цену к конкуренту","Снизить цену до уровня конкурента.","We won't match the price automatically."]])]),

C('b46','base',0,'Hiring','Carlos','Engineering Manager','Slack',[St(
 "How should we assess a PM candidate's product sense in an interview?",
 "Give a realistic case related to our product and look at how they clarify the problem, structure their thinking and weigh trade-offs, not just their final answer.",
 ["Ask them to list the features of our competitors.","Check how many famous products are on their resume.","Ask abstract brain teasers and see who answers fastest."],
 "Продуктовое чутьё проявляется в том, как человек уточняет задачу, структурирует мышление и взвешивает компромиссы на реалистичном кейсе. Перечисление функций, громкие бренды или загадки этого не показывают.",
 [["product sense","продуктовое чутьё","Умение понимать пользователей и принимать хорошие продуктовые решения.","She has strong product sense."],["clarify","уточнять","Задавать вопросы, чтобы понять задачу точнее.","Good candidates clarify the problem first."],["weigh","взвешивать (варианты)","Сравнивать плюсы и минусы перед решением.","Weigh the pros and cons."]])]),

C('b47','base',0,'Pricing','Priya','Data Analyst','Slack',[St(
 "Should we offer an annual plan with a discount?",
 "Probably yes. Annual plans improve cash flow and reduce churn, but let's check that the discount doesn't cannibalize monthly revenue more than it brings in.",
 ["No. Discounts always hurt revenue.","Yes, offer 50% off to get everyone to switch.","Offer it only to customers who already plan to leave."],
 "Годовой тариф улучшает денежный поток и удержание, но нужно проверить, не съедает ли скидка больше выручки, чем приносит. «Скидки всегда вредны», 50% или скидка уходящим не опираются на расчёт.",
 [["annual plan","годовой тариф","Подписка с оплатой на год вперёд.","The annual plan has a 15% discount."],["cash flow","денежный поток","Движение денег в компанию и из неё.","Annual plans improve cash flow."],["cannibalize","каннибализировать","Забирать доход у собственного другого продукта или тарифа.","Discounts can cannibalize monthly revenue."]])]),

C('b48','base',0,'Experiments','Priya','Data Analyst','Slack',[St(
 "We ran a test for two days. Variant B is winning by a lot. Can we stop?",
 "Not yet. Two days may miss weekly patterns, so let's run it for at least a full cycle and wait for the planned sample size.",
 ["Yes, a big difference means the result is certain.","Yes, stop and roll it out to keep the momentum.","Extend it for three months to be absolutely sure."],
 "Два дня могут не захватить недельные колебания, поэтому тест нужно довести до полного цикла и запланированной выборки. Остановка из-за большой разницы или бесконечное продление одинаково неверны.",
 [["seasonality","сезонность","Повторяющиеся колебания по дням недели или временам года.","Seasonality can distort a short test."],["momentum","импульс, инерция","Ощущение, что дело движется вперёд.","We don't want to lose momentum."],["full cycle","полный цикл","Период, который охватывает все повторяющиеся колебания.","Run the test for a full cycle."]])]),

C('b49','base',0,'Discovery','Lena','UX Researcher','Slack',[St(
 "A customer says: 'I'd love a feature that does everything automatically.' What do you do?",
 "I'd ask them to walk me through the last time they did this task manually. The details of the steps will show what is really worth automating.",
 ["Add 'automation' to the roadmap as a top priority.","Explain that automation is too hard to build.","Ask them how much they would pay for it."],
 "Абстрактную просьбу нужно превратить в конкретную историю: как человек делал задачу вручную в последний раз. Добавлять в роадмап, отказывать или сразу спрашивать цену значит не понимать потребность.",
 [["walk me through","проведи меня по шагам","Просьба рассказать процесс подробно, шаг за шагом.","Walk me through your last order."],["manually","вручную","Без автоматизации.","They update the report manually."],["automate","автоматизировать","Сделать так, чтобы система делала работу сама.","We can automate the weekly report."]])]),

C('b50','base',0,'Communication','Dana','Engineering Lead','Slack',[St(
 "I think your decision is wrong. Why did you choose feature A over our technical fix?",
 "That's a fair question. Here is how I weighed it: feature A affects 30% of users, and the fix has no customer impact yet. If you have data I'm missing, I'm open to feedback and I may change my mind.",
 ["Because I'm the product manager, and that's the decision.","I'm sorry, you're right. We'll do your fix first.","Let's not discuss it. The decision is made."],
 "Нужно объяснить логику и быть открытым к данным, которых не хватает. Ссылаться на должность, мгновенно уступать или закрывать обсуждение разрушает доверие.",
 [["fair question","резонный вопрос","Вопрос, на который разумно ответить.","That's a fair question."],["change my mind","передумать","Изменить свою позицию.","Show me data and I'll change my mind."],["open to feedback","открыт к обратной связи","Готов выслушать замечания.","I'm open to feedback on this decision."]])]),

C('b51','base',0,'Launches','Nina','Support Lead','Slack',[St(
 "Should we do a big-bang launch or a soft launch?",
 "A soft launch lets us test with a small group and fix problems quietly. A big-bang launch makes sense only when timing or marketing coordination really matters.",
 ["Always big-bang. It gets the most attention.","Always soft. Big launches are a waste of money.","Whichever the marketing team prefers."],
 "Мягкий запуск снижает риск, а массовый оправдан, когда важны время и согласованность маркетинга. Универсальные «всегда» и выбор по предпочтению одной команды не учитывают контекст.",
 [["soft launch","мягкий запуск","Запуск для небольшой группы без большого анонса.","We did a soft launch in one country."],["big-bang launch","массовый запуск «большим взрывом»","Запуск сразу для всех с большим анонсом.","A big-bang launch needs careful planning."],["coordination","согласованность действий","Совместная работа нескольких команд над общей задачей.","Launches need good coordination."]])]),

C('b52','base',0,'Data','Priya','Data Analyst','Slack',[St(
 "The dashboard shows a sudden spike in signups. Do we celebrate?",
 "Let's verify the data first. A sudden spike can come from bots, a tracking bug or a duplicate event, so we check the source before sharing the news.",
 ["Yes, share it with the whole company right away.","No, spikes are always bugs.","Wait a month and see if it continues."],
 "Резкий всплеск часто объясняется ботами, ошибкой трекинга или дублями, поэтому сначала проверяем источник. Праздновать сразу, считать любой всплеск ошибкой или ждать месяц неверно.",
 [["spike","резкий всплеск","Внезапный рост показателя на графике.","We saw a spike in signups."],["tracking","отслеживание событий","Сбор данных о действиях пользователей.","A tracking bug can inflate numbers."],["duplicate","дубликат","Одно и то же событие, записанное дважды.","Each event was sent as a duplicate."]])]),

C('b53','base',0,'Roadmap','Ben','Account Executive','Slack',[St(
 "Our biggest competitor just announced something similar to our flagship feature. Customers ask what makes us different.",
 "Let's be clear about what we do better for our customers, share it honestly, and show how we plan to keep improving on the roadmap.",
 ["Say their feature is worse, without comparing anything.","Promise a better feature next month.","Tell customers to ask the competitor."],
 "Нужно честно назвать, в чём мы лучше для клиентов, и показать планы развития. Необоснованные заявления, обещания сроков или перекладывание вопроса не создают доверия.",
 [["flagship feature","ключевая функция продукта","Самая важная и заметная функция продукта.","Search is our flagship feature."],["differentiator","отличительное преимущество","То, что отличает вас от конкурентов.","Speed is our main differentiator."],["claim","утверждение, заявление","То, что вы говорите о продукте.","Avoid claims you can't prove."]])]),

C('b54','base',0,'Delivery','Ira','Tech Lead','Slack',[St(
 "Our estimates are always wrong. Should we stop estimating?",
 "Estimates are rough, but they help planning. Let's look at why they're off, for example hidden dependencies, and use ranges rather than exact numbers.",
 ["Yes, estimating wastes time. Let's just work as fast as possible.","Add 100% buffer to every estimate.","Hold engineers responsible for every miss."],
 "Оценки нужны для планирования: изучаем причины ошибок и используем диапазоны вместо точных чисел. Отказ от оценок, двойной запас или наказание инженеров не улучшают планирование.",
 [["ballpark","приблизительная оценка","Грубая оценка порядка величины.","Give me a ballpark estimate."],["buffer","запас","Дополнительное время или ресурс на непредвиденное.","Add a small buffer for risks."],["range","диапазон","Оценка в виде «от и до», а не одного числа.","Use a range instead of one number."]])]),

C('b55','base',0,'Stakeholders','Alex','Chief Marketing Officer','Slack',[St(
 "Marketing wants to announce a feature that's still in beta. Can we?",
 "We can, but let's agree on how we describe it as a beta, what limitations users should know, and how we'll handle feedback, so we don't over-promise.",
 ["No. Marketing shouldn't talk about anything in beta.","Yes. Call it fully released to build excitement.","Yes, but don't tell support."],
 "Анонс возможен, если честно назвать его бетой, описать ограничения и подготовить обратную связь. Запрещать, выдавать бету за релиз или скрывать от поддержки создаёт ложные ожидания.",
 [["beta","бета-версия","Версия, которую ещё тестируют на пользователях.","The feature is still in beta."],["over-promise","обещать слишком много","Давать обещания, которые трудно выполнить.","Don't over-promise to customers."],["limitation","ограничение","То, что продукт пока не умеет или не позволяет.","Mention every limitation in the announcement."]])]),

C('b56','base',0,'Strategy','Sam','CEO','Slack',[St(
 "Why should we say no to this partnership? It could bring us lots of users.",
 "Users alone aren't the goal. Let's check whether these are our target customers, what the partner would get in return, and what it would cost to support.",

C('b57','base',0,'Metrics','Sam','CEO','Email',[St(
 "Should we measure success by the number of features shipped per quarter?",
 "No. Features shipped measures output. We should measure outcomes such as adoption, retention and customer satisfaction.",
 ["Yes. It's easy to measure and shows team productivity.","Yes, but only for engineers.","No. We shouldn't measure success at all."],
 "Количество фич это выпуск, а не результат: измеряем принятие, удержание и удовлетворённость. Такую метрику легко накрутить, а отказ от измерений лишает ориентира.",
 [["customer satisfaction","удовлетворённость клиентов","Насколько клиенты довольны продуктом.","Customer satisfaction improved this quarter."],["productivity","продуктивность","Сколько ценного делает команда за время.","Productivity is not the same as busyness."],["game the metric","манипулировать показателем","Подгонять действия, чтобы цифра выглядела лучше, не улучшая суть.","People can game the metric easily."]])]),

C('b58','base',0,'Negotiation','Mark','Head of Sales','Email',[St(

 ["Give 20%. We can't lose them.","Refuse. Never discount renewals.","Offer 5% and say it's final."],

C('b59','base',0,'Leadership','Carlos','Engineering Manager','Slack',[St(
 "Our best engineer announced she's leaving. What should we do first?",
 "Talk to her privately to understand why, and see if anything can change. In parallel, plan knowledge transfer and cover the gap.",
 ["Offer her a big raise immediately.","Start looking for a replacement without telling the team.","Ask her to leave right away to avoid distraction."],
 "Сначала личный разговор, чтобы понять причину и возможность удержать, и параллельно передача знаний. Мгновенная прибавка, тайный поиск замены или немедленное увольнение не решают проблему.",
 [["knowledge transfer","передача знаний","Процесс, когда уходящий сотрудник передаёт опыт команде.","We started knowledge transfer this week."],["retain","удержать (сотрудника или клиента)","Сделать так, чтобы человек остался.","We want to retain our best people."],["gap","пробел, нехватка","Недостаток навыков, людей или данных.","We need to cover the gap quickly."]])]),

C('b60','base',0,'Discovery','Lena','UX Researcher','Slack',[St(
 "Users complain about too many notifications, but they never turn them off in settings. Why?",
 "Let's find out. Maybe the setting is hard to find, or some notifications are useful. Interviews and a look at the settings flow will show where the friction is.",
 ["Users are lying. Ignore the survey.","Remove all notifications immediately.","Add a pop-up asking users to turn them off."],
 "Нужно выяснить причину: настройку сложно найти или часть уведомлений полезна. Интервью и анализ пути в настройках покажут, где трение. Считать пользователей лжецами, убрать всё или добавить окно не решает вопрос.",
 [["notification","уведомление","Сообщение, которое продукт присылает пользователю.","Too many notifications annoy users."],["default setting","настройка по умолчанию","Значение, которое включено, пока пользователь его не изменит.","Most users keep the default setting."],["friction","трение, лишние сложности","Всё, что мешает пользователю выполнить действие.","Reduce friction in the settings."]])]),

C('b61','base',0,'Prioritization','Tom','Engineering Manager','Slack',[St(
 "A quick win takes two days and gives a small boost. A big project takes three months and could double growth. How do we decide?",
 "We don't have to choose only one. Let's do the quick win now, and for the big bet reduce the risk with a small test and a clear go or no-go decision.",
 ["Always choose quick wins. They're safe.","Always choose the big project. Go big or go home.","Choose randomly, since nobody can predict the future."],
 "Можно сделать быструю победу сейчас, а крупную ставку снижать малым тестом и точкой «делаем или нет». Выбор по принципу «всегда» или случайный выбор отказываются от анализа риска.",
 [["big bet","крупная ставка","Большой проект с высоким риском и высокой наградой.","This is a big bet for the year."],["go or no-go","решение «делаем или нет»","Точка, где решают продолжать проект или остановить его.","We set a go or no-go checkpoint."],["boost","прирост, подъём","Небольшое улучшение показателя.","The change gave a small boost."]])]),

C('b62','base',0,'Launches','Nina','Support Lead','Email',[St(
 "Post-launch, adoption is lower than planned. Management wants to know if the launch failed.",
 "It's too early to call it a failure. Let's compare against the targets we set, find where users drop off, and share a recovery plan with dates.",
 ["Yes, it failed. We should stop investing in it.","No, it's fine. The target was just too high.","Blame marketing for weak promotion."],
 "Сравниваем с поставленными целями, находим, где теряются пользователи, и показываем план восстановления с датами. Объявлять провал, оправдываться завышенной целью или искать виноватого неконструктивно.",
 [["post-launch","после запуска","Период после выпуска продукта.","Post-launch adoption is lower than planned."],["recovery plan","план восстановления","Шаги, которые вернут показатели к цели.","Share a recovery plan with dates."],["too early to call","рано делать выводы","Идиома: данных ещё недостаточно для окончательного решения.","It's too early to call a winner."]])]),

C('b63','base',0,'Communication','Sam','CEO','Slack',[St(
 "Can you explain our product strategy in one minute?",
 "Yes. We help small teams plan work faster. This year we focus on onboarding and integrations, because that's where we lose most users, and we'll measure success by activation.",
 ["Our strategy is to build the best product in the world.","I'd need an hour to explain it properly.","We do whatever customers ask us to do."],
 "Хороший ответ краток, конкретен: кому помогаем, на чём фокус и по какой метрике судим. Общие слова, просьба об часе или «делаем всё, что просят» не являются стратегией.",
 [["elevator pitch","короткая презентация идеи","Объяснение, которое можно уложить в одну минуту.","Practice your elevator pitch."],["concise","краткий и ясный","Без лишних слов.","Keep your answer concise."],["focus on","сосредоточиться на","Направить усилия на что-то одно.","This year we focus on onboarding."]])]),

C('b64','base',0,'Delivery','Ira','Tech Lead','Slack',[St(
 "We have a tight deadline. Should we skip code review to save time?",
 "No. Skipping review often costs more later in bugs. Let's cut scope or simplify the solution instead, and keep review quick and focused.",
 ["Yes, speed matters most this time.","Yes, but only for small changes.","No, and push the deadline by a month without discussion."],
 "Пропуск ревью обычно дороже из-за багов, лучше сократить объём или упростить решение. Пропускать проверку или молча сдвигать срок на месяц неверно.",

C('b65','base',0,'Stakeholders','Oleg','Product Designer','Slack',[St(
 "The VP rejected our design in the review with no explanation.",
 "Let's ask the VP for a short follow-up to understand the concerns behind the decision, and bring a few options with trade-offs next time.",
 ["We'll redo the design from scratch.","We'll escalate to the CEO to overrule the VP.","We'll keep the design and push it through anyway."],
 "Нужен короткий разговор, чтобы понять причины отказа, и несколько вариантов с компромиссами. Переделывать с нуля вслепую, обходить руководителя или продавливать свой вариант вредно.",
 [["overrule","отменить решение, отвергнуть","Использовать власть, чтобы отменить чужое решение.","The CEO can overrule the VP."],["from scratch","с нуля","Начать заново, не используя прежнее.","We rebuilt it from scratch."],["push through","продавить","Добиться принятия решения давлением.","Don't push through a decision."]])]),

C('b66','base',0,'Strategy','Nora','Chief of Staff','Email',[St(
 "Should we build or buy this capability?",
 "Let's compare total cost, time to market and how core the capability is to our product. If it's not a differentiator, buying or partnering is usually faster.",
 ["Always build. We should own everything.","Always buy. Building is too risky.","Build it, because engineers want to."],
 "Решение зависит от полной стоимости, срока выхода на рынок и того, насколько функция важна для продукта. Универсальные правила и желание инженеров не заменяют анализ.",
 [["build or buy","строить самим или покупать","Решение: разрабатывать функцию самим или купить готовое.","Every team faces a build or buy question."],["time to market","время выхода на рынок","Сколько времени нужно, чтобы выпустить продукт.","Buying shortens the time to market."],["capability","возможность, компетенция","Что компания умеет делать.","This capability is not our core."]])]),

C('b67','base',0,'Experiments','Priya','Data Analyst','Slack',[St(
 "We want to test a new homepage, a new price and a new onboarding at the same time. Is that OK?",
 "I'd avoid it. With three changes at once we can't isolate the effect of each. Let's test one at a time, or plan a proper multivariate test with enough traffic.",
 ["Yes, it saves time. We'll compare the final numbers.","Yes, but only look at revenue.","No, never run more than one test per year."],
 "Три изменения сразу не позволяют понять, что дало эффект. Тестируем по одному или планируем корректный многовариантный тест с достаточным трафиком. Сравнивать итоговые цифры или запрещать тесты неверно.",
 [["multivariate test","многовариантный тест","Тест, в котором одновременно меняют несколько элементов и анализируют их сочетания.","A multivariate test needs a lot of traffic."],["isolate the effect","изолировать эффект","Понять, какое именно изменение дало результат.","We need to isolate the effect of each change."],["variable","переменная, изменяемый фактор","То, что меняется в эксперименте.","Change one variable at a time."]])]),

C('b68','base',0,'Data','Priya','Data Analyst','Slack',[St(
 "Two dashboards show different numbers for the same metric. Which one is right?",
 "Let's find out how each one defines and calculates the metric. Often the discrepancy comes from different definitions or time zones, and we should agree on one source of truth.",
 ["The one with the higher number.","The newer one. Newer is always better.","Use the average of the two."],
 "Нужно сравнить, как каждый дашборд определяет и считает метрику (часто дело в определениях или часовых поясах), и договориться об едином источнике истины. Выбор по величине, новизне или среднее не решают причину.",
 [["source of truth","единый источник истины","Одно место, данным которого все доверяют.","We need a single source of truth."],["definition","определение метрики","Точное правило расчёта показателя.","Each metric needs a clear definition."],["discrepancy","расхождение","Различие между двумя значениями, которые должны совпадать.","We found a discrepancy in the numbers."]])]),

C('b69','base',0,'Leadership','Carlos','Engineering Manager','Slack',[St(
 "How do you give negative feedback to someone more senior than you?",
 "Be specific and respectful: describe what I observed, its impact on the team, and ask for their view. I'd offer constructive feedback privately and focus on the work, not the person.",
 ["Wait for a formal review and say nothing until then.","Send it to the whole team to show transparency.","Avoid it completely. Seniors know best."],
 "Нужна конкретика и уважение: что наблюдал, как это влияет на команду, и вопрос о их мнении, наедине и о работе, а не о личности. Молчать, обсуждать при всех или избегать темы неэффективно.",
 [["constructive feedback","конструктивная обратная связь","Замечания, которые помогают улучшить работу.","Constructive feedback is specific and kind."],["privately","наедине","Без других людей.","Give difficult feedback privately."],["specific","конкретный","С точными примерами.","Be specific about what you saw."]])]),

C('b70','base',0,'Pricing','Priya','Data Analyst','Email',[St(

/* ================= SCENARIOS: multi-step cases with consequences ================= */
function SC(id,topic,name,role,ch,meters,endings,steps){
  return {id:id,type:'special',scn:true,level:0,topic:topic,sender:{name:name,role:role,channel:ch},meters:meters,endings:endings,steps:steps};
}
function SS(msg,alt,opts,explain,words){
  var max=0;opts.forEach(function(o){if(o[1]>max)max=o[1];});
  return {msg:msg,alt:alt||null,
    options:opts.map(function(o){return {t:o[0],p:o[1],ok:o[1]===max,e:o[2],r:o[3]};}),
    explain:explain,
    words:words.map(function(a){return {w:a[0],ru:a[1],how:a[2],ex:a[3]};})};
}
