 ["Raise fees only for premium customers, and leave the basic plan unchanged, without adding benefits.","Защищает базовых клиентов, но премиум платит без ценности.","Premium customers feel they pay more for nothing, and some start comparing alternatives."],
 ["Ignore the competitor's zero fees, since customers do not switch banks easily.","Недооценивает риск ухода клиентов.","A few customers leave, and the competitor's ads reach more people than you expected."],
 ["Match the competitor with zero fees on the basic plan, and try to recover revenue from premium services.","Смелый шаг, но выручка под вопросом.","Customers are happy, but the revenue target is far away, and finance is worried."]],
 [["cashback","кэшбэк","Возврат части потраченных денег клиенту.","Cashback makes the fee easier to accept."],["value for money","соотношение цены и пользы","Ощущение, что цена оправдана.","Customers want value for money."]]],
["Leadership still wants a revenue boost this quarter. You can present a plan, but the CEO will decide in a single meeting.",null,[
 ["Present three options with revenue, risk and customer impact, recommend a phased increase with benefits, and show how you will measure each stage.","Даёт варианты, рекомендацию и способ измерения.","The CEO chooses your recommended plan and sets clear checkpoints for the next quarter."],
 ["Present one option only, the 20% increase, with a warning about the risks.","Выбора для руководства нет, риски остаются на бумаге.","The CEO approves the 20% increase, since there was no alternative."],
 ["Say that the revenue target should be lowered because customers cannot pay more.","Отказывается решать задачу, предлагая снизить цель.","The CEO feels you are not helping with the target, and the meeting becomes tense."],
 ["Present two options with revenue numbers and mention customer risks briefly.","Хорошо, но риски для клиентов раскрыты слабо.","The CEO picks the higher-revenue option, and the customer risk is underestimated."]],
 [["phased increase","поэтапное повышение","Рост цены частями, а не сразу.","A phased increase is safer."],["checkpoint","контрольная точка","Момент, когда проверяют результаты и решают дальше.","We set a checkpoint after one month."]]],
["The first stage goes live. Support reports a spike in questions about the new fee, and a news site writes a short critical article.",null,[
 ["Publish a clear explanation on the website and in the app, train support with simple answers, and reply to the article with facts and the benefits you added.","Прозрачное объяснение и готовая поддержка.","Complaints peak and fall within a week, and the article is forgotten."],
 ["Say nothing publicly and wait for the interest to fade.","Тишина оставляет место чужим версиям.","Customers fill the silence with worse stories, and support is overwhelmed."],
 ["Reverse the fee increase immediately to stop the criticism.","Резкий откат подрывает доверие к решениям банка.","Critics are quiet for a day, but leadership loses faith in the plan, and revenue falls short."],
 ["Ask support to answer questions one by one, and prepare a longer explanation next week.","Работает, но поздно и разрозненно.","Some customers get answers, but the story spreads while the explanation is not ready."]],
 [["spike","резкий скачок","Внезапный рост показателя.","There was a spike in support calls."],["reverse","отменить, развернуть","Вернуть решение назад.","The bank had to reverse the change."]]],
["Two months later, fee revenue is up 9% and closed accounts are slightly above normal. The CEO asks whether to continue to the second stage next month.",null,[
 ["Check retention by customer group first, then continue only for groups that stayed stable, and keep the benefits visible.","Решение принимается на данных об удержании.","The second stage works for stable groups, retention holds, and trust is not damaged."],
 ["Continue to the second stage for everyone, since revenue is already moving in the right direction.","Рост выручки не гарантирует, что клиенты остаются.","Revenue grows a bit more, but some groups quietly leave, and the damage shows up later."],
 ["Push the full 20% increase now, since the first stage showed that customers accept change.","Спешка превращает контролируемый тест в риск.","A bigger wave of customers closes accounts, and the news returns with a bigger story."],
 ["Pause for one quarter to watch retention, and decide later.","Осторожно, но теряет темп и выручку.","Retention looks fine, but customers feel the bank is indecisive, and the revenue goal moves further away."]],
 [["churn","отток клиентов","Доля клиентов, которые уходят за период.","Churn rose slightly after the change."],["rollout plan","план запуска","Пошаговый план внедрения изменения.","We need a rollout plan for stage two."]]]
]);

/* ---- Chapter 7 boss: customer data exposure (CPO) ---- */
BS('sc10',['Hannah','Head of Compliance','Email'],['Customer trust','Compliance','Team focus'],
{good:"Customers and regulators see a bank that acts quickly and honestly. Trust recovers, and the new process makes releases safer for everyone.",
 mid:"The incident is handled, but a few weak spots in communication or process remain. The regulator is watching closely.",
 bad:"The incident becomes a story about secrecy. Customers leave, the regulator opens a formal review, and the team spends months on damage control."},
[
["Hannah: 'A release bug showed the names and partial account numbers of about 2,300 customers to other customers for six hours. The bug is fixed now. What do you do first?'",null,[
 ["Form an incident team with compliance, security and support, confirm exactly who was affected, and prepare the notifications to the regulator and to affected customers.","Устанавливает факты и готовит обязательные уведомления.","Facts are clear within hours, and the bank notifies the regulator and customers on time."],
 ["Wait a few days to collect more details before telling anyone, so the report is complete.","Ожидание рискует нарушить сроки уведомления.","The notification deadline gets closer, and an employee leaks the story before the bank speaks."],
 ["Keep it internal because the bug is fixed and the data was only partial.","Сокрытие инцидента хуже, когда он всплывёт.","A customer posts a screenshot, and the bank looks like it tried to hide the incident."],
 ["Notify affected customers quickly with a short message, and prepare the regulator report afterwards.","Быстро, но регулятор должен узнать вовремя.","Customers appreciate the speed, but the regulator asks why it learned about the incident later."]],
 [["notification","уведомление","Официальное сообщение о событии.","The bank sent a notification to affected customers."],["regulator","регулятор","Орган, который контролирует банки и их правила.","The regulator must be informed in time."]]],
["Support is flooded with calls. The CEO wants a public statement by tomorrow. Hannah says the message must be accurate and cannot promise things the bank cannot guarantee.","A rumor has already started online. Support is flooded with calls, and the CEO wants a public statement by tomorrow. Hannah says the message must be accurate and cannot promise things the bank cannot guarantee.",[
 ["Publish a clear, honest statement: what happened, which data was visible, what the bank did, and what customers should do. Prepare simple scripts for support.","Ясно, честно и практично для клиентов и поддержки.","Customers see the facts and the next steps, and the number of calls starts to fall."],
 ["Publish a short statement that says there was a technical issue and the bank is investigating.","Слишком общо: клиенты хотят знать, что с их данными.","The statement raises more questions than it answers, and the calls continue."],
 ["Promise that no customer will suffer any loss and that this will never happen again.","Обещания, которые банк не может гарантировать, опасны.","A later fraud attempt appears, and the promise is quoted back to the bank."],
 ["Send the statement only to affected customers by email, and leave the public website without news.","Правильно для затронутых, но остальные узнают из слухов.","Affected customers are informed, but others hear rumors and lose trust."]],
 [["statement","официальное заявление","Публичное сообщение компании о событии.","The bank published a statement."],["accurate","точный","Без ошибок и преувеличений.","The message must be accurate."]]],
["The root cause: a new caching feature skipped a permissions check, and the privacy review for that release was cut to save time. Hannah asks what will change in the release process.",null,[
 ["Make privacy review a required gate for any release that touches customer data, add automated permission tests, and set clear owners.","Меняет процесс, а не только чинит ошибку.","The next releases are slightly slower, but they are safer, and the regulator notes your corrective steps."],
 ["Add a reminder to the release checklist and ask engineers to be more careful.","Напоминание без проверок не защищает.","The reminder is forgotten within a month."],
 ["Remove the person who approved the release from the team, and consider the matter closed.","Наказание не исправляет процесс.","The team becomes afraid of mistakes, and the process stays as weak as before."],
 ["Add automated permission tests only, and keep privacy review optional for urgent releases.","Хорошо, но исключение для срочных релизов оставляет дыру.","Tests catch many problems, but the next urgent release skips review again."]],
 [["gate","обязательный этап проверки","Шаг, без которого релиз не может идти дальше.","Privacy review is now a gate."],["permission check","проверка прав доступа","Проверка того, кому разрешено видеть данные.","The release skipped a permission check."]]],
["Hannah asks you to present the incident to the board: what happened, what it cost, and how the bank will prevent it. The board is worried and wants clear answers.",null,[
 ["Present facts and numbers, own the mistake, show the corrective plan with owners and dates, and propose a quarterly privacy audit.","Честность, конкретные меры и ответственные.","The board approves the plan and the extra budget, and respects the way you handled it."],
 ["Present the incident briefly and say it was a one-time problem that is unlikely to repeat.","Недооценка риска без плана выглядит безответственно.","The board asks hard questions you cannot answer, and trust in the plan drops."],
 ["Blame a vendor library and say the bank had no part in the bug.","Перекладывание вины вскроется при проверке.","Regulators find the real cause quickly, and the board sees the bank as unreliable."],
 ["Present the plan without numbers, and promise to share the details in the next report.","План есть, но без цифр совет не оценит риск.","The board accepts the plan for now, but asks for the missing numbers within a week."]],
 [["corrective action","корректирующее действие","Шаг, который исправляет причину проблемы.","We listed corrective actions with owners."],["audit","аудит, проверка","Систематическая проверка процессов или данных.","A quarterly audit will catch gaps."]]]
]);

/* ---- Bonus big cases ---- */
BS('sc01',['Sam','CEO','Slack'],['Customer trust','Team morale','Revenue'],
{good:"The outage becomes a story about how the bank handles problems: quickly, honestly and with real fixes. Customers stay, and the team trusts you.",
 mid:"Payments are restored and most customers stay, but a few weak spots in communication and process remain.",
 bad:"The outage hurts far more than it had to. Customers remember the silence, and the team fears the next failure."},
[
["Sam: 'Card payments have been failing for 40 minutes, and customers are complaining online. What is your first move?'",null,[
 ["Form a small incident team, name one incident owner, and post a short update on the status page saying we are investigating.","Организует работу, назначает ответственного и честно сообщает клиентам.","The team organizes within minutes. Customers see an honest update and the angry posts slow down."],
 ["Join the engineers' channel and ask for an update every five minutes, so you can brief Sam.","Частые вопросы замедляют инженеров, клиенты без новостей.","Engineers feel watched and slow down, and customers hear nothing while you wait."],
 ["Tell customers it is a minor delay and fix it quietly, so nobody panics about their money.","Преуменьшение быстро раскрывается и разрушает доверие.","A reporter finds that thousands of payments failed. The 'minor delay' message is shared as an example of poor honesty."],
 ["Post an apology on social media right away, and ask engineering for an estimate afterwards.","Быстро, но без ответственного и статуса вопросов только больше.","Customers appreciate the quick apology, but without an owner or a status page the posts keep coming."]],
 [["incident owner","ответственный за инцидент","Один человек, который координирует работу над сбоем.","Assign one incident owner right away."],["status page","страница статуса","Публичная страница, где компания сообщает о сбоях.","We posted an update on the status page."]]],
["Engineers find the cause: a failed update to the card processing service. They can roll back in 10 minutes, or push a fix they believe works but have not tested.","The silence made things worse, and customers are angrier online. Engineers find the cause: a failed update to the card processing service. They can roll back in 10 minutes, or push a fix they believe works but have not tested.",[
 ["Roll back now, then investigate the root cause calmly once card payments work again.","Останавливает потери сразу, причину ищет без спешки.","Card payments recover in ten minutes, and the team investigates without pressure."],
 ["Push the untested fix to half of the customers while the team tests it, and decide on a full rollout later.","Усложняет ситуацию и затягивает решение.","Half of the customers still fail, and engineers juggle two versions at the same time."],
 ["Push the untested fix to everyone right now, since it is faster than a rollback.","Непроверенный фикс на платежах может сделать хуже.","The fix breaks balance updates, and payments fail for a second hour while the team panics."],
 ["Roll back, but tell customers nothing until the root cause is fully known.","Откат верный, но молчание дорого стоит.","Payments recover, but customers learn about the problem from social media, and revenue dips during the silence."]],
 [["rollback","откат","Возврат к предыдущей версии.","We did a rollback within ten minutes."],["root cause","первопричина","Настоящая причина проблемы, а не симптом.","We still don't know the root cause."]]],
["Payments work again. Customers want to know what happened, and engineers are exhausted after a long night.","Payments work again, but customers are still angry about the silence. They want to know what happened, and engineers are exhausted after a long night.",[
 ["Send a customer update with a simple timeline, thank the engineers publicly, and give the night team a day off.","Честно объясняет и ценит команду.","Customers get clear facts, and the engineers feel their work was seen."],
 ["Ask the engineers to stay and write a full report right away while everything is fresh.","Усталые люди пишут плохо, а мораль падает.","The report is full of mistakes, and the team feels that nobody cares about their rest."],
 ["Send nothing, since payments work again and the story will pass.","Тишина после сбоя оставляет вопросы без ответа.","Customers keep asking, and the story lives longer than it should."],
 ["Send a customer update, but do not mention the engineers or give them time to rest.","Клиенты в курсе, но команда не отдыхает.","Customers are informed, but the engineers feel invisible."]],
 [["timeline","хронология","Что и когда происходило.","The update included a timeline."],["customer update","сообщение клиентам","Короткое сообщение о том, что произошло и что дальше.","We sent a customer update at noon."]]],
["Three days later, Sam asks how to prevent another outage. Engineers want to improve monitoring, and finance wants cheaper hosting.",null,[
 ["Run a blameless post-mortem, add monitoring and a safer release process, and agree on owners and dates.","Находит причины, а не виноватых, и делает конкретные шаги.","The team finds three clear causes, fixes them, and learns without fear."],
 ["Invest in a full second data center this quarter to be safe.","Дорого и избыточно для найденных причин.","The cost is huge, and the real causes in the release process remain untouched."],
 ["Keep the same setup, and move to cheaper hosting to save money.","Экономия повышает риск нового сбоя.","Costs fall, and the next outage arrives sooner than expected."],
 ["Add monitoring only, and review the release process later.","Хорошо, но процесс релиза остаётся слабым.","Failures are spotted faster, but the release process still lets risky changes through."]],
 [["monitoring","мониторинг","Постоянное наблюдение за состоянием системы.","Better monitoring would have caught this."],["blameless","без поиска виноватых","Разбор, где ищут причины, а не людей.","We held a blameless post-mortem."]]]
]);

BS('sc08',['Anna','Account Manager at the card processor','Email'],['Price','Relationship','Flexibility'],
{good:"The bank pays far less than the first demand and keeps a strong relationship with its processor. Finance is impressed, and you have the flexibility to review the deal after a year.",
 mid:"The deal is acceptable, but the bank gives up some flexibility or goodwill along the way.",
 bad:"The bank ends up with a worse deal and a cold relationship. The CEO questions the way vendors are managed."},
[
["Anna from our card processor writes: 'From next quarter, processing fees will increase by 25%. This is standard for all clients.' Your bank depends on this vendor for every card payment.",null,[
 ["Reply politely, ask for the reasons behind the increase, and prepare data on your volume and growth to discuss a better deal and a longer-term plan.","Собирает аргументы и готовит разговор.","Anna agrees to a call, and you arrive with numbers that support your position."],
 ["Offer a three-year contract in exchange for a smaller increase of 10%.","Снижает цену, но привязывает банк к одному поставщику.","The price is lower, but the bank is locked in, and switching later becomes expensive."],
 ["Threaten to switch to another processor immediately.","Угроза без альтернативы выглядит как блеф.","Anna calls your bluff, since the bank has no tested alternative, and the relationship cools."],
 ["Ask Anna for a call, and say the increase is hard for your budget.","Вежливо, но без аргументов и предложений.","Anna agrees to talk, but she expects numbers, and you have none ready."]],
 [["processing fees","комиссии за обработку платежей","Плата поставщику за обработку каждой операции.","Processing fees will go up by 25%."],["lock-in","привязка к поставщику","Ситуация, когда сменить партнёра очень дорого.","A long contract creates lock-in."]]],
["On the call, Anna says she cannot cut the fee, but she may offer a volume discount or extra services. Your finance team says every percent counts.","The call starts coldly. Anna says she cannot cut the fee, but she may offer a volume discount or extra services. Your finance team says every percent counts.",[
 ["Ask for a tiered discount linked to your volume, and a clause that lets the bank adjust or leave if service quality drops.","Привязывает скидку к объёму и сохраняет свободу.","Anna agrees to explore tiers, and the quality clause gives the bank an exit if service drops."],
 ["Accept the extra services she offers, even if the bank does not need them.","Платит за ненужное и теряет деньги.","The extra services add cost, and the bank barely uses them."],
 ["Say the offer is insulting, and end the call.","Разрыв разговора портит отношения.","Anna stops returning your emails, and the relationship turns cold."],
 ["Ask for a volume discount only, and accept the standard contract terms otherwise.","Хорошо, но без защитных условий.","You win a small discount, but the bank gets no protection if service quality drops."]],
 [["volume discount","скидка за объём","Снижение цены при большом количестве операций.","We asked for a volume discount."],["tiered","ступенчатый","Разделённый на уровни по объёму.","A tiered discount grows with volume."]]],
["Anna offers a final deal: a 12% increase instead of 25%, a two-year term, and a clause for review after one year. The CEO wants an answer this week.",null,[
 ["Accept after a quick check with finance and legal, and ask to add a service-quality clause. Thank Anna for her flexibility.","Быстро проверяет условия и сохраняет отношения.","The deal is signed with a quality clause, and Anna remembers the respect."],
 ["Counter once more with an 8% increase, and refuse to move if she says no.","Жёсткая позиция может сорвать почти готовую сделку.","Anna refuses, and you end up with the 25% increase after all."],
 ["Reject the deal and announce that the bank will switch to another processor.","Резкий разрыв без запасного варианта слишком рискован.","The switch takes months, and the bank pays more in the meantime."],
 ["Accept the deal immediately without checking with finance or legal.","Быстро, но без проверки рисков.","The deal is signed, but legal finds an unfavorable clause a week later."]],
 [["counteroffer","встречное предложение","Ответное предложение другой стороны переговоров.","We made a counteroffer of 10%."],["term","срок договора","Период, на который заключён договор.","The term is two years."]]]
]);

BS('sc09',['Nora','Chief of Staff','Slack'],['Team trust','Product insight','Stakeholders'],
{good:"The team trusts you, the product's decline slows, and leadership sees a PM who listens, learns and delivers. Nora says you earned your place.",
 mid:"Things improve slowly, but the team and leadership are still not fully convinced. You have a good start and more to prove.",
 bad:"The team pulls back, leadership loses patience, and the product keeps declining. You will need to rebuild trust before anything else."},
[
["It is your first week as PM of Northwind's savings product, which has been losing customers for two quarters. The team is wary, and Nora asks how you will start.",null,[
 ["Meet each team member one-on-one, listen to what they think is wrong, and review customer feedback and data before making any plan.","Слушает команду и изучает данные до решений.","The team opens up, and you learn things no report shows."],
 ["Present a new vision to the team on day two, so everyone sees you have a plan.","План без знаний выглядит самоуверенно.","The team nods politely, but they feel you do not yet understand the product."],
 ["Replace the existing roadmap with your own plan, and tell the team to follow it.","Ломает доверие и пренебрегает опытом команды.","The team stops sharing ideas, and two people ask about moving to other teams."],
 ["Join the daily meetings and observe quietly for two weeks before speaking.","Много узнаёт, но молчание можно принять за безразличие.","You learn a lot, but the team starts to wonder whether you care."]],
 [["one-on-one","личная встреча тет-а-тет","Разговор двух людей без других участников.","I had a one-on-one with every engineer."],["inherit","унаследовать","Получить продукт или проблему от предшественника.","You inherited a product in decline."]]],
["Team members say customers leave because the interest rate is no longer competitive, and because transfers to other banks are slow. Nora asks which one you will tackle first.","The team is still guarded. They say customers leave because the interest rate is no longer competitive, and because transfers to other banks are slow. Nora asks which one you will tackle first.",[
 ["Compare both with data: how many customers left for each reason and what each fix would cost. Then choose the cheaper, faster fix first.","Выбирает по данным и стоимости.","The data points to slow transfers as the cheaper fix, and the team agrees with the logic."],
 ["Fix the interest rate first, since customers mention it most, without checking the data.","Самая частая жалоба не всегда самая важная.","The rate change is costly, and the numbers show it was not the main reason for leaving."],
 ["Take on both fixes at once and promise results in a month.","Две задачи сразу и громкое обещание.","The team spreads thin, and the promise is missed."],
 ["Fix transfers first because it is a technical change the team can do quickly.","Быстро, но без сравнения причин по данным.","The fix is fast, but you do not know whether it is the biggest reason customers leave."]],
 [["competitive rate","конкурентная ставка","Процентная ставка не хуже, чем у других банков.","The rate is no longer competitive."],["tackle","браться за решение проблемы","Заняться трудной задачей.","Let's tackle slow transfers first."]]],
["The head of retail banking asks for a clear plan, since the product is losing money. He wants quick wins and a long-term path.",null,[
 ["Present a 90-day plan with two quick wins and one longer bet, with metrics and risks, and agree on a monthly review.","Совмещает быстрые победы и долгосрочный план.","He approves the plan, and the monthly review gives him visibility."],
 ["Say it is too early to promise anything, and ask for six months.","Честно, но без конкретики руководитель теряет терпение.","He grows impatient, and he asks someone else to prepare a plan."],
 ["Promise to double customer growth in three months, to calm him down.","Невыполнимое обещание сработает против вас.","He is calm for a week, then the missed promise damages your credibility."],
 ["Present quick wins only, and leave the longer plan for later.","Хорошо для скорости, но направление пока неясно.","He likes the quick wins but asks what happens after the first quarter."]],
 [["quick win","быстрая победа","Небольшое улучшение с заметным результатом.","A quick win builds trust."],["bet","ставка, долгосрочная инициатива","Идея с высоким риском и потенциалом.","One longer bet is enough for now."]]],
["A quick win fails: the new transfer speed is faster, but customers do not notice. The head of retail asks what went wrong.",null,[
 ["Explain what you learned: the change was real but not visible, show how you will test the message with customers, and propose the next step.","Признаёт урок и предлагает следующий шаг.","He sees a PM who learns fast, and he supports your next test."],
 ["Say that the team did everything right and that customers simply do not understand the improvement.","Винит клиентов вместо анализа.","He feels you are defensive, and the team learns nothing."],
 ["Blame the previous PM's decisions and the poor state of the product you inherited.","Перекладывание вины на предшественника.","He sees an excuse, and the team stops trusting your judgment."],
 ["Say you will look into it and come back with an answer next week.","Вежливо, но без позиции.","He waits, but he expected at least a first hypothesis."]],
 [["perceived value","воспринимаемая ценность","Ценность, которую клиент реально замечает.","Customers did not notice the perceived value."],["lesson learned","извлечённый урок","Вывод из ошибки или опыта.","The lesson learned is to test the message."]]],
["After three months, customer losses slow and the team seems more confident. Nora asks how you will keep the momentum.",null,[
 ["Share the results openly, credit the team's ideas, and set the next quarter's goals together with the team and retail banking.","Делится успехом и вовлекает людей в цели.","The team feels ownership, and leadership sees a stable path."],
 ["Keep going as is, and avoid new commitments to protect the progress.","Осторожно, но без движения вперёд.","Progress stalls, and leadership asks what comes next."],
 ["Take credit for the results at the leadership meeting, and announce the next big plan.","Присваивает успех и теряет команду.","The team hears about it and feels used, and momentum drops."],
 ["Present the results to leadership with the team's names, and plan the next quarter yourself.","Хорошо отмечает команду, но цели ставит один.","The team feels recognized but not involved, and ownership stays weak."]],
 [["momentum","набранный темп, инерция успеха","Ощущение движения вперёд.","We need to keep the momentum."],["credit","признание заслуг","Публичное признание чьего-то вклада.","Give the team credit for the result."]]]
]);

function A(id,title,topic,text,words,quiz){
  ARTICLES.push({id:id,title:title,topic:topic,text:text,
    words:words.map(function(a){return {w:a[0],ru:a[1],how:a[2],ex:a[3]};}),
    quiz:quiz.map(function(q){return {q:q[0],ok:q[1],wrong:q[2],e:q[3],w:q[4]||null};})});
}

/* ---------- Chapter 1: Intern ---------- */
A('a01','Your first week in a bank product team','Basics',[
"A bank is not a normal tech startup. Every feature touches money, personal data and rules from regulators, so product teams work closely with [[compliance|compliance]], risk and legal. In your first week, your main job is to learn how the team works and who the [[stakeholders|stakeholder]] are.",
"Meet the people around the product: engineers who build it, designers who shape it, analysts who measure it, and support agents who hear customers every day. Ask each person the same simple question: what is the biggest problem in this product right now? Different answers show you where the real risks are.",
"Next, read the [[backlog|backlog]], the list of work waiting to be done, and join the daily [[standup|standup]]. Do not try to fix things yet. Take notes, write down the words you do not know, and look for the numbers the team checks every week.",
"Good interns ask questions early and clearly. A question like 'Which metric tells us this feature works?' shows that you think about results. By Friday, write a one-page summary of what you learned and share it with your manager."],

[["Why do bank product teams work closely with compliance, risk and legal?","Because every feature touches money, data and regulation",["Because banks do not have engineers of their own","Because compliance teams design the app screens","Because customers ask to talk to them directly"],"Банковские функции затрагивают деньги, данные и правила, поэтому нужны комплаенс, риск и юристы."],
 ["What is a backlog?","The list of work waiting to be done",["A report about last month's revenue","A meeting for the whole company","A list of customer complaints only"],"Бэклог это список задач, ожидающих выполнения."],

A('a02','Reading the numbers: users and funnels','Metrics',[
"A bank app collects thousands of numbers every day, but only a few matter. Start with [[active users|active users]], the people who actually open the app in a period. Daily active users show habits, and monthly active users show reach.",
"Next, look at the [[funnel|funnel]]. It is the path a customer follows, for example: opens the app, starts account opening, uploads an ID, gets the account. At each step some people leave. The step with the biggest loss is where you should look first.",
"A [[conversion rate|conversion rate]] is the share of people who complete a step. If 1,000 customers start and 300 finish, the conversion rate is 30%. Always compare the same period and the same group of customers, or the comparison will mislead you.",
"Numbers tell you what happened, but not why. When a number looks strange, check its [[definition|definition]], then talk to customers or watch their sessions. Never present a number without saying where it comes from."],
[["active users","активные пользователи","Люди, которые реально пользуются продуктом за период.","We have 50,000 active users."],
 ["funnel","воронка","Шаги, которые проходит клиент, и доля людей на каждом шаге.","The funnel shows where customers quit."],
 ["conversion rate","коэффициент конверсии","Доля людей, которые завершили нужный шаг.","The conversion rate is 30%."],
 ["definition","определение (показателя)","Точное правило, как считается показатель.","Check the definition before you compare."]],
[["What do daily active users show?","How many people open the app on a given day",["How many people downloaded the app in total","How much money customers keep in the bank","How many customers called the support line"],"DAU показывает, сколько людей пользуются продуктом в течение дня."],
 ["A funnel starts with 1,000 customers and 300 finish. What is the conversion rate?","30%",["3%","70%","300%"],"300 из 1000 это 30%."],
 ["A single number is enough to understand why customers behave in a certain way.","False",["True"],"Цифры показывают, что произошло, но не почему. Нужны интервью и наблюдения."],
 ["In the text, 'funnel' means:","the steps a customer takes, with some people leaving at each step",["a tool used to pour liquid into a small bottle quickly","a ranking of the app's features by their popularity","a group of people who work together on the same app"],"Воронка это путь клиента по шагам, на каждом часть людей уходит.","funnel"],
 ["Why should you compare the same period and the same group of customers?","Otherwise the comparison can mislead you",["Because the app only stores one month of data","Because regulators demand identical reports","Because customers prefer simple numbers"],"Разные периоды и группы дают неверные выводы."]]);

A('a03','Talking to customers','Discovery',[
"[[Discovery|discovery]] means learning about customers before you build. In a bank this matters a lot, because people are careful with money and often say one thing and do another. A good interview helps you hear what really happens in their lives.",
"Ask about the past, not the future. 'Tell me about the last time you sent money abroad' gives real details. 'Would you use a new transfer feature?' gives polite guesses. Ask [[open questions|open questions]] that start with what, how or when, and avoid [[leading questions|leading question]] that suggest an answer.",
"Listen more than you speak. Write down exact words, and notice the [[pain points|pain points]]: moments of effort, fear or confusion. When someone says 'I always check twice,' ask why. The reason is often the real problem.",
"After five or six interviews, look for a [[pattern|pattern]]. One story is only a story, but the same story three times is a signal. Share your notes with the team, so everyone hears the customer, not only you."],
[["discovery","исследование потребностей клиентов","Изучение клиентов и их проблем до разработки.","Discovery saves months of wrong work."],
 ["open questions","открытые вопросы","Вопросы, на которые нельзя ответить просто да или нет.","Open questions start with what or how."],
 ["leading question","наводящий вопрос","Вопрос, который подсказывает нужный ответ.","A leading question gives false answers."],
 ["pain points","болевые точки клиента","Моменты, когда клиенту трудно, страшно или непонятно.","Slow transfers are a pain point."],
 ["pattern","закономерность","Повторяющаяся история в нескольких интервью.","We found a pattern in the interviews."]],
[["Which question follows the advice of the text?","Tell me about the last time you sent money abroad.",["Would you use a new transfer feature next year?","Don't you think transfers are too slow today?","How much would you pay for a better app?"],"Вопрос о прошлом даёт реальные детали, а о будущем только вежливые догадки."],
 ["Why does the author warn about questions about the future?","They usually produce polite guesses, not real details",["They are not allowed in banks","They take too long for customers to answer","They always upset the people you ask"],"Люди плохо предсказывают своё поведение."],
 ["One interview is enough to see a pattern.","False",["True"],"Закономерность видна, когда одна и та же история повторяется несколько раз."],
 ["In the text, 'pain point' means:","a moment of effort, fear or confusion for the customer",["a physical injury during the use of an app","a feature that earns the most revenue","a complaint that the bank has already solved"],"Pain point это болевая точка клиента.","pain points"],
 ["What should you do after five or six interviews?","Look for repeated stories and share the notes",["Choose the idea of the most interesting customer","Stop talking to customers completely","Write the final design of the feature"],"После серии интервью ищут повторы и делятся выводами с командой."]]);

A('a04','Writing a clear user story','Delivery',[
"Engineers cannot build what they do not understand. A [[user story|user story]] describes a need from the customer's point of view in one sentence: 'As a business owner, I want to export my statement to a spreadsheet, so that I can send it to my accountant.' The last part, the reason, matters most.",
"Next come [[acceptance criteria|acceptance criteria]]: simple checks that tell the team when the story is done. For example: the export works for the last 12 months, the file opens in Excel, and customers see an error message if the export fails. Each check should be clear enough to test.",
"Good stories are small. If a story needs more than a few days of work, split it into a smaller [[slice|slice]] that still brings value, for example a one-month export first and a full year later. Small slices reduce risk and bring feedback faster.",
"In banking, check each [[edge case|edge case]] early: what if the account is closed, the statement is empty, or the customer has no permission? Writing these down with the team prevents surprises close to the release."],
[["user story","пользовательская история","Короткое описание потребности клиента: кто, что и зачем.","Each user story starts with the customer."],
 ["acceptance criteria","критерии приёмки","Проверки, по которым понятно, что задача готова.","The acceptance criteria are clear."],
 ["slice","часть, порция работы","Меньшая часть большой задачи, которая всё равно даёт ценность.","Let's ship the first slice this week."],
 ["edge case","редкий граничный случай","Необычная ситуация, о которой легко забыть.","An empty statement is an edge case."]],
[["Which part of a user story matters most, according to the text?","The reason why the customer needs the feature",["The name of the person who requested it","The exact screen where the button appears","The date when the work will start"],"Причина объясняет ценность и помогает найти лучшее решение."],
 ["What are acceptance criteria?","Checks that show when the story is complete",["Rules for how engineers should write code","A list of customers who approved the idea","The budget approved for the feature"],"Критерии приёмки показывают, когда задача считается выполненной."],
 ["A story that needs several weeks of work is a good size.","False",["True"],"Хорошие истории маленькие, большие нужно делить на части."],
 ["In the text, 'slice' means:","a smaller part of larger work that still brings value",["a time period of about one week for the whole team","a bug that appears for only a small group of users","a discount that is given to a few important clients"],"Slice это небольшая часть работы, которая сама по себе полезна.","slice"],
 ["Which of these is an edge case in the text?","The customer's account is closed",["The customer exports a normal monthly statement","The export button is blue on the screen","Many customers use the feature every week"],"Закрытый счёт это редкий случай, который легко пропустить."]]);

A('a05','Prioritizing with RICE','Prioritization',[
"Every product team has more ideas than time. The hard part is choosing what to build first. A [[prioritization framework|prioritization framework]] helps you decide in a clear and fair way, instead of following a [[gut feeling|gut feeling]] or the loudest voice in the meeting.",
"RICE scores each idea with four factors. [[Reach|reach]] is how many customers it affects in a period, for example 20,000 per quarter. Impact is how much it changes things for each customer. Confidence is how sure you are about your estimates. [[Effort|effort]] is the work needed, counted in person-months.",
"The score is reach times impact times confidence, divided by effort. A small fix that helps many customers can beat a big feature that helps few. For example, a clearer error message in card payments may score higher than a new investment dashboard.",
"RICE is a tool, not a judge. If the result looks strange, question the [[assumption|assumption]] behind it. Strategy and regulation also matter: a low-scoring idea may be required by law or support an important goal."],
[["prioritization framework","система приоритизации","Правила, по которым сравнивают идеи и выбирают порядок.","A framework makes decisions fairer."],
 ["gut feeling","интуиция, чутьё","Решение на основе ощущений, а не данных.","He decided on a gut feeling."],
 ["reach","охват","Сколько людей затронет идея за период.","The reach is about 20,000 customers."],
 ["effort","трудозатраты","Сколько работы нужно для идеи.","The effort is two person-months."],
 ["assumption","допущение","То, что считаем верным, но ещё не проверили.","This estimate rests on a big assumption."]],
[["What does 'reach' mean in RICE?","How many customers the idea affects in a period",["How much each customer benefits from the idea","How many engineers are needed to build it","How certain the team is about the numbers"],"Reach это охват: сколько людей затронет идея."],
 ["How is the RICE score calculated?","Reach times impact times confidence, divided by effort",["Reach plus impact plus confidence plus effort","Effort times reach, divided by impact","Impact divided by confidence times effort"],"Перемножаем охват, влияние и уверенность и делим на трудозатраты."],
 ["A low-scoring idea should never be built.","False",["True"],"Идея с низким баллом может быть нужна по закону или стратегии."],
 ["In the text, 'assumption' means:","something you believe is true but have not yet checked",["a final decision that was already approved by the board","a number copied from the bank's annual financial report","a rule that was written by the compliance team"],"Assumption это допущение, которое ещё не проверено.","assumption"],
 ["Why does the author call RICE 'a tool, not a judge'?","The score should start a discussion, not decide alone",["The score is usually wrong by a large margin","Only managers are allowed to read the score","The score replaces strategy and regulation"],"Балл начинает обсуждение, но не заменяет мышление."]]);

A('a06','A/B testing basics','Experiments',[
"An [[A/B test|A/B test]] compares two versions of something, for example two texts on a loan banner. Half of the customers see version A, and the other half see version B. If B performs better, you have evidence that the change helps, not just an opinion.",
"Before you start, decide three things: the goal, the [[main metric|main metric]] and the [[sample size|sample size]]. If you look at the results first and then choose the metric that looks best, you will fool yourself. A tiny sample can show big differences by pure chance.",
"Let the test run long enough, usually at least one or two full weeks, so that weekdays and weekends are both included. Do not stop the test on the first day you see a winner. Early results often change.",
"Also watch the [[guardrail metric|guardrail metric]], a number that must not get worse, such as complaints or loan approvals. A banner that gets more clicks but creates more confusion is not a win."],
[["A/B test","A/B-тест","Сравнение двух версий на разных группах клиентов.","The A/B test ran for two weeks."],
 ["main metric","основная метрика","Показатель, по которому решают, кто победил.","Applications are the main metric."],
 ["sample size","размер выборки","Сколько людей участвует в тесте.","The sample size was too small."],
 ["guardrail metric","защитная метрика","Показатель, который не должен ухудшиться из-за теста.","Complaints are our guardrail metric."]],
[["In an A/B test, who sees version B?","A separate half of the customers",["Only the customers who complained","The whole team of the bank","Customers who saw version A before"],"Версию B видит отдельная половина клиентов."],
 ["What should you decide before starting the test?","The goal, the main metric and the sample size",["The date of the next release only","Which version the VP prefers","How many people will read the result"],"Цель, метрика и размер выборки определяются до старта."],
 ["You should stop the test on the first day when one version is ahead.","False",["True"],"Ранние результаты часто меняются, тест нужно довести до конца."],
 ["In the text, 'guardrail metric' means:","a number that must not get worse while you test",["the main number that decides who wins","a rule that blocks customers from the test","a report that regulators ask for"],"Это защитный показатель, например число жалоб.","guardrail metric"],
 ["Why does a tiny sample cause trouble?","Big differences can appear by pure chance",["The bank must pay more for small tests","Customers notice that they are in a test","The result always favors version A"],"На малой выборке случайность даёт большие различия."]]);

A('a07','Retention and cohorts','Metrics',[
"Getting a customer is expensive. Keeping them is what makes a bank product grow. [[Retention|retention]] shows how many customers are still active after a period, for example after 30 or 90 days. If retention is low, new signups only fill a leaking bucket.",
"To see what is really happening, group customers into [[cohorts|cohort]]: people who joined in the same month. A table of cohorts shows whether customers who joined in March keep using the app better than those who joined in January. If newer cohorts do better, your changes are working.",
"Average numbers can hide problems. Total active users may grow while each cohort quietly shrinks, because many new people hide the loss of old ones. Always check retention by cohort, not just the total.",
"When retention falls, look for the [[moment of value|moment of value]]. Customers who make a first transfer or set up a salary deposit often stay. Find that moment, also called [[activation|activation]], and help more customers reach it faster."],
[["retention","удержание клиентов","Доля клиентов, которые продолжают пользоваться продуктом.","Retention improved after the change."],
 ["cohort","когорта","Группа клиентов, которые начали пользоваться в одно время.","The March cohort retains better."],
 ["moment of value","момент ценности","Момент, когда клиент впервые получает пользу.","The first transfer is the moment of value."],
 ["activation","активация","Первое реальное получение ценности от продукта.","Activation is the first real use."]],
[["What does retention show?","How many customers are still active after a period",["How many customers joined the bank","How much money the bank earned from fees","How many customers left a bad review"],"Retention это удержание: доля тех, кто остался."],
 ["What is a cohort?","A group of customers who joined in the same period",["A team of engineers working on a feature","A set of the bank's most active branches","A list of products with the same price"],"Когорта это группа клиентов, пришедших в один период."],
 ["Growing total active users always proves that retention is healthy.","False",["True"],"Новые клиенты могут скрывать потерю старых."],
 ["In the text, 'moment of value' means:","the moment when a customer first gets real benefit",["the day the bank approves a new product","a campaign that wakes inactive customers","the process of checking a customer's identity"],"Момент, когда клиент впервые получает пользу.","moment of value"],
 ["What often helps customers stay, according to the text?","Making a first transfer or setting up a salary deposit",["Receiving many reminder emails from the bank each week","Reading the terms and conditions of the account carefully","Seeing a new design of the app every single month"],"Первые реальные действия делают клиента лояльным."]]);

A('a08','Roadmaps: outcomes over outputs','Roadmap',[
"Many roadmaps are lists of features: 'Build a chatbot in Q2, redesign cards in Q3.' These are [[outputs|output]], things the team produces. But customers and the bank do not need features. They need results, which are called [[outcomes|outcome]].",
"An outcome describes a change in behavior or results: 'Reduce account opening drop-off from 45% to 30%.' It leaves room for the team to find the best solution. A feature list closes that room and also hides whether the work helped.",
"A good roadmap shows problems and goals in [[time horizons|time horizon]]: now, next and later. Items in 'now' are clear and detailed, while items in 'later' stay flexible. Dates for far-off work are guesses, and stakeholders should know that.",
"Do not promise exact dates for uncertain work. Say what you are trying to achieve, what you know, and when you will know more. Share the [[roadmap|roadmap]] regularly and explain changes openly, so sales and clients can plan with you."],
[["output","результат работы (выпуск)","То, что команда произвела, например функция.","A new screen is an output."],
 ["outcome","эффект, результат для клиента","Изменение поведения или показателей, которого хотят добиться.","The outcome is a higher completion rate."],
 ["time horizon","горизонт планирования","Период, на который смотрит план: сейчас, дальше, потом.","Each time horizon has a different detail level."],
 ["roadmap","дорожная карта продукта","План развития продукта во времени.","We share the roadmap every month."]],
[["Which of these is an outcome?","Reduce account opening drop-off from 45% to 30%",["Build a chatbot for account opening","Redesign the card management screen","Add a new menu to the mobile app"],"Эффект это изменение результата, а не выпущенная функция."],
 ["What is a problem with feature-list roadmaps?","They hide whether the work helped customers",["They are too short for engineers to read","They never include any dates at all","They only list customer complaints"],"Список функций не показывает, помогла ли работа."],
 ["The text recommends giving exact dates for work far in the future.","False",["True"],"Для далёкой и неопределённой работы даты это только догадки."],
 ["In the text, 'output' means:","something the team produces, like a feature",["the result of a customer's decision","money earned from a product","a meeting that sums up the quarter"],"Output это то, что произвела команда.","output"],
 ["What should you share with stakeholders about uncertain work?","The goal, what you know, and when you will know more",["Only the final date, to keep it simple","Nothing, until the work is finished","A detailed list of technical risks"],"Честность о неопределённости помогает людям планировать."]]);

A('a09','Working with stakeholders','Stakeholders',[
"In a bank, many people have a say in your product: sales, support, legal, compliance, risk and executives. They are your [[stakeholders|stakeholder]]. They are not enemies. Each one sees a part of the picture that you cannot see alone.",
"Start by understanding what each person cares about. Sales cares about deals, compliance about rules, support about customer calls. When you know their goals, you can explain your decisions in their language. Use data and examples, not opinions.",
"When someone asks for something you cannot do, avoid a plain 'no'. Explain the [[trade-off|trade-off]]: what the team would stop doing to [[make room|make room]], and what the risk would be. Offer options, such as a smaller first version, and let the person choose with full information.",
"Keep people informed before they have to ask. A short weekly note about progress, risks and decisions builds [[trust|trust]]. If something goes wrong, tell them early. Nobody likes surprises, and bad news gets worse with time."],
[["stakeholder","заинтересованная сторона","Тот, кто влияет на продукт или кому важен его результат.","Legal is a key stakeholder."],
 ["trade-off","компромисс, цена выбора","Выбор, где за одно приходится жертвовать другим.","Every priority has a trade-off."],
 ["make room","освободить место","Убрать другие задачи, чтобы поместилась новая.","We must make room for this request."],
 ["trust","доверие","Уверенность, что человек или компания не подведут.","Weekly updates build trust."]],
[["Why does the text say stakeholders are not enemies?","Each person sees a part of the picture you cannot see",["They always agree with the product team","They are paid to solve your problems","They rarely ask for anything unusual"],"У каждого своя часть картины, вместе они дают целое."],
 ["What should you do when you cannot do what someone asks?","Explain the trade-off and offer options",["Say no and end the conversation","Promise it now and check the facts later","Send the request to the executives"],"Объясните цену выбора и предложите варианты."],
 ["A short weekly update helps build trust.","True",["False"],"Регулярные короткие апдейты создают доверие."],
 ["In the text, 'trade-off' means:","a choice where gaining one thing means giving up another",["a deal where both sides lose a large amount of money","an exchange of employees between two product teams","a discount that is offered to a very large client"],"Trade-off это компромисс: за одно платим другим.","trade-off"],
 ["What does the text say about bad news?","It gets worse with time, so tell people early",["It should wait for the weekly meeting","It should be shared only with executives","It is better to fix it before telling anyone"],"Плохие новости лучше сообщать рано."]]);
