  else if(ui.view==='newwords'&&ui.nw)h=nwView();
  else if(ui.view==='skipres'&&ui.sr)h=skipResView();
  else if(ui.view==='case'&&ui.cur)h=caseView();
  else if(ui.view==='review'&&ui.rev)h=reviewView();
  else if(ui.view==='articles')h=articlesView();
  else if(ui.view==='article'&&ui.art)h=articleView();
  else if(ui.view==='quiz'&&ui.qz)h=quizView();
  else if(ui.view==='words')h=words();
  else if(ui.view==='progress')h=progress();
  else h=home();
  var hideNav=ui.view==='practice'||ui.view==='tracks'||(ui.view==='rp'&&ui.rp)||ui.view==='rplist'||(ui.view==='prep'&&ui.pr)||(ui.view==='case'&&ui.cur)||(ui.view==='review'&&ui.rev)||(ui.view==='article'&&ui.art)||(ui.view==='quiz'&&ui.qz)||(ui.view==='intro'&&ui.intro)||(ui.view==='chapter'&&ui.chap)||(ui.view==='evintro'&&ui.evi!==undefined)||(ui.view==='newwords'&&ui.nw)||(ui.view==='skipres'&&ui.sr);
  $app.innerHTML=h+(hideNav?'':nav())+(ui.lvlUp?overlay():'')+(ui.onb?onbOverlay():'');
  padApp();
  animateMeters();
  if(ui.view==='levels')updBanner();
}

/* ================= LESSON EXTRAS: tone + build ================= */
/* each lesson = 1) case  2) tone  3) build the sentence (voice or text) */
function TN(ctx,best,harsh,third,cb,ch,c3){return {ctx:ctx,opts:[{t:best,ok:true,c:cb},{t:harsh,ok:false,c:ch},{t:third,ok:false,c:c3}]};}
var LX={
 b01:{tone:TN("You need to tell Dana that Excel export will not make it into Friday's release.",
   "Let's ship CSV on Friday and move Excel to next week. Does that work for you?",
   "Excel is out. Ship CSV on Friday and don't start anything else this week.",
   "As I said before, Excel was always risky. Let's just ship CSV, I guess.",
   "Решение ясное, но звучит как общий план, а вопрос в конце оставляет Дане место для мнения.",
   "Решение то же, но приказной тон: «Excel is out» и запрет звучат резко и без уважения к работе команды.",
   "«As I said before» и «I guess» читаются как упрёк и пассивная агрессия, хотя по сути решение верное."),
   build:"let's descope excel and ship the csv export on friday"},
 b03:{tone:TN("The VP wants a result today, but the test needs two more weeks. Write a reply to the VP.",
   "We need about two more weeks to be sure. I'll send you the final result on the 14th.",
   "Four days is not enough data. You'll get an answer when the test is done.",
   "Sorry, I'm not really sure yet, maybe we could wait a bit if that's okay?",
   "Спокойно объясняет причину и даёт конкретную дату, поэтому VP слышит уверенность, а не отказ.",
   "По сути верно, но звучит как поучение руководителя и без конкретного срока.",
   "Слишком много извинений и «maybe»: звучит неуверенно, и VP не получает ни решения, ни даты."),
   build:"keep the test running until we reach statistical significance"},
 b04:{tone:TN("The team is excited to start building after five interviews. You want to test pricing first.",
   "Great signal from the interviews! Before we build, let's check if people will actually pay.",
   "Five interviews prove nothing. Nobody starts building until I say so.",
   "Sure, let's build it, if we're fine with guessing what people will pay.",
   "Сначала признаёт работу команды, потом предлагает следующий шаг через «let's», без давления.",
   "Обесценивает интервью и звучит как приказ «until I say so», команда потеряет мотивацию.",
   "Формально соглашается, но сарказм «if we're fine with guessing» звучит как пассивная агрессия."),
   build:"test willingness to pay with a pricing page experiment first"},
 b05:{tone:TN("DAU dropped after Tuesday's release. You need data from the engineering team.",
   "Could you share the Tuesday release notes? I want to rule it out as a possible cause.",
   "Your Tuesday release probably broke DAU. Send me the release notes now.",
   "Interesting how DAU dropped right after your release. Any thoughts on that?",
   "Просит о конкретном и объясняет зачем, никого не обвиняя: «rule it out» звучит нейтрально.",
   "Обвиняет команду без данных и требует «now», люди начнут защищаться, а не помогать.",
   "«Interesting how...» это скрытый упрёк: вопрос звучит как намёк, что виноваты они."),
   build:"segment the drop by cohort to find the root cause"},
 b06:{tone:TN("Marketing changed the requirements for the third time this month. Write to the marketing lead.",
   "Can we agree on one owner for requirements? Late changes are hard on the design team.",
   "Stop changing the requirements. Design can't keep redoing your work.",
   "Third change this month, nice. I'm sure design will love it again.",
   "Предлагает решение и спокойно называет последствия, без обвинения конкретного человека.",
   "«Stop» и «your work» звучат как обвинение, маркетинг начнёт оправдываться.",
   "Чистый сарказм: «nice» и «will love it» это пассивная агрессия, которая портит отношения."),
   build:"name one owner for requirements and add a sign off step"},
 b07:{tone:TN("Support says they aren't ready for next week's launch. Reply to the support lead.",
   "Thanks for flagging this early. Let's go through the checklist together today.",
   "The date is announced, so support just has to be ready. No excuses.",
   "I'm so sorry, this is all my fault. We can do whatever you think is best.",
   "Благодарит за сигнал и предлагает совместный конкретный шаг, это тон партнёра.",
   "Игнорирует проблему и звучит как давление, «No excuses» особенно резко.",
   "Слишком много вины и ноль решений: PM отдаёт решение и выглядит неуверенно."),
   build:"run the readiness checklist with support then pick a phased rollout"},
 b08:{tone:TN("The sales team's request didn't make the top three this quarter. Tell the sales lead.",
   "Your request didn't make the top three this quarter. Happy to walk you through the scoring.",
   "Your request is out. The scoring says it's not important enough.",
   "We'll see, maybe it gets in at some point. Hard to say right now.",
   "Честно говорит «нет» и сразу предлагает объяснить логику, отказ звучит справедливо.",
   "«Is out» и «not important enough» звучат пренебрежительно к работе отдела продаж.",
   "Размытый ответ: создаёт ложную надежду, и через месяц будет тот же разговор."),
   build:"score all twelve requests by impact and effort"},
 b11:{tone:TN("Maya wants to call her campaign a win, but retention is flat. Write to Maya.",
   "The signup growth is great work. Let's also show retention, so the board sees the full picture.",
   "You can't call this a win. Retention is flat, so the campaign didn't work.",
   "Sure, call it a win, as long as nobody on the board looks at retention.",
   "Признаёт результат Майи и предлагает добавить контекст, а не спорить с ней.",
   "Обесценивает работу целиком, хотя рост регистраций реален. Звучит как приговор.",
   "Сарказм вместо аргумента: Майя услышит насмешку, а не риск."),
   build:"report the growth but flag flat retention as a risk"},
 b12:{tone:TN("Leo suggests removing step 3 of onboarding. You want to check the data first.",
   "Good idea to look at step 3. Before we remove it, can we check the recordings together?",
   "We're not removing step 3. Some customers need it, so drop the idea.",
   "Removing it is one option, if we don't care about the customers who use it.",
   "Поддерживает фокус Лео и превращает спор в совместную проверку.",
   "Закрывает идею без обсуждения, «drop the idea» звучит грубо.",
   "Намекает, что Лео не думает о клиентах: это пассивная агрессия."),
   build:"watch session recordings then test a version where the import is deferred"},
 b16:{tone:TN("Zoe collected ten dark mode requests and thinks it's a must-have. Reply to Zoe.",
   "Thanks for collecting these! I'll compare dark mode with other priorities and get back to you.",
   "Ten requests is nothing. Dark mode is not happening this quarter.",
   "Ten whole requests, wow. I'll add it to the list with everything else.",
   "Ценит работу Зои и обещает понятный следующий шаг, не обещая результат.",
   "Обесценивает сигнал и решает без анализа, Зоя перестанет приносить запросы.",
   "«Ten whole requests, wow» это насмешка, хотя смысл ответа нормальный."),
   build:"rank dark mode against other opportunities by impact"},
 b24:{tone:TN("In an interview, a user asks for an export button. You want to find the real problem.",
   "That's really helpful. Could you show me what you do with the table after you copy it?",
   "Why do you even need export? Just tell me what problem you have.",
   "Okay, export, got it. Anything else you want us to build for you?",
   "Мягко благодарит и просит показать процесс, пользователь охотно раскроет настоящую задачу.",
   "«Why do you even need» звучит как допрос, пользователь закроется.",
   "Вежливо, но просто записывает запрос и не ищет проблему, интервью теряет смысл."),
   build:"ask what underlying problem they solve with this workaround"},
 b52:{tone:TN("The CEO is delighted about a sudden signup spike. You want to check the data first.",
   "Exciting numbers! Let me check the source first, so we're sure the spike is real.",
   "Don't get excited. This is probably bots or a tracking bug.",
   "Sure, let's celebrate, unless it turns out to be bots again.",
   "Разделяет радость и спокойно объясняет проверку, CEO не почувствует себя глупо.",
   "Звучит как запрет радоваться и обрывает CEO, хотя проверка действительно нужна.",
   "«Again» и «sure, let's celebrate» читаются как подкол, это пассивная агрессия."),
   build:"verify the source before we celebrate the spike"},
 sc07:{tone:TN("Support tickets about 'missing steps' went up after the new onboarding. Reply to support.",
   "Thanks for the ticket data. Let's add a short guide to the new flow and review tickets weekly.",
   "The tickets are just users getting used to it. Ignore them for now.",
   "I guess users can't handle a small change. We'll add a guide if we really have to.",
   "Благодарит, предлагает конкретное действие и регулярную проверку, поддержка чувствует, что её слышат.",
   "Отмахивается от сигнала поддержки, «ignore them» звучит пренебрежительно.",
   "«I guess users can't handle» и «if we really have to» это раздражение и пассивная агрессия."),
   build:"ship the minimum version behind a feature flag"},
 b02:{tone:TN("A big client wants a custom dashboard on this quarter's roadmap, and Mark is pushing you to say yes. Write your reply to Mark.",
   "I understand the renewal matters. Let me find out what the dashboard is for, and I'll send you a scoped option by Friday.",
   "The roadmap is full. I can't add anything, so the client will have to wait.",
   "Okay, I'll try to somehow fit it in, but I can't promise anything, sorry.",
   "Показывает, что ты понял важность сделки, и даёт конкретный следующий шаг со сроком.",
   "Жёсткий отказ без вопросов и без альтернативы: Mark почувствует, что его проблему игнорируют.",
   "Слишком много «try» и «sorry»: звучит неуверенно, а обещание «как-нибудь втиснуть» опасно."),
   build:"let me find out what the dashboard is for first"},
 b09:{tone:TN("Anna offers a 10% discount for a two-year contract, but your budget is tight. Write your reply.",
   "Thank you for the offer. Two years is a long commitment for us. Could we keep the discount with an opt-out clause after year one?",
   "Ten percent is too small. Give us thirty or we walk away.",
   "Fine, whatever you think is best, we'll sign the two years.",
   "Вежливо благодарит, называет возражение и предлагает конкретное условие.",
   "Ультиматум закрывает переговоры, и Anna вряд ли захочет искать компромисс.",
   "Мгновенное согласие отдаёт все рычаги, а «whatever» звучит безразлично."),
   build:"could we keep the discount with an opt-out clause after year one"},
 b10:{tone:TN("Ben wants to promise feature X to a client today, but engineering has not finished the estimate. Write your reply to Ben.",
   "I can't commit to a date yet. It's planned for Q4, and I'll confirm timing next week once the estimate is done.",
   "Don't promise anything. It's not your call, and dates are my job.",
   "Probably December? I'm not sure, but you can say it, I guess.",
   "Честно говорит, что даты пока нет, даёт ориентир и срок подтверждения.",
   "Сухо и резко: Ben получает запрет без объяснения и без помощи с клиентом.",
   "«Probably» и «I guess» превращаются в обещание клиенту, которое потом придётся нарушить."),
   build:"it is planned for q4 and the date is still tentative"},
 b14:{tone:TN("Nora asks how the team will measure success of the 'improve onboarding' objective. Write your reply.",
   "Good question. I suggest we raise activation from 35% to 50% this quarter, and I'll share the full list of key results by Wednesday.",
   "We'll know it when we see it. Onboarding is clearly better now, so just trust the team.",
   "Maybe something like more users finishing it? I haven't really thought about it, sorry.",
   "Называет метрику, базу и цель и обещает срок, поэтому ответ конкретный и проверяемый.",
   "«Trust the team» уходит от вопроса, а измерить успех без цифр нельзя.",
   "Размытая формулировка и извинение: Nora не получит ни метрики, ни плана."),
   build:"raise activation from thirty five to fifty percent this quarter"},
 b22:{tone:TN("Dana says priorities changed three times this month and the team is frustrated. Write your reply.",
   "You're right, and I'm sorry for the disruption. Let's set up a weekly priority review, and any urgent work will replace something instead of adding to the sprint.",
   "Priorities change because the business changes. The team needs to be more flexible.",
   "It's not really my fault, the VP of Sales keeps asking, so what can I do?",
   "Признаёт проблему, не ищет виноватых и предлагает понятное правило.",
   "Перекладывает вину на команду и обесценивает её усталость.",
   "Оправдание и перевод стрелок: решения нет, а Dana остаётся без поддержки."),
   build:"urgent work will replace something instead of adding to the sprint"},
 b23:{tone:TN("The test shows conversion up 3%, but support tickets rose 15%. The sponsor wants to ship. Write your reply to the sponsor.",
   "The conversion gain looks good, but tickets rose 15%. Let me find out why before we ship, so we don't grow with confused users.",
   "Tickets don't matter. Conversion is up, so let's ship it today.",
   "Hmm, I think maybe we should wait, but I'm not sure, what do you think?",
   "Признаёт плюс, называет риск и предлагает конкретный шаг без давления на спонсора.",
   "Игнорирует тревожный сигнал: рост конверсии может быть за счёт запутавшихся пользователей.",
   "Сомнение без аргументов и вопрос в конце перекладывают решение на спонсора."),
   build:"let me find out why tickets rose before we ship"},
 b25:{tone:TN("The launch email goes out tomorrow, but legal has not approved the pricing wording. Write your message to the team.",
   "Legal hasn't approved the pricing wording yet. I'll call them today, and I'm preparing a version without prices in case we miss the deadline.",
   "Legal is blocking us again. Somebody needs to push them, or we'll miss the launch.",
   "We might have a small problem with the email, but maybe it will be fine, hopefully.",
   "Сообщает факт, называет действие на сегодня и запасной вариант.",
   "Обвиняет юристов, не предлагает плана, и команда начнёт искать виноватого.",
   "«Maybe» и «hopefully»: проблема размыта, и команда не понимает, что делать."),
   build:"i will call legal today and prepare a version without prices"},
 b31:{tone:TN("QA found a minor bug a day before release; the release is tied to a client announcement. Write your update to the stakeholders.",
   "QA found a bug that affects about 2% of users, and there's a workaround. I recommend we ship on time and fix it in a patch next week.",
   "There's a bug, but nobody will notice it. We're shipping, end of discussion.",
   "A bug appeared, so I guess we should probably delay, if that's okay with everyone?",
   "Даёт масштаб, говорит про обходной путь и предлагает решение с планом исправления.",
   "Закрывает обсуждение и скрывает риск: так теряют доверие.",
   "Нерешительно: отложить релиз ради малого бага вряд ли нужно, и решения нет."),
   build:"we ship on time and fix the bug in a patch next week"},
 b41:{tone:TN("Four of five users could not find the Save button, but Oleg thinks the layout is obvious. Write your reply to Oleg.",
   "Four of five users couldn't find it, so let's try a more visible placement and retest with new people.",
   "The users are right and you're wrong. Change the button today.",
   "Maybe the design is fine and the users were tired? I don't know, honestly.",
   "Опирается на факты теста и предлагает проверяемый эксперимент вместе с дизайнером.",
   "Противопоставляет дизайнеру пользователей и приказывает: Oleg обидится.",
   "Обесценивает данные теста, и проблема так и останется."),
   build:"let us try a more visible placement and retest with new users"},
 s01:{tone:TN("Checkout is failing for 5% of users, and customers are posting about it. Write the update for customers.",
   "We found the issue and rolled back the release. Checkout is working again, and we'll share an update with a timeline within the hour.",
   "A small number of users had problems. It's not a big deal and nothing else to say.",
   "We're really, really sorry, we don't know what happened yet, maybe it will work soon.",
   "Сообщает факт, статус и конкретный срок следующего апдейта.",
   "Преуменьшает проблему, и недовольство клиентов только вырастет.",
   "Много извинений и никакого срока или плана: клиенты не понимают, чего ждать."),
   build:"we rolled back the release and will share an update within the hour"},
 s02:{tone:TN("Mark says a $500k deal needs feature A this quarter, but engineering is full. Write your reply to Mark.",
   "I want to help close this deal. Let me confirm that A is the real blocker and set up a call with the client this week.",
   "Engineering is full. Feature A is not happening, so please tell the client no.",
   "Okay, I'll tell the team to build feature A, even if it breaks something else.",
   "Поддерживает цель Mark и предлагает проверить факты и поговорить с клиентом.",
   "Категоричный отказ без вопросов, поэтому Mark пойдёт к руководству мимо тебя.",
   "Слепо соглашается на сделку, не взвесив стоимость для команды."),
   build:"let me confirm that feature a is the real blocker for the deal"},
 s03:{tone:TN("Priya asks how to test a 15% price increase safely. Write your reply to Priya.",
   "Let's show the new price only to new customers so existing ones aren't affected, then compare conversion with the control group.",
   "Just change the price for everyone next month, like the CEO wants.",
   "I'm not sure testing is needed, but we could try something, if you think so.",
   "Конкретный безопасный план: новые клиенты и контрольная группа.",
   "Игнорирует риск для существующих клиентов и ломает смысл теста.",
   "Размытый ответ без плана: Priya остаётся без решения."),
   build:"show the new price to new customers only and compare conversion"},
 sc02:{tone:TN("Mark wants spending insights stopped before the quarterly meeting. Write your reply to Mark.",
   "I hear that business clients ask for statements. Could you name three of them, so I can compare their needs with our insights data?",
   "Insights will stay. I have data and you only have opinions, so we won't stop it.",
   "I guess you may be right, maybe we can stop insights, if you really want to.",
   "Признаёт запрос клиентов и просит конкретные примеры, чтобы сравнить с данными.",
   "Звучит как «я прав, ты нет», и Mark перейдёт в оборону.",
   "Сдаётся без данных: решение будет принято на чувствах."),
   build:"could you name three clients who asked for statements"},
 b13:{tone:TN("Ira asks for two sprints to fix tech debt, while sales has promised three features. Write your reply to Ira.",
   "The delays are real. Let's quantify what the debt costs us and reserve 20% of every sprint for it, while we still ship the promised features.",
   "We don't have time for tech debt this quarter. Maybe next year.",
   "Sure, take two sprints, I'll tell sales we can't deliver, I guess.",
   "Признаёт проблему, предлагает измерить её и компромисс, который сохраняет обещания.",
   "Отмахивается от проблемы: долг растёт, и скорость падает дальше.",
   "Соглашается на всё сразу и перекладывает проблему на продажи без плана."),
   build:"we reserve twenty percent of every sprint for tech debt"},
 b18:{tone:TN("Engineering says six weeks, sales promised the client three, and the client cares about the date. Write your message to Tom.",
   "Could we look at what drives the six weeks? I'd like to cut scope to what the client really needs by their date.",
   "Sales promised three weeks, so engineering has to find a way to do it.",
   "I guess we could maybe try to speed up a bit, if that's possible for you?",
   "Начинает с вопроса о причине срока и предлагает урезать объём, а не давить на людей.",
   "Перекладывает чужое обещание на инженеров и давит на них.",
   "Просьба «поторопиться» без плана и объёма: Tom не поймёт, что именно делать."),
   build:"let us cut the scope to what the client needs by their date"},
 b27:{tone:TN("A three-year customer asks why their request isn't on the roadmap. Write your reply.",
   "Thank you for the feedback. This quarter we focus on reliability, but your request is logged in our backlog, and I'll update you next month.",
   "It's not on the roadmap because it's not important enough, sorry.",
   "Maybe we'll do it someday, I'll check, but I can't really say anything, sorry.",
   "Благодарит, объясняет приоритет квартала и обещает обновление.",
   "Прямо говорит, что запрос неважен, и лояльный клиент почувствует себя ненужным.",
   "Расплывчато и неуверенно: нет ни причины, ни срока, ни следующего шага."),
   build:"your request is logged in the backlog and i will update you next month"},
 b32:{tone:TN("Sam wants to announce that conversion improved by 25% after the redesign (4% to 5%). Write your reply to Sam.",
   "It's a 25% relative gain, or one percentage point in absolute terms. Let me add the confidence interval so the message is accurate.",
   "That number is wrong and misleading. You can't tell the company that.",
   "Maybe it's 25%, maybe not, I'm not totally sure how it works, sorry.",
   "Уточняет обе цифры и предлагает добавить интервал, не обвиняя руководителя.",
   "Прямо называет слова CEO неправильными: это унижает и не помогает исправить формулировку.",
   "Неуверенность в цифрах подрывает доверие к тебе как к владельцу метрик."),
   build:"it is a twenty five percent relative gain but one point in absolute terms"},
 b36:{tone:TN("A survey says 80% of users love the app, but usage is dropping. Write your reply to Lena.",
   "Thanks, Lena. Only 5% answered, and mostly active users, so let's check who the respondents were and dig into the usage drop.",
   "The survey is useless. Ignore it and look at usage only.",
   "Great, 80% love it! Let's maybe not worry too much about the usage, I guess.",
   "Благодарит за работу и объясняет, почему выборка может искажать картину.",
   "Обесценивает работу исследователя: опрос нужен, но его нужно читать правильно.",
   "Радуется красивой цифре и игнорирует падение использования."),
   build:"let us check who the respondents were and dig into the usage drop"},
 b40:{tone:TN("Maya wants more budget for paid ads, but few signups become customers. Write your reply to Maya.",
   "I'd like to check acquisition cost and payback period first. If the unit economics work, I'll support scaling the spend.",
   "Ads are a waste of money. We're not adding a single dollar.",
   "Maybe we could try a bit more budget, but I'm not sure it will work.",
   "Просит данные и обещает поддержку при хороших цифрах, поэтому разговор конструктивный.",
   "Категорично и без анализа: Maya почувствует, что её работу списали со счетов.",
   "Деньги тратятся без проверки экономики, на надежде."),
   build:"let us check the payback period before we scale the ad spend"},
 b42:{tone:TN("Your main story is blocked by another team's API change. Write your message to the other team's lead.",
   "Hi! Our sprint depends on your API change. Could we talk today for ten minutes to find a way to unblock it?",
   "Your team is blocking us. Fix the API change by tomorrow or we miss the sprint.",
   "Hello, it's probably not urgent, but if you have time next week, maybe we could talk?",
   "Объясняет зависимость и просит короткий звонок сегодня, без обвинений.",
   "Ультиматум и обвинение, партнёр пойдёт в оборону.",
   "Слишком мягко: «not urgent» и «next week» не соответствуют реальным срокам спринта."),
   build:"could we talk today for ten minutes to unblock our sprint"},
 b43:{tone:TN("Weekly active users are up 10% but revenue is flat. Write your reply to Priya.",
   "Thanks, Priya. Could you check whether the new users came from the free promotion, and which features they actually use?",
   "Growth is growth. Revenue will catch up, so let's celebrate and move on.",
   "That's odd. I guess we should maybe look at it someday if there's time.",
   "Задаёт конкретные вопросы про источник и поведение новых пользователей.",
   "Игнорирует тревожный сигнал: рост без выручки не отменяет проблему.",
   "Без срока и плана: проблема останется без внимания."),
   build:"let us check whether the new users came from the free promotion"},
 b48:{tone:TN("A test ran for two days and the team wants to stop because variant B is winning. Write your reply to the team.",
   "Great early signal! Let's run it for a full cycle, at least a week, so we can trust the result.",
   "Two days is nothing. Nobody stops this test until I say so.",
   "Okay, let's stop it then, I guess it should be fine, probably.",
   "Хвалит команду за сигнал и объясняет, зачем нужен полный цикл.",
   "Звучит как приказ и обесценивает энтузиазм команды.",
   "Соглашается на рискованное решение без аргументов."),
   build:"let us run the test for a full cycle before we roll it out"},
 s04:{tone:TN("The biggest customer, 12% of revenue, threatens to leave without SSO this quarter. Write your reply to Sam.",
   "I'll find out what they need and when, then size SSO with engineering and come back to you with options by Thursday.",
   "We can't build SSO this quarter. If they want to leave, let them go.",
   "I'm not sure, SSO sounds hard, maybe we could try, but no promises, sorry.",
   "Показывает, что ты взял задачу на себя, и называет срок ответа.",
   "Равнодушный отказ: потерять 12% выручки нельзя без попытки найти выход.",
   "Много «maybe» и «sorry»: CEO не видит владельца проблемы."),
   build:"i will size sso with engineering and come back with options by thursday"},
 s05:{tone:TN("Adoption of the new feature is only 5% after a month. Write your reply to Priya.",
   "Thanks, Priya. Let's see where users drop off before the feature, and talk to a few who ignored it.",
   "Users are just not interested. Let's remove the feature and move on.",
   "Maybe we could send another newsletter, and I guess hope for the best.",
   "Предлагает исследовать причину через данные и интервью.",
   "Делает вывод без данных и закрывает возможность понять причину.",
   "Повторяет ту же тактику без анализа: результат, скорее всего, не изменится."),
   build:"let us see where users drop off before the feature"},
 s06:{tone:TN("Oleg is frustrated because engineers rejected his design without explanation. Write your reply to Oleg.",
   "I get it, that's frustrating. Let's set up a short session with engineering so you can hear their concerns and simplify the design together.",
   "Engineers know better. Just redo the design and don't argue.",
   "Hmm, that's not great, but maybe they had a reason, I don't know.",
   "Признаёт чувства, предлагает конкретную встречу для решения.",
   "Обесценивает дизайнера и не решает проблему коммуникации.",
   "Сочувствия нет, плана тоже: Oleg останется один с проблемой."),
   build:"let us set up a short session with engineering to simplify the design together"},
 sc05:{tone:TN("The VP of Retail wants to roll out banner B after a three-day test. Write your reply to the VP.",
   "B looks promising, but three days is too early to be sure. Could we run it for two full weeks, so the decision is based on solid data?",
   "The test is too short and your decision is wrong. We won't roll out anything.",
   "I guess the result is okay, so we could roll it out, if you think so.",
   "Признаёт результат и мягко предлагает продлить тест с понятной причиной.",
   "Говорит VP, что её решение неверно: так не получить поддержку.",
   "Соглашается без проверки выборки, хотя тест слишком короткий."),
   build:"the result is promising but we need two full weeks of data"},
 b15:{tone:TN("A competitor launched your Q4 feature, and Alex wants to rush yours. Write your reply to Alex.",
   "I understand the pressure. Our interviews say customers care about speed, so let's keep our scope and differentiate on a faster experience.",
   "Competitors don't matter. We won't change any plans.",
   "Okay, we'll rush it in four weeks, somehow, but it might be buggy.",
   "Понимает давление и опирается на данные интервью, предлагая стратегию отличия.",
   "Отмахивается от конкурента: игнорировать рынок опасно.",
   "Соглашается на спешку без плана, и качество пострадает."),
   build:"let us keep our scope and differentiate on a faster experience"},
 b26:{tone:TN("Mark asks you to tell design to ship what they have, because a client is waiting. Write your reply to Mark.",
   "I'll ask design if the extra week is worth it. If not, we ship what works and agree a follow-up date for the rest.",
   "Design takes the time it takes. The client will have to wait.",
   "I'll tell design to hurry up, but they probably won't like it, sorry.",
   "Не обещает невозможного, но предлагает шаги и срок.",
   "Отказывает без попытки помочь с клиентом.",
   "Передаёт давление на дизайнеров без решения."),
   build:"we ship what works and agree a follow up date for the rest"},
 b28:{tone:TN("NPS dropped from 42 to 31 while retention is stable, and Sam asks if he should worry. Write your reply to Sam.",
   "It's worth a look, but not a panic. I'll read the detractors' comments and check retention by segment, and I'll report back on Friday.",
   "NPS is just a vanity metric. Retention is stable, so there is nothing to discuss.",
   "Maybe we should worry, maybe not, honestly I'm not sure what NPS means exactly.",
   "Взвешенный ответ: не паникует, но называет шаги и срок.",
   "Отмахивается от метрики: падение NPS может быть ранним сигналом.",
   "Неуверенность в базовой метрике подрывает доверие CEO."),
   build:"i will read the detractors comments and check retention by segment"},
 b29:{tone:TN("Engineering wants a three-month rewrite, and product wants quick wins. Write your reply to Tom.",
   "I see the value in the rewrite. Let's estimate its effect on speed and bugs, deliver one quick win now, and plan a smaller first phase.",
   "No rewrite. We have deadlines, and customers need new features.",
   "Fine, do the whole rewrite, and I'll explain to everyone why there are no results.",
   "Признаёт ценность рефакторинга и предлагает баланс: оценка, быстрая победа и малая первая фаза.",
   "Закрывает тему и игнорирует технические риски.",
   "Сдаётся целиком, а к бизнесу придётся идти без результата."),
   build:"let us deliver one quick win now and plan a smaller first phase"},
 b30:{tone:TN("Mark promised a client a custom report without asking you. Write your reply to Mark.",
   "I know you're under pressure. Let me see what's possible in two weeks, and next time please check with me before promising a date.",
   "You had no right to promise that. Fix your own mess with the client.",
   "It's okay, I'll find a way somehow, even though the team is busy, no problem.",
   "Признаёт давление, берёт задачу и аккуратно просит согласовывать обещания.",
   "Обвинение и отказ помогать, поэтому Mark будет скрывать обещания в следующий раз.",
   "Молча принимает проблему и не просит изменить поведение, ситуация повторится."),
   build:"next time please check with me before you promise a date"},
 b33:{tone:TN("A prospect will sign if you confirm an integration by June, but nothing is scoped. Write your reply to Ben.",
   "I can't confirm June yet. Let me check with engineering and come back to you by Friday with what's realistic.",
   "Tell them yes, we'll sort it out later, the deal is more important.",
   "I don't know, June seems difficult, so maybe tell them no, I guess.",
   "Честно не подтверждает сейчас, но называет шаг и срок, чтобы Ben мог ответить клиенту.",
   "Обещание без оценки сорвёт сроки и испортит доверие клиента.",
   "Отказ на ощущениях, когда сделку ещё можно спасти."),
   build:"i cannot confirm june yet but i will come back by friday"},
 b35:{tone:TN("A critical sign-up bug was found two hours before launch. Write your message to the team.",
   "Sign-up fails for about 3% of users with long emails. Engineering will tell us how fast a fix is, and if it's slow, we launch with a workaround and monitor.",
   "Nobody will notice a 3% bug. Launch as planned and say nothing.",
   "This is a disaster, we should cancel everything, I think, I don't know.",
   "Называет масштаб, следующий шаг и запасной план без паники.",
   "Скрывает проблему: если баг всплывёт, доверие к команде упадёт.",
   "Паника без данных: отменять запуск ради 3% трафика пока рано."),
   build:"if the fix is slow we launch with a workaround and monitor"},
 b37:{tone:TN("Support, sales and design all call their request urgent, and you can do only one. Write your message to everyone.",
   "All three matter. I compared them by customer impact and cost of delay, and we'll do the crash fix first. I'll explain the reasoning to each of you today.",
   "I decide what's urgent here. Everyone else will wait, no discussion.",
   "Hmm, I'll try to do a little of everything, and hopefully nobody gets upset.",
   "Показывает критерии выбора и обещает объяснение каждому.",
   "Приказной тон без объяснений, и команды почувствуют несправедливость.",
   "Делить усилия поровну значит ничего не закончить."),
   build:"i compared the three by customer impact and cost of delay"},
 b44:{tone:TN("Support says each feature creates tickets, and sales says you ship too slowly. Write your reply to Mark.",
   "Both concerns are fair. Let's agree on a quality bar for releases and track ticket volume per feature, so speed doesn't cost us quality.",
   "Sales doesn't understand how development works. We can't ship faster.",
   "I guess both are right, so maybe we do nothing for now, if that's fine.",
   "Признаёт обе стороны и предлагает измеримое правило.",
   "Обвиняет отдел продаж и не решает проблему.",
   "Уходит от решения: баланс скорости и качества нужен сейчас."),
   build:"let us agree on a quality bar and track tickets per feature"},
 b53:{tone:TN("A competitor announced a similar feature, and sales needs a response today. Write your message to the sales team.",
   "Customers should hear what we do better for them. Here's what we're strong at, and here's how we plan to keep improving.",
   "The competitor's feature is bad, and ours is much better. Tell customers that.",
   "We're probably behind, so maybe just say we'll build the same thing soon.",
   "Честно показывает сильные стороны и план, без нападок на конкурента.",
   "Нападки без доказательств звучат слабо, клиенты это чувствуют.",
   "Признаёт слабость и обещает копировать: нет собственной позиции."),
   build:"here is what we do better for our customers and how we will improve"},
 s07:{tone:TN("Three teams own parts of checkout and conversion has been stuck for two quarters. Write your proposal to Nora.",
   "I suggest one owner for the whole flow with a shared metric. Could we set up a working session this week with all three teams?",
   "Teams just need to work better together. I don't think we need to change anything.",
   "Maybe someone should do something about this at some point, I guess.",
   "Предлагает одного владельца, общую метрику и конкретную встречу.",
   "Не признаёт структурную проблему, поэтому ничего не изменится.",
   "Нет ни владельца, ни срока: проблема так и останется."),
   build:"i suggest one owner for the whole checkout flow with a shared metric"},
 s08:{tone:TN("The board wants a decision this week on entering a new market. Write your reply to Nora.",
   "I don't have enough data for a full decision. I recommend a small, reversible pilot in the new market while we keep growing the current one.",
   "Just enter the new market. It's three times bigger, so it's an easy choice.",
   "I really can't say, it's too risky, maybe we should just wait a year.",
   "Честно говорит о нехватке данных и предлагает обратимый шаг.",
   "Решение только по размеру рынка, без анализа рисков.",
   "Отказ от решения под давлением времени."),
   build:"i recommend a small reversible pilot in the new market"},
 sc06:{tone:TN("Two clients threaten to leave, and engineering can build only small versions. Write your reply to Ben.",
   "Let's set up calls with both clients to learn the exact problem and the deadline. Then we'll agree on a first step each of them will accept.",
   "We can't build both. Tell one of them to look for another bank.",
   "I'll tell both clients yes, and we'll somehow build everything, hopefully.",
   "Предлагает сначала понять проблему и срок каждого клиента.",
   "Отказ одному клиенту без разговора может стоить дорого.",
   "Обещание обоим без проверки возможностей разрушит доверие."),
   build:"let us set up calls to learn the exact problem and the deadline"},
 b17:{tone:TN("The panel is split 3 to 3 between two senior designer finalists. Write your message to the panel.",
   "Both finalists are strong. Let's agree on what the team needs most this year, and then score both against those criteria.",
   "Mia is clearly better. We just hire her, and that's it.",
   "I can't decide, so maybe we flip a coin, I guess.",
   "Предлагает сначала согласовать критерии, потом сравнивать кандидатов.",
   "Единоличное решение без критериев, и вторая половина панели останется недовольна.",
   "Решение случайностью обесценивает работу панели."),
   build:"let us agree what the team needs most and score both candidates"},
 b34:{tone:TN("The CEO saw a feature at a competitor and wants it this sprint, but the team has a retention project. Write your reply to Nora.",
   "Thank you for bringing it up. Could you ask what problem he wants to solve? Then I'll show how it can fit into our priorities.",
   "No. The sprint is full, and the CEO has to follow the plan he approved.",
   "Okay, I'll add it to the sprint, and we'll drop something, I guess.",
   "Благодарит и предлагает выяснить задачу, прежде чем менять план.",
   "Категоричный отказ руководителю разрушит отношения.",
   "Выполняет любое желание и теряет фокус на приоритете."),
   build:"could you ask what problem he wants to solve"},
 b39:{tone:TN("A new PM asks you to make all decisions for them. Write your reply to the PM.",
   "I'll support you, but you make the call, and I'll have your back if it goes wrong. Last month three of your decisions needed no changes.",
   "Stop being afraid. A PM must decide alone, so don't come to me.",
   "Okay, I'll decide everything for you, no problem, it's easier for me anyway.",
   "Поддерживает, оставляет решение за PM и ссылается на реальные успехи.",
   "Отталкивает человека, который просит помощи.",
   "Забирает решения и лишает PM роста."),
   build:"you make the call and i will have your back if it goes wrong"},
 b46:{tone:TN("Carlos asks how to assess a PM candidate's product sense. Write your suggestion to Carlos.",
   "Let's give the candidate a realistic case about our product and watch how they clarify the problem and weigh trade-offs.",
   "Just ask them to name five product frameworks. If they can't, we reject them.",
   "I guess a normal chat is probably enough, maybe we'll see their level anyway.",
   "Предлагает реалистичный кейс и называет, что именно оценивать.",
   "Проверка знания терминов не показывает, как человек мыслит.",
   "Разговор без структуры даёт субъективную оценку."),
   build:"let us give the candidate a realistic case about our product"},
 b50:{tone:TN("Dana asks why you chose feature A over the technical fix. Write your reply to Dana.",
   "That's a fair question. Feature A affects 30% of users and the fix has no customer impact yet. If you have data that changes this, I'd like to see it.",
   "I'm the PM, so I made the decision. We can't discuss every choice.",
   "Sorry, maybe I was wrong, I'm not really sure why I chose it.",
   "Признаёт право спросить, объясняет логику и просит недостающие данные.",
   "Закрывает обсуждение званием, и команда перестанет делиться мнением.",
   "Сомнение в собственном решении без причины подрывает доверие."),
   build:"that is a fair question and here is how i weighed it"},
 b51:{tone:TN("Should you do a big-bang or a soft launch while support is still hiring? Write your recommendation to Nina.",
   "I suggest a soft launch to a small group first, and we'll save the big announcement for when support is ready.",
   "We have the date booked, so we launch everything on the 15th, no matter what.",
   "Maybe we could do both, I don't know, whatever is easier, I guess.",
   "Предлагает безопасный запуск и привязывает анонс к готовности поддержки.",
   "Идёт по дате вопреки рискам: поддержка не справится.",
   "Нет решения и нет плана."),
   build:"we soft launch to a small group and save the big announcement"},
 b55:{tone:TN("Marketing wants to announce a feature that is still in beta. Write your reply to Alex.",
   "Let's announce it as a beta, describe the limitations clearly, and set up a way to collect feedback.",
   "It's not ready. Nobody announces anything until it's finished.",
   "Okay, announce it, and we'll hope that customers won't notice the problems.",
   "Поддерживает идею, но честно называет бета-статус и ограничения.",
   "Блокирует маркетинг, не предлагая компромисса.",
   "Скрывает ограничения, и клиенты разочаруются."),
   build:"let us announce it as a beta and describe the limitations clearly"},
 b58:{tone:TN("A client asks for a 20% renewal discount or will cancel. Write your reply to Mark.",
   "Let's ask why they want it first. Then we can fit the plan to their budget, or trade a smaller discount for a longer term.",
   "Don't give any discount. If they want to cancel, let them.",
   "Okay, give twenty percent, we can't lose them, whatever the cost.",
   "Сначала выясняет причину, потом предлагает варианты, выгодные обеим сторонам.",
   "Отказ без разговора рискует потерей растущего клиента.",
   "Соглашается сразу, и клиент поймёт, что давление работает."),
   build:"let us trade a smaller discount for a longer term"},
 b62:{tone:TN("Adoption is 8% against a 15% target after three weeks, and management asks if the launch failed. Write your reply.",
   "It's too early to call it a failure. I'll check whether the target was realistic and share a recovery plan by Friday.",
   "The launch was fine. The target was unrealistic, so it's not our problem.",
   "Yes, it probably failed, sorry, I'm not sure what we can do now.",
   "Спокойно оценивает ситуацию и обещает план с датой.",
   "Перекладывает вину на цель и не предлагает действий.",
   "Самообвинение без плана подрывает уверенность команды."),
   build:"it is too early to call it a failure and i will share a recovery plan"},
 b67:{tone:TN("The team wants to test a new homepage, price and onboarding at the same time. Write your reply to Priya.",
   "I like the speed, but we won't know what caused the result. Let's test one change at a time, or plan a proper multivariate test with enough traffic.",
   "That's a bad idea. Priya, don't ever suggest testing three things at once.",
   "Sure, let's test everything together, and we'll figure out the results later.",
   "Признаёт мотивацию и объясняет проблему, предлагая два корректных пути.",
   "Резкий тон по отношению к коллеге, хотя идея легко исправляется.",
   "Смешанный тест не позволит понять, что сработало."),
   build:"let us test one change at a time so we know what caused the result"},
 s09:{tone:TN("A PM keeps missing deadlines, and the team has noticed. Write your message to the PM.",
   "I'd like to understand what's going on. Could we talk privately this week, so we can agree on clear expectations and the support you need?",
   "You've missed two deadlines. If it continues, I'll have to escalate it.",
   "Hi, it's nothing serious, but if you can, maybe be a bit faster, I guess.",
   "Начинает с желания понять, предлагает личный разговор и поддержку.",
   "Угроза эскалации сразу ставит человека в оборону.",
   "Слишком мягко: проблема есть, а чёткого ожидания нет."),
   build:"let us talk privately to agree on clear expectations and support"},
 s10:{tone:TN("Three PMs have conflicting roadmaps that depend on the same engineering team. Write your message to the PMs.",
   "Let's get together this week, map the dependencies, and agree on shared priorities tied to company goals.",
   "Fix your roadmaps by Monday. I don't want to see any conflicts.",
   "I think there might be some overlap, but maybe it will sort itself out.",
   "Предлагает общую встречу и понятный результат: зависимости и приоритеты.",
   "Приказ без помощи: конфликт зависимостей сам не решится.",
   "Ждёт, что само рассосётся, и конфликт будет расти."),
   build:"let us map the dependencies and agree on shared priorities"},
 sc03:{tone:TN("Ira is burned out after three crunch releases and thinking of leaving. Write your message to Ira.",
   "I want to hear how you're doing. Could we talk privately and you tell me what would help most before the next release?",
   "Everyone is tired. The release is in three weeks, so we have to keep going.",
   "Hi Ira, maybe take some rest, if you want, but we also need you, I guess.",
   "Слушает и спрашивает, что поможет: это забота, а не давление.",
   "Игнорирует усталость, и Ira, скорее всего, уйдёт.",
   "Расплывчатая забота с давлением в конце, без конкретики."),
   build:"i want to hear what would help you most before the next release"},
 b19:{tone:TN("The board asks why you aren't building AI features. Write your reply to Nora.",
   "AI is a tool, not a goal. Our customers' biggest pain is slow reporting, so let's start there and weigh the alternatives.",
   "AI is just hype. We won't build anything with it.",
   "Okay, let's build an AI feature, whatever it is, so the board is happy.",
   "Объясняет, что ИИ только инструмент, и ставит в центр проблему клиентов.",
   "Отвергает тему целиком, не выслушав совет директоров.",
   "Делает функцию ради моды, а не ради пользы."),
   build:"ai is a tool so we start from the biggest customer pain"},
 b20:{tone:TN("The free plan costs 30% of infrastructure but drives signups. Write your reply to Priya.",
   "Let's analyze free-to-paid conversion and cost per free user. Then we can test tighter limits instead of removing the free plan.",
   "Remove the free plan. It costs too much.",
   "Hmm, I'm not sure, maybe keep it, maybe remove it, what do you think?",
   "Предлагает данные и эксперимент вместо резкого решения.",
   "Убирает источник регистраций без проверки.",
   "Нет ни позиции, ни плана."),
   build:"let us test tighter limits instead of removing the free plan"},
 b45:{tone:TN("A competitor cut its price by 30%, and the CEO asks whether to match it. Write your reply to Nora.",

};
var LX_TONE_XP=5,LX_VOICE_XP=5,LX_TEXT_XP=3,LX_TRIES=3;
var SR_API=window.SpeechRecognition||window.webkitSpeechRecognition||null;
var lxRec=null;
var NUMW={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten'};
function spNorm(t){
  t=String(t).toLowerCase().replace(/[‘’ʼ`]/g,"'");
  t=t.replace(/\b(it|that|what|there|here|who|he|she)'s\b/g,'$1 is').replace(/\blet's\b/g,'let us');
  t=t.replace(/\bcan't\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/\bcannot\b/g,'can not');
  t=t.replace(/n't\b/g,' not').replace(/'ll\b/g,' will').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ve\b/g,' have').replace(/'d\b/g,' would');
  t=t.replace(/%/g,' percent').replace(/[^a-z0-9' ]+/g,' ').replace(/'/g,'');
  return t.split(/\s+/).filter(Boolean).map(function(w){return NUMW[w]||w;});
}
function spLcs(a,b){
  var m=a.length,n=b.length,prev=new Array(n+1).fill(0);
  for(var i=1;i<=m;i++){var cur=[0];for(var j=1;j<=n;j++){cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]);}prev=cur;}
  return prev[n];
}
function spScore(target,said){
  var a=spNorm(target),b=spNorm(said);if(!a.length||!b.length)return 0;
  var l=spLcs(a,b);
  return Math.min(l/a.length,l/b.length);
}
function lxBlocks(text){
  var w=text.toLowerCase().replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean),n=w.length,size=n<=8?1:2,out=[];
  for(var i=0;i<n;i+=size)out.push(w.slice(i,i+size).join(' '));
  return out;
}
function lxOrder(n){var o,g=0;do{o=shuffle(n);g++;}while(n>1&&g<20&&o.every(function(v,i){return v===i;}));return o;}
function hasLx(c){return !!LX[c.id];}
function lxStart(cur){
  var L=LX[cur.c.id],bl=lxBlocks(L.build);
  cur.x={stage:'tone',L:L,tOrder:shuffle(L.tone.opts.length),tChosen:null,
    blocks:bl,bOrder:lxOrder(bl.length),mode:'voice',state:'idle',live:'',said:'',err:'',tries:0,result:null,typed:'',picked:[],xp:0};
  render();window.scrollTo(0,0);
}
function lxSeen(id,k){var e=S.lx[id]||{};return !!e[k];}
function lxMark(id,k,xp,cur){
  if(!S.lx[id])S.lx[id]={};
  if(!S.lx[id][k]){S.lx[id][k]=1;var g=cur.retry?Math.round(xp/2):xp;S.xp+=g;cur.x.xp+=g;cur.earned+=g;return g;}
  return 0;
}
function lxErr(e){try{var el=document.getElementById('lxerr');var m='Something went wrong: '+(e&&e.message?e.message:e);if(el)el.textContent=m;else toast(m);}catch(_){}}
function lxTone(k){
  var cur=ui.cur,x=cur&&cur.x;if(!x||x.tChosen!==null)return;
  try{
    var oi=x.tOrder[k],ok=!!x.L.tone.opts[oi].ok;
    try{markActive();}catch(e){}
    var g=0;try{g=lxMark(cur.c.id,'t',ok?LX_TONE_XP:0,cur);}catch(e){}
    x.tGain=ok?g:0;x.tChosen=oi;
    try{save();}catch(e){}
    render();
  }catch(e){x.tChosen=null;render();lxErr(e);return;}
  autoScrollNext();
}
function lxToBuild(){var x=ui.cur.x;x.stage='build';render();window.scrollTo(0,0);}
function lxLit(x,said){
  var tw=spNorm(said),k=0,lit=[];
  for(var b=0;b<x.blocks.length;b++){
    var bw=spNorm(x.blocks[b]),all=bw.length>0;
    for(var i=0;i<bw.length;i++){var f=-1;for(var y=k;y<tw.length;y++){if(tw[y]===bw[i]){f=y;break;}}if(f===-1){all=false;break;}k=f+1;}
    lit.push(all);if(!all)break;
  }
  return lit;
}
function lxPaint(){
  var x=ui.cur&&ui.cur.x;if(!x)return;
  var src=x.mode==='text'?x.typed:(x.live||x.said),lit=lxLit(x,src);
  for(var b=0;b<x.blocks.length;b++){var el=document.getElementById('lxb'+b);if(el){if(lit[b])el.classList.add('lit');else el.classList.remove('lit');}}
  var lv=document.getElementById('lxlive');if(lv)lv.textContent=x.live?('“'+x.live+'”'):(x.state==='listening'?'Listening...':'Tap and speak');
}
function lxMic(){
  var x=ui.cur&&ui.cur.x;if(!x)return;
  if(x.state==='listening'){try{lxRec&&lxRec.stop();}catch(e){}return;}
  if(!SR_API){x.err='nosupport';render();return;}
  try{lxRec=new SR_API();lxRec.lang='en-US';lxRec.interimResults=true;lxRec.continuous=false;lxRec.maxAlternatives=3;}
  catch(e){x.err='nosupport';render();return;}
  x.state='listening';x.live='';x.err='';
  var finals=[],got=false;
  lxRec.onresult=function(ev){
    var txt='',pre='';
    for(var i=0;i<ev.results.length;i++){txt+=ev.results[i][0].transcript+' ';if(i<ev.results.length-1)pre+=ev.results[i][0].transcript+' ';}
    x.live=txt.trim();
    var r=ev.results[ev.results.length-1];
    if(r.isFinal){got=true;finals=[];for(var a=0;a<r.length;a++)finals.push((pre+r[a].transcript).trim());}
    lxPaint();
  };
  lxRec.onerror=function(ev){x.err=ev.error||'error';};
  lxRec.onend=function(){
    if(!ui.cur||ui.cur.x!==x)return;
    x.state='idle';
    if(!got&&x.live){finals=[x.live];got=true;}
    if(got)lxCheck(finals,'voice');else render();
  };
  try{lxRec.start();}catch(e){x.state='idle';x.err='start';}
  render();
}
function lxCheck(alts,via){
  var cur=ui.cur,x=cur.x,best=0,bt=alts[0]||'';
  alts.forEach(function(t){var s=spScore(x.L.build,t);if(s>best){best=s;bt=t;}});

  PMSNAP={LEVELS:LEVELS,ROLES:ROLES,CASES:CASES,PLAN:PLAN,BONUS:BONUS,STORY:STORY,END_STORY:END_STORY,BOSSINTRO:BOSSINTRO,PROMO:PROMO,ARTICLES:ARTICLES,EVENTS:EVENTS,EVCASES:EVCASES,LX:LX,RP:RP,OPENERS:OPENERS,ONB:ONB};
}
function buildTrack(id){
  var j=TRACK_JSON[id],m=trackMeta(id),cs=j.cases,by={};
  cs.forEach(function(c){if(c.meters)c.scn=true;by[c.id]=c;c.steps.forEach(function(s){if(!s.words)s.words=[];});});
  var boss=j.plan.map(function(p,g){
    var b=by[p.boss],ch=b.sender.channel==='Email'?'by email':'in '+b.sender.channel;
    return {en:'This chapter ends with a boss case. '+b.sender.name+', '+b.sender.role+', is about to write to you '+ch+' and needs a good decision. Take your time and think about every answer.'};
  });
  var promo=[null];
  for(var g=1;g<j.levels.length;g++)promo.push('Your work was noticed, and the company trusts you with more. '+firstSentence(j.roles[g].en));
  return {LEVELS:j.levels,ROLES:j.roles,CASES:cs,PLAN:j.plan,BONUS:j.bonus,
    STORY:j.story.map(function(s){return typeof s==='string'?{en:s}:s;}),END_STORY:{en:j.endStory},BOSSINTRO:boss,PROMO:promo,
    ARTICLES:[],EVENTS:[],EVCASES:[],LX:j.lx||{},RP:[],OPENERS:OPENERS_GEN,
    ONB:onbFor(m,j.levels[0].n,j.levels[j.levels.length-1].n,false)};
}
function dataFor(id){if(id==='product')return PMSNAP;return TDATA[id]||(TDATA[id]=buildTrack(id));}
function applyTrack(id){
  var d=dataFor(id);
  LEVELS=d.LEVELS;ROLES=d.ROLES;CASES=d.CASES;PLAN=d.PLAN;BONUS=d.BONUS;STORY=d.STORY;END_STORY=d.END_STORY;
  BOSSINTRO=d.BOSSINTRO;PROMO=d.PROMO;ARTICLES=d.ARTICLES;EVENTS=d.EVENTS;EVCASES=d.EVCASES;LX=d.LX;RP=d.RP;OPENERS=d.OPENERS;ONB=d.ONB;
  if(CUR_TRACK!==id)ui.practice=null;
  CUR_TRACK=id;
  AMAP={};ARTICLES.forEach(function(a){AMAP[a.id]=a;});
  BYID={};CASES.forEach(function(c){BYID[c.id]=c;});
  WORDS=allWords();
  EVCASES.forEach(function(c){BYID[c.id]=c;c.steps.forEach(function(s){s.words.forEach(function(w){var k=w.w.toLowerCase();if(!WORDS[k])WORDS[k]=w;});});});
  FLAT=[];
  PLAN.forEach(function(p,g){
    var ids=p.b.concat(p.s);
    ids.forEach(function(x,i){FLAT.push({g:g,i:i,id:x,boss:false,n:ids.length+1});});
    FLAT.push({g:g,i:ids.length,id:p.boss,boss:true,n:ids.length+1});
  });
  CASES.forEach(function(c){c.steps.forEach(function(s){s.words.forEach(function(w){var k=w.w.toLowerCase();if(/^[a-z]+$/.test(k)&&!TR[k])TR[k]=[w.ru];});});});
  if(S&&(S.pass===null||S.pass===undefined)){
    S.pass=[];var mx=-1;
    FLAT.forEach(function(f){if(S.skip.indexOf(f.id)>-1&&f.g>mx)mx=f.g;});
    for(var g=0;g<=mx;g++)S.pass.push(g);
  }
  try{document.title=trackMeta(id).name;}catch(e){}
}
function trackName(){return trackMeta(CUR_TRACK||'product').name;}
function trackShort(){return trackMeta(CUR_TRACK||'product').short;}
function newState(){var s=defaultState();s.rt=RESET_TAG;if(S){s.onb=S.onb;s.onb2=S.onb2;}return s;}
function packAll(){if(TK)STATES[TK]=S;return {v:2,cur:TK,st:STATES};}
function loadAll(d){
  STATES={};TK=null;
  if(d&&d.v===2&&d.st&&typeof d.st==='object'){
    Object.keys(d.st).forEach(function(k){if(TRACKS.some(function(t){return t.id===k;}))STATES[k]=merge(d.st[k]);});
    TK=(d.cur&&STATES[d.cur])?d.cur:null;
  }else if(d&&typeof d==='object'&&Object.keys(d).length){
    STATES.product=merge(d);TK='product';
  }
  S=TK?STATES[TK]:defaultState();
}
function mergeAlls(a,b){
  var out={v:2,cur:a.cur||b.cur||null,st:{}},ids={};
  Object.keys(a.st||{}).forEach(function(k){ids[k]=1;});Object.keys(b.st||{}).forEach(function(k){ids[k]=1;});
  Object.keys(ids).forEach(function(k){
    var x=a.st&&a.st[k],y=b.st&&b.st[k];
    out.st[k]=(x&&y)?better(merge(x),merge(y)):(x||y);
  });
  if(out.cur&&!out.st[out.cur])out.cur=b.cur&&out.st[b.cur]?b.cur:null;
  return out;
}
function remoteAll(data){
  var r=null;
  try{
    if(data.all){r=JSON.parse(data.all);}
    else if(data.data){r={v:2,cur:'product',st:{product:JSON.parse(data.data)}};}
  }catch(e){r=null;}
  return r;
}
function selectTrack(id){
  if(TK)STATES[TK]=S;
  if(!STATES[id])STATES[id]=newState();
  TK=id;S=STATES[id];applyTrack(id);
  ui.pr=null;ui.rp=null;ui.evi=undefined;ui.lvlUp=null;ui.lvlNext=null;ui.onb=null;ui.q='';ui.filter='all';ui.lastRand='';ui.artG=0;
  save();
  go('home');
  if(!S.onb||!S.onb2){ui.onb={i:0};render();}
}
function trackProgress(id){
  var d=dataFor(id),st=(id===TK)?S:STATES[id];
  var total=0,done=0,chap=0,found=false;
  d.PLAN.forEach(function(p,g){
    var ids=p.b.concat(p.s,[p.boss]);
    ids.forEach(function(x){
      total++;
      var c=null;for(var i=0;i<d.CASES.length;i++){if(d.CASES[i].id===x){c=d.CASES[i];break;}}
      var ok=!!st&&c&&c.steps.every(function(s,i2){return st.done.indexOf(c.id+':'+i2)>-1;});
      if(ok)done++;else if(!found){found=true;chap=g;}
    });
  });
  return {total:total,done:done,chap:found?chap:d.PLAN.length-1,xp:st?st.xp:0,started:!!st};
}
function trackTopics(id){
  var d=dataFor(id),cnt={},order=[];
  d.CASES.forEach(function(c){if(c.type!=='base')return;if(!cnt[c.topic]){cnt[c.topic]=0;order.push(c.topic);}cnt[c.topic]++;});
  order.sort(function(a,b){return cnt[b]-cnt[a]||order.indexOf(a)-order.indexOf(b);});
  return order.slice(0,6);
}
function toggleTk(id){ui.tkOpen=ui.tkOpen||{};ui.tkOpen[id]=!ui.tkOpen[id];var y=$app.scrollTop;render();$app.scrollTop=y;}
function tracksView(){
  var h='';
  if(TK)h+='<div class="top"><button class="back" onclick="go(\'home\')" aria-label="Back">'+BACK_SVG+'</button></div>';
  h+='<h1>'+(TK?'Change track':'Choose your track')+'</h1><div class="sub">Each track is its own career path with its own cases, words and progress. You can switch at any time, and your progress in every track is kept.</div>';
  TRACKS.forEach(function(m){
    var d=dataFor(m.id),pr=trackProgress(m.id),cur=(m.id===TK);
    var lv=d.LEVELS,tag=cur?'Current track':(pr.started&&(pr.done>0||pr.xp>0)?'In progress':'New');
    var open=!!(ui.tkOpen&&ui.tkOpen[m.id]),started=pr.started&&(pr.done>0||pr.xp>0);
    h+='<div class="tcard'+(cur?' cur':'')+(open?' open':'')+'"><button class="thead" onclick="toggleTk(\''+m.id+'\')" aria-expanded="'+open+'"><div><small>'+tag+'</small><h2>'+esc(m.name)+'</h2></div><em>'+(open?'Hide':'Details')+'</em></button>';
    if(open){
      h+='<div class="tbody"><p>'+esc(m.en)+'</p><p class="ru">'+esc(m.ru)+'</p>'+
      '<div class="tpath"><b>Career path</b><span>'+esc(lv[0].n)+' to '+esc(lv[lv.length-1].n)+'</span></div>'+
      '<div class="chips">'+trackTopics(m.id).map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('')+'</div>'+
      '<div class="tmeta"><span>'+pr.total+' levels</span><span>'+d.PLAN.length+' chapters</span><span>'+esc(m.company)+'</span></div>';
      if(started)h+='<div class="tprog"><div class="bar"><i style="width:'+Math.round(pr.done/pr.total*100)+'%"></i></div><span>Chapter '+(pr.chap+1)+' of '+d.PLAN.length+', '+pr.done+' of '+pr.total+' levels, '+pr.xp+' XP</span></div>';
      h+='<button class="cta'+(cur?' alt':'')+'" onclick="'+(cur?'go(\'home\')':'selectTrack(\''+m.id+'\')')+'">'+(cur?'Back to this track':(started?'Continue':'Start this track'))+'</button></div>';
    }
    h+='</div>';
  });
  return h;
}
/* ---- chapter score gate: the next chapter opens at PASS_PCT of the points ---- */
function stepMax(s,c){var m=0;s.options.forEach(function(o){if(o.p!==undefined&&o.p>m)m=o.p;});return m||(c.type==='special'?20:10);}
function caseScore(c){
  var e=0,m=0;
  c.steps.forEach(function(s,i){
    var mx=stepMax(s,c),p=S.pts[c.id+':'+i];
    if(p===undefined)p=stepDone(c,i)?mx:0;
    m+=mx;e+=Math.min(p,mx);
  });
  return {e:e,m:m,pct:m?e/m:1};
}
function gradeScore(g){
  var e=0,m=0;
  gSlice(g).forEach(function(f){var s=caseScore(BYID[f.id]);e+=s.e;m+=s.m;});
  return {e:e,m:m,pct:m?e/m:1};
}
function gradePassed(g){
  if(g<0)return true;
  if(S.pass.indexOf(g)>-1)return true;
  if(!gStats(g).complete)return false;
  if(gradeScore(g).pct>=PASS_PCT-1e-9){S.pass.push(g);return true;}
  return false;
}
function weakIdx(g){
  var best=-1,bp=2;
  FLAT.forEach(function(f,i){
    if(f.g!==g||!fDone(f))return;
    var s=caseScore(BYID[f.id]);
    if(s.pct<bp){bp=s.pct;best=i;}
  });
  if(best<0){for(var i=0;i<FLAT.length;i++){if(FLAT[i].g===g)return i;}}
  return best;
}
function gateBlocked(){var ci=curIdx();return (ci<FLAT.length&&fDone(FLAT[ci]))?FLAT[ci].g:-1;}
function passTxt(){return Math.round(PASS_PCT*100)+'%';}
function recPts(c,cur,base){
  if(cur.mode==='skip'||cur.mode==='event'||c.ev)return;
  var k=c.id+':'+cur.step,mx=stepMax(c.steps[cur.step],c),prev=S.pts[k];
  if(prev===undefined)prev=(cur.retry&&stepDone(c,cur.step))?mx:0;
  S.pts[k]=Math.min(mx,Math.max(prev,base));
}

/* Reviewed career content is applied before any track snapshot or saved state is loaded. */
function applyCareerContent(){
  var tracks=CAREER_CONTENT.tracks,p=tracks.product;
  CASES=p.cases;LX=p.lx;STORY=p.story;ROLES=p.roles;
  END_STORY={en:p.endStory};
  ['dev','pm','an','ba'].forEach(function(id){TRACK_JSON[id]=tracks[id];});
}
/* ================= BOOT ================= */
applyCareerContent();
snapPM();
render();
var RESET_TAG='reset-2026-10-25';
initStore().then(function(){
  var rs=false;
  Object.keys(STATES).forEach(function(k){if(STATES[k].rt!==RESET_TAG){STATES[k]=defaultState();STATES[k].rt=RESET_TAG;rs=true;}});
  if(TK){S=STATES[TK];applyTrack(TK);}else{S=defaultState();S.rt=RESET_TAG;}
  if(rs)save();
  ui.loaded=true;
  if(TK&&(!S.onb||!S.onb2))ui.onb={i:0};
  render();initCloud();});
setTimeout(function(){var e=document.getElementById('splash');if(!e)return;e.classList.add('out');setTimeout(function(){e.remove();},500);},2100);

</script>
